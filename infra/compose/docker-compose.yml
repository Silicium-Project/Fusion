name: ${SILICIUM_COMPOSE_PROJECT_NAME:-silicium}
services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - ${SILICIUM_DATA_ROOT:-/var/lib/silicium}/postgres:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 12
  turn:
    image: coturn/coturn:4.6.2@sha256:4873c54f213ec81f6b4c4c4938b69c922f50b2293ded427f5191472b9a127227
    restart: unless-stopped
    command:
    - -n
    - --log-file=stdout
    - --no-cli
    - --lt-cred-mech
    - --realm=vps-910c1dbc.vps.ovh.net
    - --user=${SILICIUM_TURN_USER:-silicium}:${SILICIUM_TURN_PASSWORD:?TURN password
      required}
    - --external-ip=${SILICIUM_TURN_EXTERNAL_IP:-213.32.68.67}
    - --listening-port=3478
    - --tls-listening-port=5349
    - --cert=/etc/coturn/fullchain.pem
    - --pkey=/etc/coturn/privkey.pem
    - --min-port=49160
    - --max-port=49200
    ports:
    - ${SILICIUM_TURN_PORT:-3478}:3478/tcp
    - ${SILICIUM_TURN_PORT:-3478}:3478/udp
    - ${SILICIUM_TURN_TLS_PORT:-5349}:5349/tcp
    - ${SILICIUM_TURN_RELAY_MIN_PORT:-49160}-${SILICIUM_TURN_RELAY_MAX_PORT:-49200}:49160-49200/udp
    volumes:
    - ${SILICIUM_DATA_ROOT:-/var/lib/silicium}/coturn/fullchain.pem:/etc/coturn/fullchain.pem:ro
    - ${SILICIUM_DATA_ROOT:-/var/lib/silicium}/coturn/privkey.pem:/etc/coturn/privkey.pem:ro
    networks:
    - backend
  backend:
    image: ${SILICIUM_API_IMAGE:?immutable image required}
    restart: unless-stopped
    env_file:
    - ${SILICIUM_CONFIG_DIR:-/etc/silicium}/backend.env
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}
        dbname=${POSTGRES_DB} port=5432 sslmode=disable
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${SILICIUM_CORS_ALLOWED_ORIGINS:-https://vps-910c1dbc.vps.ovh.net}
      SILICIUM_NODE_API_URL: http://host.docker.internal:${SILICIUM_ORCHESTRATOR_PORT:-46100}
      SILICIUM_NODE_CONTROL_TOKEN: ${SILICIUM_NODE_CONTROL_TOKEN:-}
      SILICIUM_NODE_CONTAINER_DATA_ROOT: /var/lib/silicium
      SILICIUM_NODE_HOST_DATA_ROOT: ${SILICIUM_DATA_ROOT:-/var/lib/silicium}
      SILICIUM_RELEASE_CHANNEL: ${SILICIUM_RELEASE_CHANNEL:-prod}
      SILICIUM_RELEASE_VERSION: ${SILICIUM_RELEASE_VERSION:-unknown}
      SILICIUM_RELEASE_BUILD: ${SILICIUM_RELEASE_BUILD:-local}
      SILICIUM_ORCHESTRATOR_EXPORT_DIR: /var/lib/silicium/network/orchestrator/export
      SILICIUM_SITE_STORAGE_DIR: /var/lib/silicium/site/jobs
      SILICIUM_WORKLOAD_STORAGE_DIR: /var/lib/silicium/site/runtime
      SILICIUM_DEVICE_PAIRING_DIR: /var/lib/silicium/miniworker-pairing
      SILICIUM_SOLANA_RPC: ${SILICIUM_SOLANA_RPC:-https://api.devnet.solana.com}
      SILICIUM_SOLANA_PROGRAM_ID: ${SILICIUM_SOLANA_PROGRAM_ID:?program ID must be
        configured}
      SILICIUM_SIL_MINT: ${SILICIUM_SIL_MINT:-F5zPejtGPm2eqG1hwFGof6uWVJ79LDKeKYDVifXqhPRP}
      SILICIUM_SOLANA_PAYMENTS_ENABLED: ${SILICIUM_SOLANA_PAYMENTS_ENABLED:-0}
      SILICIUM_RELEASE_ID: ${SILICIUM_RELEASE_ID:?release ID required}
      SILICIUM_MANIFEST_DIGEST: ${SILICIUM_MANIFEST_DIGEST:?manifest digest required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 127.0.0.1:${SILICIUM_BACKEND_HTTP_PORT:-8080}:8080
    - ${SILICIUM_BACKEND_P2P_PORT:-46102}:46102/tcp
    - ${SILICIUM_BACKEND_P2P_PORT:-46102}:46102/udp
    extra_hosts:
    - host.docker.internal:${SILICIUM_HOST_GATEWAY:-host-gateway}
    volumes:
    - ${SILICIUM_DATA_ROOT:-/var/lib/silicium}:/var/lib/silicium
    networks:
    - backend
  frontend:
    restart: unless-stopped
    env_file:
    - ${SILICIUM_CONFIG_DIR:-/etc/silicium}/frontend.env
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_UPDATE_MANIFEST_URL: /downloads/update-manifest.json
      NUXT_PUBLIC_ORCHESTRATOR_URL: ${SILICIUM_PUBLIC_ORCHESTRATOR_URL:-https://vps-910c1dbc.vps.ovh.net/orchestrator}
      NUXT_PUBLIC_STATUS_REFRESH_SECONDS: '30'
      NUXT_PUBLIC_RELEASE_CHANNEL: ${SILICIUM_RELEASE_CHANNEL:-prod}
      NUXT_PUBLIC_RELEASE_VERSION: ${SILICIUM_RELEASE_VERSION:-unknown}
      NUXT_PUBLIC_RELEASE_BUILD: ${SILICIUM_RELEASE_BUILD:-local}
      NUXT_PUBLIC_SIL_MINT: ${SILICIUM_SIL_MINT:-}
      NUXT_PUBLIC_SOLANA_RPC: ${SILICIUM_SOLANA_BROWSER_RPC:-https://solana-devnet.api.onfinality.io/public}
      NUXT_PUBLIC_SOLANA_CLUSTER: ${SILICIUM_SOLANA_CLUSTER:-devnet}
      NUXT_PUBLIC_SIL_POOL_ID: ${SILICIUM_SIL_POOL_ID:-66Un5iGRBuzE4kcVQkDkKrtZUVnTiXnxpUHoFL3mEsdS}
      NUXT_PUBLIC_SOLANA_PAYMENTS_ENABLED: ${SILICIUM_SOLANA_PAYMENTS_ENABLED:-0}
      NUXT_PUBLIC_RELEASE_ID: ${SILICIUM_RELEASE_ID:?release ID required}
      NUXT_PUBLIC_MANIFEST_DIGEST: ${SILICIUM_MANIFEST_DIGEST:?manifest digest required}
    ports:
    - 127.0.0.1:${SILICIUM_FRONTEND_HTTP_PORT:-3000}:3000
    networks:
    - frontend
    image: ${SILICIUM_WEB_IMAGE:?immutable image required}
  reputation_bridge:
    restart: unless-stopped
    environment:
    - LISTEN_ADDR=0.0.0.0:9091
    ports:
    - 127.0.0.1:${SILICIUM_REPUTATION_HTTP_PORT:-9091}:9091
    networks:
    - backend
    image: ${SILICIUM_NETWORK_IMAGE:?immutable image required}
    entrypoint:
    - /usr/local/bin/reputation_bridge
  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
    - backend
    - reputation_bridge
    - frontend
    ports:
    - ${SILICIUM_PROXY_BIND_ADDRESS:-0.0.0.0}:${SILICIUM_PROXY_HTTP_PORT:-80}:80
    - ${SILICIUM_PROXY_BIND_ADDRESS:-0.0.0.0}:${SILICIUM_PROXY_HTTPS_PORT:-443}:443
    extra_hosts:
    - host.docker.internal:${SILICIUM_HOST_GATEWAY:-host-gateway}
    volumes:
    - ${SILICIUM_NGINX_CONFIG:-./nginx.conf}:/etc/nginx/nginx.conf:ro
    - ${SILICIUM_DATA_ROOT:-/var/lib/silicium}:/var/lib/silicium:ro
    - ${SILICIUM_TLS_ROOT:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks:
    - backend
    - frontend
networks:
  backend:
    name: ${SILICIUM_BACKEND_NETWORK_NAME:-silicium-backend}
  frontend:
    name: ${SILICIUM_FRONTEND_NETWORK_NAME:-silicium-frontend}
