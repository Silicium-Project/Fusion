server {
  listen 8080;
  server_name _;
  client_max_body_size 16k;

  location = /devices/pair {
    limit_except POST { deny all; }
    proxy_pass http://backend:8080/devices/pair;
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    return 404;
  }
}
