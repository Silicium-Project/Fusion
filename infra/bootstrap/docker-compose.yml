services:
  silicium-bootstrap:
    build:
      context: ../../networked
      dockerfile: p2p_node/Dockerfile
    image: ghcr.io/silicium-project/silicium-node:bootstrap
    container_name: silicium-bootstrap
    restart: unless-stopped
    environment:
      API_PORT: "9092"
      COMPUTE_DAEMON_URL: "http://127.0.0.1:9090"
      REPUTATION_BRIDGE_URL: "http://127.0.0.1:9091"
      SILICIUM_DATA_DIR: "/data"
      SILICIUM_ENABLE_QUIC_LISTENER: "1"
      SILICIUM_BOOTSTRAP_PEERS: "${SILICIUM_BOOTSTRAP_PEERS:-}"
      SILICIUM_HW_BUCKET: "${SILICIUM_HW_BUCKET:-0}"
      SILICIUM_DISPATCH_SEED: "${SILICIUM_DISPATCH_SEED:-7}"
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "9092:9092/tcp"
    volumes:
      - silicium-bootstrap-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9092/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  silicium-bootstrap-data:
