x-silicium-node-base: &silicium-node-base
  build:
    context: .
  image: ${SILICIUM_IMAGE:-network/silicium-node}
  tty: true
  working_dir: /workspace
  security_opt:
    - label=disable

x-workspace-volume: &workspace-volume ${WORKSPACE_ROOT:-..}:/workspace:Z
x-public-dns: &public-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  silicium-node:
    <<: [*silicium-node-base, *public-dns]
    command: ["silicium-node", "start", "--network", "testnet"]
    ports:
      - "8899:8899"
      - "8000-8020:8000-8020"
    volumes:
      - *workspace-volume
      - ledger-testnet:/home/solana/.silicium/ledger
    environment:
      SILICIUM_NETWORK: testnet
      SILICIUM_RPC_BIND_ADDRESS: 0.0.0.0

  silicium-localnet:
    <<: *silicium-node-base
    command: ["silicium-node", "start", "--network", "silicium"]
    ports:
      - "8900:8899"
      - "8100-8120:8000-8020"
    volumes:
      - *workspace-volume
      - ledger-local:/home/solana/.silicium/ledger
    environment:
      SILICIUM_NETWORK: silicium
      SILICIUM_RPC_PORT: 8899
      SILICIUM_RPC_BIND_ADDRESS: 0.0.0.0
      SILICIUM_DYNAMIC_PORT_RANGE: 8000-8020
      SILICIUM_LOCAL_RESET: "false"
      SILICIUM_CLI_URL: http://127.0.0.1:8899

  silicium-devnet:
    <<: [*silicium-node-base, *public-dns]
    command: ["silicium-node", "start", "--network", "devnet"]
    ports:
      - "8910:8899"
      - "8200-8220:8000-8020"
    volumes:
      - *workspace-volume
      - ledger-devnet:/home/solana/.silicium/ledger
    environment:
      SILICIUM_NETWORK: devnet
      SILICIUM_RPC_PORT: 8899
      SILICIUM_RPC_BIND_ADDRESS: 0.0.0.0
      SILICIUM_DYNAMIC_PORT_RANGE: 8000-8020
      SILICIUM_CLI_URL: https://api.devnet.solana.com
    profiles:
      - devnet

  silicium-mainnet:
    <<: [*silicium-node-base, *public-dns]
    command: ["silicium-node", "start", "--network", "mainnet"]
    ports:
      - "8920:8899"
      - "8300-8320:8000-8020"
    volumes:
      - *workspace-volume
      - ledger-mainnet:/home/solana/.silicium/ledger
    environment:
      SILICIUM_NETWORK: mainnet
      SILICIUM_RPC_PORT: 8899
      SILICIUM_RPC_BIND_ADDRESS: 0.0.0.0
      SILICIUM_DYNAMIC_PORT_RANGE: 8000-8020
      SILICIUM_CLI_URL: https://api.mainnet-beta.solana.com
    profiles:
      - mainnet

  silicium-proxy:
    image: caddy:2.7.6-alpine
    command: ["/bin/sh", "/silicium/caddy-entrypoint.sh"]
    ports:
      - "${PROXY_HTTPS_PORT:-9443}:443"
      - "${PROXY_HTTP_PORT:-9080}:80"
    environment:
      PROXY_SITE_ADDRESS: :443
      PROXY_UPSTREAM_HOST: silicium-localnet
      PROXY_UPSTREAM_PORT: 8899
      PROXY_TLS_MODE: local
      PROXY_TLS_EMAIL: ""
      PROXY_TLS_CERT_PATH: /etc/caddy/certs/tls.crt
      PROXY_TLS_KEY_PATH: /etc/caddy/certs/tls.key
    volumes:
      - ${WORKSPACE_ROOT:-..}/infra/docker/reverse-proxy/caddy-entrypoint.sh:/silicium/caddy-entrypoint.sh:ro
      - ${WORKSPACE_ROOT:-..}/infra/docker/reverse-proxy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - label=disable
    profiles:
      - proxy

  proxy-smoke-target:
    image: hashicorp/http-echo:1.0.0
    command:
      - "-listen=:8899"
      - "-text={\"status\":\"ok\"}"
    expose:
      - "8899"
    profiles:
      - smoke

volumes:
  caddy-data:
  caddy-config:
  ledger-local:
    name: ${SILICIUM_LEDGER_PREFIX:-silicium}-local-ledger
  ledger-devnet:
    name: ${SILICIUM_LEDGER_PREFIX:-silicium}-devnet-ledger
  ledger-testnet:
    name: ${SILICIUM_LEDGER_PREFIX:-silicium}-testnet-ledger
  ledger-mainnet:
    name: ${SILICIUM_LEDGER_PREFIX:-silicium}-mainnet-ledger
