name: Investigation bornée
description: Lever une incertitude avec une méthode et un livrable précis.
title: '[Investigation] '
type: Task
projects:
- Silicium-Project/12
body:
- type: markdown
  attributes:
    value: Consultez les issues existantes et le Project commun. Ne publiez aucune clé, jeton, donnée
      personnelle ou contenu confidentiel. Une demande est à qualifier avant tout engagement.
- type: textarea
  id: question
  attributes:
    label: Question à résoudre
    description: Hypothèse précise, contexte et décision rendue possible par le résultat.
  validations:
    required: true
- type: textarea
  id: method
  attributes:
    label: Méthode et limites
    description: Sources, commandes ou protocole ; distinguer inspection statique, mesure et simulation.
      Borner le travail.
  validations:
    required: true
- type: textarea
  id: deliverable
  attributes:
    label: Livrable et condition d’arrêt
    description: Rapport, ADR, mesure ou prototype ; un résultat négatif étayé peut constituer une réussite.
  validations:
    required: true
- type: textarea
  id: validation
  attributes:
    label: Validation des conclusions
    description: Oracle, contre-exemples, provenance, reproductibilité et incertitude.
  validations:
    required: true
- type: textarea
  id: links
  attributes:
    label: Parent et suites possibles
    description: Liens complets vers spécifications et décisions ; ne pas engager implicitement l’implémentation.
  validations:
    required: false
