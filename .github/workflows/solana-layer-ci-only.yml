name: Solana Layer CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "solana-layer/**"
      - ".github/workflows/solana-layer-ci-only.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "solana-layer/**"
      - ".github/workflows/solana-layer-ci-only.yml"
  workflow_dispatch:

jobs:
  anchor-build-and-test:
    name: Build and test Anchor program
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: solana-layer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: solana-layer/yarn.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana-layer/target
          key: ${{ runner.os }}-cargo-solana-layer-${{ hashFiles('solana-layer/Cargo.lock', 'solana-layer/programs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-solana-layer-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.31.1
          avm use 0.31.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Create temporary local wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json
          solana config set --url localhost
          solana address

      - name: Sync Anchor program IDs
        run: anchor keys sync

      - name: Build Anchor program
        run: anchor build

      - name: Run Anchor tests on localnet
        run: anchor test --provider.cluster localnet

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solana-layer-idl
          path: |
            solana-layer/target/idl/*.json
            solana-layer/target/types/*.ts
          if-no-files-found: warn

      - name: Upload program binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solana-layer-program-binary
          path: solana-layer/target/deploy/*.so
          if-no-files-found: warn
