name: Node GUI quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  submodule-ci-gate:
    uses: ./.github/workflows/submodule-ci-gate.yml
    secrets: inherit

  test-and-build:
    needs: [submodule-ci-gate]
    runs-on: [self-hosted, fusion-linux]
    defaults:
      run:
        working-directory: apps/silicium-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
