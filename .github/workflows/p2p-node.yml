name: P2P Node CI

on:
  push:
    branches:
      - main
      - "issue/**"
    paths:
      - "networked/p2p_node/**"
      - "networked/silicium_node_core/**"
      - ".github/workflows/p2p-node.yml"
      - "infra/bootstrap/**"
  pull_request:
    branches: [main]
    paths:
      - "networked/p2p_node/**"
      - "networked/silicium_node_core/**"
      - ".github/workflows/p2p-node.yml"
      - "infra/bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - networked/silicium_node_core
          - networked/p2p_node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test

      - name: P2P Kademlia smoke
        if: matrix.crate == 'networked/p2p_node'
        run: bash ./ci/p2p_kademlia_smoke.sh

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            crossbuild-essential-arm64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Build target
        env:
          CC_aarch64_unknown_linux_gnu: /usr/bin/aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/aarch64-linux-gnu-gcc
        run: cargo build --release --manifest-path networked/p2p_node/Cargo.toml --target ${{ matrix.target }}

  docker-image:
    runs-on: ubuntu-latest
    needs: [lint-test, cross-build]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: networked
          file: networked/p2p_node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/silicium-project/silicium-node:latest
            ghcr.io/silicium-project/silicium-node:${{ github.sha }}
