name: Mirror Fusion to Epitech

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submodule-ci-gate:
    uses: ./.github/workflows/submodule-ci-gate.yml
    secrets: inherit

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    needs: [submodule-ci-gate]
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Mirror Fusion subtree into Epitech
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.SILICIUM_SYNC_PUSH_TOKEN }}
          DEPLOY_KEY: ${{ secrets.SILICIUM_SYNC_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS }}
          BRANCH: main
          PREFIX: fusion
        run: |
          set -euo pipefail

          if [[ -z "${PUSH_TOKEN:-}" && -z "${DEPLOY_KEY:-}" ]]; then
            echo "::error title=Missing secret::Configure SILICIUM_SYNC_PUSH_TOKEN or SILICIUM_SYNC_DEPLOY_KEY to publish the mirror."
            exit 1
          fi

          workdir="$(mktemp -d)"
          cleanup() {
            rm -rf "$workdir"
          }
          trap cleanup EXIT

          EPITECH_REPO="https://github.com/EpitechPromo2027/G-EIP-600-lil-6-1-eip-luis.fernandes.git"
          SRC_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [[ -n "${PUSH_TOKEN:-}" ]]; then
            git clone "https://x-access-token:${PUSH_TOKEN}@github.com/EpitechPromo2027/G-EIP-600-lil-6-1-eip-luis.fernandes.git" "$workdir/epitech"
          else
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
            if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
              printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            else
              ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            fi
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            git clone "git@github.com:EpitechPromo2027/G-EIP-600-lil-6-1-eip-luis.fernandes.git" "$workdir/epitech"
          fi

          cd "$workdir/epitech"

          git config user.name "Mirror Bot"
          git config user.email "luis.fernandes@epitech.eu"

          git checkout -B main
          git pull --ff-only origin main || true

          NAME=source-remote
          if ! git remote | grep -qx "$NAME"; then
            git remote add "$NAME" "$SRC_URL"
          fi

          git fetch "$NAME" --prune

          if [ ! -d "$PREFIX" ]; then
            git subtree add --prefix="$PREFIX" "$NAME" "$BRANCH" --squash
          else
            git subtree pull --prefix="$PREFIX" "$NAME" "$BRANCH" --squash
          fi

          if ! git diff --quiet origin/main...HEAD; then
            git push origin main
          fi
