name: Mirror Epitech
'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification_run:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: mirror-epitech
  cancel-in-progress: false
jobs:
  mirror:
    if: ${{ github.event.repository.private && github.repository == 'Silicium-Project/Integration' && vars.SILICIUM_MIRROR_ENABLED == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: epitech-mirror
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - name: Mirror exact qualified Workbench composition
      env:
        GH_TOKEN: ${{ github.token }}
        QUALIFICATION_RUN: ${{ inputs.qualification_run || github.event.workflow_run.id }}
        MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        MIRROR_KNOWN_HOSTS: ${{ vars.MIRROR_KNOWN_HOSTS }}
      run: node tools/ci/mirror.mjs
