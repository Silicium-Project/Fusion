name: Host diagnostics
'on':
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, prod]
permissions:
  contents: read
concurrency:
  group: diagnostics-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ !github.event.repository.private && vars.SILICIUM_DIAGNOSTICS_ENABLED == '1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - name: Observe host resources and health
      env:
        RELEASE_CHANNEL: ${{ inputs.environment }}
        DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
        DEPLOY_SSH_USER: silicium-deploy
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      run: node tools/ci/diagnose.mjs
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: host-diagnostics-${{ inputs.environment }}
        path: .artifacts/diagnostics/host.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
