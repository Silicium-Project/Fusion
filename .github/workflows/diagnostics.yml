name: Host diagnostics
'on':
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, prod]
permissions:
  contents: read
concurrency:
  group: diagnostics-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ !github.event.repository.private && vars.SILICIUM_DIAGNOSTICS_ENABLED == '1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Observe host resources and health
      env:
        RELEASE_CHANNEL: ${{ inputs.environment }}
        DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
        DEPLOY_SSH_USER: silicium-deploy
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      run: node tools/ci/diagnose.mjs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: host-diagnostics-${{ inputs.environment }}
        path: .artifacts/diagnostics/host.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
