name: Sync submodule gitlinks

on:
  workflow_dispatch:
  schedule:
    # Development cadence. Raise this interval before the production channel is enabled.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: silicium-submodule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network
          permission-contents: read

      - name: Check out the pinned composition
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' | while read -r key _; do
            git config --global --unset-all "$key" || true
          done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force -- BackEnd FrontEnd Network

      - name: Resolve configured submodule branches
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git switch --detach origin/main
          summary_file="$RUNNER_TEMP/submodule-summary.md"
          : > "$summary_file"
          changed=0
          network_changed=false

          while read -r path_key path; do
            name="${path_key#submodule.}"
            name="${name%.path}"
            branch="$(git config --file .gitmodules --get "submodule.${name}.branch" || true)"
            branch="${branch:-main}"
            old_sha="$(git rev-parse "origin/main:${path}")"

            git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" -C "$path" fetch --quiet origin "$branch"
            new_sha="$(git -C "$path" rev-parse FETCH_HEAD)"

            if [[ "$old_sha" == "$new_sha" ]]; then
              continue
            fi

            git update-index --add --cacheinfo "160000,${new_sha},${path}"
            if [[ "$path" == "Network" ]]; then
              network_changed=true
            fi
            printf -- '- `%s`: `%s` -> `%s` (`%s`)\n' \
              "$path" "${old_sha:0:12}" "${new_sha:0:12}" "$branch" >> "$summary_file"
            changed=$((changed + 1))
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "network_changed=$network_changed" >> "$GITHUB_OUTPUT"
          echo "summary_file=$summary_file" >> "$GITHUB_OUTPUT"

      - name: Publish the pinned composition
        if: steps.resolve.outputs.changed != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SILICIUM_SYNC_DEPLOY_KEY: ${{ secrets.SILICIUM_SYNC_DEPLOY_KEY }}
          SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS: ${{ secrets.SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS }}
          SILICIUM_SYNC_PUSH_TOKEN: ${{ secrets.SILICIUM_SYNC_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          git config --local --unset-all http.https://github.com/.extraheader || true

          git config user.name "Luis1454"
          git config user.email "luis1454@users.noreply.github.com"
          git commit -m "chore: synchronize submodule gitlinks" \
            -m "$(cat '${{ steps.resolve.outputs.summary_file }}')"

          if [[ -z "${SILICIUM_SYNC_PUSH_TOKEN:-}" && -z "${SILICIUM_SYNC_DEPLOY_KEY:-}" ]]; then
            echo "::error title=Missing secret::Configure SILICIUM_SYNC_PUSH_TOKEN or SILICIUM_SYNC_DEPLOY_KEY to publish the gitlink update."
            exit 1
          fi

          if [[ -n "${SILICIUM_SYNC_PUSH_TOKEN:-}" ]]; then
            git push "https://x-access-token:${SILICIUM_SYNC_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:main
          else
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$SILICIUM_SYNC_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
            if [[ -n "${SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS:-}" ]]; then
              printf '%s\n' "$SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            else
              ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            fi
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
          fi

          # Events emitted with GITHUB_TOKEN do not recursively start workflows.
          # Dispatch the consumers explicitly after the exact gitlinks reach main.
          gh workflow run deploy-vps.yml --repo "$GITHUB_REPOSITORY" --ref main
          if [[ '${{ steps.resolve.outputs.network_changed }}' == 'true' ]]; then
            gh workflow run linux-client.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

      - name: Report current composition
        if: steps.resolve.outputs.changed == '0'
        run: echo "Fusion already pins every configured submodule branch head."
