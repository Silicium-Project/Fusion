name: Sync submodule gitlinks

on:
  workflow_dispatch:
  schedule:
    # Development cadence. Raise this interval before the production channel is enabled.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: silicium-submodule-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/submodule-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the pinned composition
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve configured submodule branches
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          git switch --force-create "$SYNC_BRANCH" origin/main
          summary_file="$RUNNER_TEMP/submodule-summary.md"
          : > "$summary_file"
          changed=0

          while read -r path_key path; do
            name="${path_key#submodule.}"
            name="${name%.path}"
            branch="$(git config --file .gitmodules --get "submodule.${name}.branch" || true)"
            branch="${branch:-main}"
            old_sha="$(git rev-parse "origin/main:${path}")"

            git -C "$path" fetch --quiet origin "$branch"
            new_sha="$(git -C "$path" rev-parse FETCH_HEAD)"

            if [[ "$old_sha" == "$new_sha" ]]; then
              continue
            fi

            git update-index --add --cacheinfo "160000,${new_sha},${path}"
            printf -- '- `%s`: `%s` -> `%s` (`%s`)\n' \
              "$path" "${old_sha:0:12}" "${new_sha:0:12}" "$branch" >> "$summary_file"
            changed=$((changed + 1))
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "summary_file=$summary_file" >> "$GITHUB_OUTPUT"

      - name: Publish or refresh the synchronization branch
        id: publish
        if: steps.resolve.outputs.changed != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "Luis1454"
          git config user.email "luis1454@users.noreply.github.com"

          candidate_tree="$(git write-tree)"
          remote_sha="$(git ls-remote --heads origin "$SYNC_BRANCH" | awk '{print $1}')"
          should_push=true

          if [[ -n "$remote_sha" ]]; then
            git fetch --quiet origin "$SYNC_BRANCH"
            remote_tree="$(git show --no-patch --format=%T FETCH_HEAD)"
            if [[ "$candidate_tree" == "$remote_tree" ]]; then
              should_push=false
            fi
          fi

          if [[ "$should_push" == true ]]; then
            git commit -m "chore: synchronize submodule gitlinks (#107)" \
              -m "$(cat '${{ steps.resolve.outputs.summary_file }}')"

            if [[ -n "$remote_sha" ]]; then
              git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" \
                origin "HEAD:refs/heads/${SYNC_BRANCH}"
            else
              git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
            fi
          fi

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          {
            echo 'Updates Fusion to the latest exact commits from the branches configured in `.gitmodules`.'
            echo
            cat '${{ steps.resolve.outputs.summary_file }}'
            echo
            echo 'The deployment remains pinned to the resulting Fusion commit. Resolves #107.'
          } > "$RUNNER_TEMP/pull-request-body.md"

          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: synchronize submodule gitlinks" \
              --body-file "$RUNNER_TEMP/pull-request-body.md")"
            pr_number="${pr_url##*/}"
          else
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --raw-field body="$(cat "$RUNNER_TEMP/pull-request-body.md")" >/dev/null
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Report current composition
        if: steps.resolve.outputs.changed == '0'
        run: echo "Fusion already pins every configured submodule branch head."
