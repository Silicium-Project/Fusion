name: Sync submodule gitlinks

on:
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-main-updated]
  schedule:
    # Development cadence. Raise this interval before the production channel is enabled.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: silicium-submodule-sync
  cancel-in-progress: false

jobs:
  detect:
    runs-on: [self-hosted, fusion-linux]
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network
          permission-contents: read
          permission-actions: read

      - name: Check out the pinned composition
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect remote submodule advances
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          changed=false
          while read -r name path; do
            url="$(git config --file .gitmodules --get "submodule.${name}.url")"
            repo="${url#https://github.com/}"
            repo="${repo#git@github.com:}"
            repo="${repo%.git}"
            pinned="$(git rev-parse "HEAD:${path}")"
            remote="$(node .github/scripts/check-submodule-ci.mjs \
              --repo "$repo" --latest-green --label "$path" \
              | sed -nE 's/^LATEST_GREEN_SHA=([0-9a-f]{40})$/\1/p' \
              | tail -n 1)"
            if [[ -z "$remote" ]]; then
              echo "::error title=GitHub API response missing SHA::Unable to resolve ${repo}:main."
              exit 1
            fi
            printf '%s: pinned=%s remote=%s\n' "$path" "${pinned:0:12}" "${remote:0:12}"
            if [[ "$pinned" != "$remote" ]]; then
              changed=true
            fi
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | sed -E 's/^submodule\.([^ ]+)\.path[[:space:]]+([^ ]+)$/\1 \2/')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  submodule-ci-gate:
    needs: [detect]
    if: ${{ needs.detect.outputs.changed == 'true' }}
    uses: ./.github/workflows/submodule-ci-gate.yml
    secrets: inherit

  sync:
    needs: [detect, submodule-ci-gate]
    if: ${{ always() && needs.detect.outputs.changed == 'true' && needs.submodule-ci-gate.result == 'success' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network
          permission-contents: read
          permission-actions: read

      - name: Check out the pinned composition
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' | while read -r key _; do
            git config --global --unset-all "$key" || true
          done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network

      - name: Resolve configured submodule branches
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SILICIUM_SYNC_PUSH_TOKEN || steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git switch --detach origin/main
          summary_file="$RUNNER_TEMP/submodule-summary.md"
          : > "$summary_file"
          changed=0
          network_changed=false

          while read -r path_key path; do
            name="${path_key#submodule.}"
            name="${name%.path}"
            branch="$(git config --file .gitmodules --get "submodule.${name}.branch" || true)"
            branch="${branch:-main}"
            if [[ "$branch" != "main" ]]; then
              echo "::error title=Unsupported submodule branch::${name} is configured on '${branch}', expected 'main'."
              exit 1
            fi
            branch="main"
            url="$(git config --file .gitmodules --get "submodule.${name}.url")"
            repo="${url#https://github.com/}"
            repo="${repo#git@github.com:}"
            repo="${repo%.git}"
            old_sha="$(git rev-parse "origin/main:${path}")"

            new_sha="$(node .github/scripts/check-submodule-ci.mjs \
              --repo "$repo" --ref "$branch" --latest-green --label "$path" \
              | sed -nE 's/^LATEST_GREEN_SHA=([0-9a-f]{40})$/\1/p' \
              | tail -n 1)"
            git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" \
              -C "$path" fetch --quiet origin "$new_sha"
            fetched_sha="$(git -C "$path" rev-parse FETCH_HEAD)"
            if [[ "$fetched_sha" != "$new_sha" ]]; then
              echo "::error title=Submodule SHA mismatch::Fetched ${path}@${fetched_sha}, expected ${new_sha}."
              exit 1
            fi
            node .github/scripts/check-submodule-ci.mjs --repo "$repo" --sha "$new_sha" --label "$path"

            if [[ "$old_sha" == "$new_sha" ]]; then
              continue
            fi

            git update-index --add --cacheinfo "160000,${new_sha},${path}"
            if [[ "$path" == "Network" ]]; then
              network_changed=true
            fi
            printf -- '- `%s`: `%s` -> `%s` (`%s`)\n' \
              "$path" "${old_sha:0:12}" "${new_sha:0:12}" "$branch" >> "$summary_file"
            changed=$((changed + 1))
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "network_changed=$network_changed" >> "$GITHUB_OUTPUT"
          echo "summary_file=$summary_file" >> "$GITHUB_OUTPUT"

      - name: Publish the pinned composition
        if: steps.resolve.outputs.changed != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SILICIUM_SYNC_DEPLOY_KEY: ${{ secrets.SILICIUM_SYNC_DEPLOY_KEY }}
          SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS: ${{ secrets.SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS }}
          SILICIUM_SYNC_PUSH_TOKEN: ${{ secrets.SILICIUM_SYNC_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          git config --local --unset-all http.https://github.com/.extraheader || true

          git config user.name "Luis1454"
          git config user.email "luis1454@users.noreply.github.com"
          git commit -m "chore: synchronize submodule gitlinks" \
            -m "$(cat '${{ steps.resolve.outputs.summary_file }}')"

          if [[ -z "${SILICIUM_SYNC_PUSH_TOKEN:-}" && -z "${SILICIUM_SYNC_DEPLOY_KEY:-}" ]]; then
            echo "::error title=Missing secret::Configure SILICIUM_SYNC_PUSH_TOKEN or SILICIUM_SYNC_DEPLOY_KEY to publish the gitlink update."
            exit 1
          fi

          if [[ -n "${SILICIUM_SYNC_PUSH_TOKEN:-}" ]]; then
            git push "https://x-access-token:${SILICIUM_SYNC_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:main
          else
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$SILICIUM_SYNC_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
            if [[ -n "${SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS:-}" ]]; then
              printf '%s\n' "$SILICIUM_SYNC_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            else
              ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            fi
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Report current composition
        if: steps.resolve.outputs.changed == '0'
        run: echo "Fusion already pins the latest green commit for every configured submodule."

  report-no-changes:
    needs: [detect]
    if: ${{ needs.detect.outputs.changed != 'true' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Report unchanged composition
        run: echo "No newer green submodule composition is available; skipped the expensive gate and gitlink sync."
