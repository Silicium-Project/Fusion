name: Project automation

on:
  issues:
    types: [opened, reopened, assigned, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]

jobs:
  update-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
      contents: read
    env:
      PROJECT_ID: PVT_kwDODDrr6M4BOPAC
      STAGE_FIELD_ID: PVTSSF_lADODDrr6M4BOPACzg8_wRc
      STAGE_BACKLOG: 8df5badd
      STAGE_IN_PROGRESS: cb37c0db
      STAGE_REVIEW: 4db4bd08
      STAGE_DONE: c612c7f4
    steps:
      - name: Update project stage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const fieldId = process.env.STAGE_FIELD_ID;
            const stages = {
              backlog: process.env.STAGE_BACKLOG,
              in_progress: process.env.STAGE_IN_PROGRESS,
              review: process.env.STAGE_REVIEW,
              done: process.env.STAGE_DONE,
            };

            const event = context.eventName;
            const action = context.payload.action;
            let stage = null;

            if (event === 'issues') {
              if (['opened', 'reopened'].includes(action)) stage = stages.backlog;
              if (action === 'assigned') stage = stages.in_progress;
              if (action === 'closed') stage = stages.done;
            }

            if (event === 'pull_request') {
              if (['opened', 'reopened', 'ready_for_review'].includes(action)) stage = stages.in_progress;
              if (action === 'review_requested') stage = stages.review;
              if (action === 'closed') {
                stage = context.payload.pull_request.merged ? stages.done : stages.backlog;
              }
            }

            if (!stage) {
              core.info('No stage transition for this event/action.');
              return;
            }

            const contentNodeId = context.payload.issue?.node_id || context.payload.pull_request?.node_id;
            if (!contentNodeId) {
              core.warning('No issue/PR node_id found in payload.');
              return;
            }

            async function getOrAddProjectItemId(contentId) {
              const query = `
                query($id: ID!) {
                  node(id: $id) {
                    ... on Issue {
                      projectItems(first: 20) { nodes { id project { id } } }
                    }
                    ... on PullRequest {
                      projectItems(first: 20) { nodes { id project { id } } }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, { id: contentId });
              const items = result.node?.projectItems?.nodes || [];
              const existing = items.find(item => item.project?.id === projectId);
              if (existing) return existing.id;

              const addMutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }
              `;
              const addResult = await github.graphql(addMutation, { projectId, contentId });
              return addResult.addProjectV2ItemById.item.id;
            }

            async function updateStage(itemId, optionId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId,
                      itemId: $itemId,
                      fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `;
              await github.graphql(mutation, { projectId, itemId, fieldId, optionId });
            }

            const itemId = await getOrAddProjectItemId(contentNodeId);
            await updateStage(itemId, stage);
            core.info(`Stage updated to ${stage} for item ${itemId}.`);
