name: Development VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Development ref to deploy."
        required: false
        default: dev
      vps_root:
        description: "Development checkout path on the self-hosted VPS runner."
        required: false
        default: /opt/silicium-dev
      release_tag:
        description: "Existing dev GitHub Release tag to install. Blank selects the newest published dev release."
        required: false
        default: ""
      deployment_target:
        description: "GitHub-hosted website, P2P runtime/worker, resource, or diagnostic rollout."
        required: true
        type: choice
        options:
          - frontend
          - workers
          - worker-resources
          - cpu-diagnose
          - cpu-reclaim
          - full
          - diagnose
        default: frontend
      network_job_id:
        description: "Optional network job ID to inspect in read-only diagnostics."
        required: false
        default: ""
      process_id:
        description: "PID of a stale Fusion runner restore.js process for guarded CPU recovery."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: silicium-vps-dev
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event.inputs.deployment_target == 'full' }}
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 10
    steps:
      - name: Check VPS without changing state
        shell: bash
        env:
          VPS_ROOT: ${{ github.event.inputs.vps_root }}
        run: |
          set -euo pipefail
          VPS_ROOT="${VPS_ROOT:-/opt/silicium-dev}"
          vps_root="${VPS_ROOT:-/opt/silicium-dev}"
          [[ "$vps_root" == "/opt/silicium-dev" ]] || {
            echo "The development workflow is restricted to /opt/silicium-dev." >&2
            exit 1
          }
          echo "host=$(hostname -f 2>/dev/null || hostname)"
          echo "user=$(id -un)"
          command -v python3 >/dev/null
          command -v docker >/dev/null
          docker compose version
          sudo -n true

          # Production is allowed to remain active: the channel contract now
          # gives dev its own systemd units, ports, Compose project and data
          # roots. Report the state for the audit trail without touching it.
          if sudo systemctl is-active --quiet silicium-orchestrator.service 2>/dev/null; then
            echo "Production orchestrator is active; channel isolation will preserve it."
          fi
          if command -v wg >/dev/null 2>&1 && sudo systemctl is-active --quiet wg-quick@wg0.service 2>/dev/null; then
            echo "Development WireGuard is already active; the deploy will converge its configuration."
          else
            echo "Development WireGuard is not provisioned yet; the deploy bootstrap will install it."
          fi
          if docker ps --format '{{.Label "com.docker.compose.project"}}' 2>/dev/null | grep -Fxq silicium; then
            echo "Production Compose project is active; channel isolation will preserve it."
          fi

          if [[ -d "$vps_root" ]]; then
            [[ -f "$vps_root/deploy/release/channels.json" ]] || {
              echo "Existing development checkout is incomplete: $vps_root" >&2
              exit 22
            }
          fi
          for env_file in orchestrator.env backend.env frontend.env compose.env update-channels.env; do
            if [[ ! -f "/etc/silicium-dev/$env_file" ]]; then
              echo "Missing development config: /etc/silicium-dev/$env_file" >&2
            fi
          done
          df -h / /opt
          echo "Development preflight passed; no VPS state was changed."

  deploy:
    if: ${{ github.event.inputs.deployment_target == 'full' }}
    needs: [preflight]
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 60
    environment: development
    steps:
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out development release metadata
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.inputs.ref || 'dev' }}
          fetch-depth: 1
          sparse-checkout: |
            apps/silicium-node/package.json
          sparse-checkout-cone-mode: false

      - name: Resolve and download validated dev release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/silicium-node/package.json').version")"
          rm -rf -- release-assets
          install -d -m 0755 release-assets
          python3 - "$version" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          version = sys.argv[1]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          input_tag = os.environ.get("RELEASE_TAG_INPUT", "").strip()
          preferred_tag = f"dev-{version}-{os.environ['GITHUB_SHA'][:12]}"
          api_root = f"https://api.github.com/repos/{repository}"
          api_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "silicium-dev-deployer",
          }

          def origin(url):
              parsed = urllib.parse.urlsplit(url)
              return parsed.scheme, parsed.hostname, parsed.port

          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  redirected = super().redirect_request(request, file_pointer, code, message, headers, new_url)
                  if redirected is not None and origin(request.full_url) != origin(new_url):
                      redirected.remove_header("Authorization")
                      redirected.remove_header("X-GitHub-Api-Version")
                  return redirected

          opener = urllib.request.build_opener(SafeRedirectHandler())

          def get_json(url):
              request = urllib.request.Request(url, headers=api_headers)
              with opener.open(request, timeout=60) as response:
                  return json.load(response)

          def get_release(tag):
              encoded_tag = urllib.parse.quote(tag, safe="")
              return get_json(f"{api_root}/releases/tags/{encoded_tag}")

          if input_tag:
              tag = input_tag
              release = get_release(tag)
          else:
              release = None
              try:
                  candidate = get_release(preferred_tag)
                  if candidate.get("prerelease") and not candidate.get("draft"):
                      release = candidate
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if release is None:
                  releases = get_json(f"{api_root}/releases?per_page=100")
                  candidates = [item for item in releases
                                if item.get("prerelease") and not item.get("draft")
                                and item.get("tag_name", "").startswith(f"dev-{version}-")]
                  candidates.sort(key=lambda item: item.get("created_at", ""), reverse=True)
                  if not candidates:
                      raise SystemExit(f"No published dev release for checkout version {version}.")
                  release = candidates[0]
              tag = release.get("tag_name", "")

          if not re.fullmatch(r"dev-[A-Za-z0-9._+-]+-[0-9a-fA-F]{7,64}", tag):
              raise SystemExit("Release tag is not a valid dev tag.")
          if release.get("draft") or not release.get("prerelease"):
              raise SystemExit("Selected release is not a published dev prerelease.")

          os.makedirs("release-assets", exist_ok=True)
          selected = {}
          for asset in release.get("assets", []):
              name = asset.get("name", "")
              if name == "release-channel.json" or name.endswith((".AppImage", ".deb", ".rpm", ".exe")):
                  suffix = "release-channel.json" if name == "release-channel.json" else name.rsplit(".", 1)[-1]
                  if suffix in selected:
                      raise SystemExit(f"Release contains multiple .{suffix} assets.")
                  selected[suffix] = asset

          for required in ("release-channel.json", "AppImage", "deb", "rpm"):
              if required not in selected:
                  raise SystemExit(f"Release is missing required asset: {required}")

          for suffix, asset in selected.items():
              request = urllib.request.Request(
                  asset["url"],
                  headers={**api_headers, "Accept": "application/octet-stream"},
              )
              with opener.open(request, timeout=300) as response:
                  data = response.read()
              if not data:
                  raise SystemExit(f"Release asset {asset['name']} is empty.")
              target = os.path.join("release-assets", asset["name"])
              with open(target, "wb") as output:
                  output.write(data)

          with open("release-assets/release-channel.json", encoding="utf-8") as source:
              metadata = json.load(source)
          if metadata.get("channel") != "dev":
              raise SystemExit("release-channel.json is not a dev release")
          if str(metadata.get("version", "")) != version:
              raise SystemExit(
                  f"release version {metadata.get('version')!r} does not match checkout {version!r}"
              )
          commit = str(metadata.get("commit", ""))
          if not re.fullmatch(r"[0-9a-fA-F]{7,64}", commit):
              raise SystemExit("release-channel.json has an invalid source commit")
          if not tag.endswith(commit[:12]):
              raise SystemExit("release tag and release-channel.json source commit disagree")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={tag}\n")
              output.write(f"release_version={version}\n")
              output.write(f"release_build={commit}\n")
          PY
          python3 - "release-assets/release-channel.json" "$version" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          if metadata.get("channel") != "dev":
              raise SystemExit("release-channel.json is not a dev release")
          if str(metadata.get("version", "")) != sys.argv[2]:
              raise SystemExit(
                  f"release version {metadata.get('version')!r} does not match checkout {sys.argv[2]!r}"
              )
          if not metadata.get("commit"):
              raise SystemExit("release-channel.json has no source commit")
          PY
          shopt -s nullglob
          appimages=(release-assets/*.AppImage)
          debs=(release-assets/*.deb)
          rpms=(release-assets/*.rpm)
          (( ${#appimages[@]} == 1 )) || { echo "Expected exactly one dev AppImage." >&2; exit 1; }
          (( ${#debs[@]} == 1 )) || { echo "Expected exactly one dev .deb." >&2; exit 1; }
          (( ${#rpms[@]} == 1 )) || { echo "Expected exactly one dev .rpm." >&2; exit 1; }
          if [[ "${appimages[0]}" != "release-assets/silicium-node-linux-dev.AppImage" ]]; then
            mv -- "${appimages[0]}" release-assets/silicium-node-linux-dev.AppImage
          fi
          if [[ "${debs[0]}" != "release-assets/silicium-node-linux-dev.deb" ]]; then
            mv -- "${debs[0]}" release-assets/silicium-node-linux-dev.deb
          fi
          if [[ "${rpms[0]}" != "release-assets/silicium-node-linux-dev.rpm" ]]; then
            mv -- "${rpms[0]}" release-assets/silicium-node-linux-dev.rpm
          fi
          # Releases built before the Windows dev lane have no installer: deploy them anyway.
          exes=(release-assets/*.exe)
          (( ${#exes[@]} <= 1 )) || { echo "Expected at most one dev Windows installer." >&2; exit 1; }
          if (( ${#exes[@]} == 1 )) && [[ "${exes[0]}" != "release-assets/silicium-node-windows-dev.exe" ]]; then
            mv -- "${exes[0]}" release-assets/silicium-node-windows-dev.exe
          fi
          (( ${#exes[@]} == 1 )) || echo "::warning::This dev release has no Windows installer."
          release_staging="/tmp/silicium-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "release_staging=$release_staging"
          } >> "$GITHUB_OUTPUT"

      - name: Stage validated dev installers on VPS
        shell: bash
        env:
          RELEASE_STAGING: ${{ steps.release.outputs.release_staging }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RELEASE_STAGING"
          install -m 0644 release-assets/silicium-node-linux-dev.deb "$RELEASE_STAGING/"
          install -m 0755 release-assets/silicium-node-linux-dev.AppImage "$RELEASE_STAGING/"
          install -m 0644 release-assets/silicium-node-linux-dev.rpm "$RELEASE_STAGING/"
          if [[ -f release-assets/silicium-node-windows-dev.exe ]]; then
            install -m 0644 release-assets/silicium-node-windows-dev.exe "$RELEASE_STAGING/"
          fi

      - name: Pull and deploy the dev channel
        shell: bash
        env:
          VPS_ROOT: ${{ github.event.inputs.vps_root }}
          VPS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_REF: ${{ github.event.inputs.ref || 'dev' }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_BUILD: ${{ steps.release.outputs.release_build }}
          RELEASE_STAGING: ${{ steps.release.outputs.release_staging }}
          NODE_ARTIFACTS_STAGED: true
        run: |
          set -euo pipefail
          VPS_ROOT="${VPS_ROOT:-/opt/silicium-dev}"
          VPS_GITHUB_TOKEN="${VPS_GITHUB_TOKEN:?}"
          DEPLOY_REF="${DEPLOY_REF:?}"
          RELEASE_VERSION="${RELEASE_VERSION:?}"
          RELEASE_BUILD="${RELEASE_BUILD:?}"
          RELEASE_STAGING="${RELEASE_STAGING:?}"
          NODE_ARTIFACTS_STAGED="${NODE_ARTIFACTS_STAGED:-false}"
          [[ "$VPS_ROOT" == "/opt/silicium-dev" ]] || { echo "Invalid dev root." >&2; exit 1; }
          [[ "$DEPLOY_REF" == "dev" ]] || { echo "The dev workflow only deploys the dev ref." >&2; exit 1; }
          GIT_AUTH="$(printf 'x-access-token:%s' "$VPS_GITHUB_TOKEN" | base64 -w 0)"
          git_auth() {
            sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
              "GIT_CONFIG_VALUE_0=Authorization: Basic $GIT_AUTH" git "$@"
          }

          if [[ ! -d "$VPS_ROOT/.git" ]]; then
            sudo install -d -m 0755 "$VPS_ROOT"
            sudo chown "$(id -u):$(id -g)" "$VPS_ROOT"
            git_auth clone --branch dev --recurse-submodules \
              https://github.com/Silicium-Project/Fusion.git "$VPS_ROOT"
          fi
          sudo git config --system --add safe.directory "$VPS_ROOT"
          sudo git -C "$VPS_ROOT" remote set-url origin https://github.com/Silicium-Project/Fusion.git
          sudo git -C "$VPS_ROOT" reset --hard --quiet || true
          sudo git -C "$VPS_ROOT" clean -ffd || true
          sudo git -C "$VPS_ROOT" submodule foreach --recursive 'git reset --hard --quiet && git clean -ffd' || true
          git_auth -C "$VPS_ROOT" fetch --no-tags --prune origin dev
          sudo git -C "$VPS_ROOT" checkout dev
          sudo git -C "$VPS_ROOT" reset --hard origin/dev
          sudo git -C "$VPS_ROOT" submodule sync -- BackEnd FrontEnd Network
          git_auth -C "$VPS_ROOT" submodule update --init --force --recursive -- BackEnd FrontEnd Network
          sudo git -C "$VPS_ROOT" clean -ffd
          sudo git -C "$VPS_ROOT" submodule foreach --recursive 'git clean -ffd'
          sudo SILICIUM_STALE_JOB_DAYS=365000 SILICIUM_PRUNE_DOCKER=auto \
            bash "$VPS_ROOT/deploy/linux/cleanup-vps.sh"
          unset GIT_AUTH VPS_GITHUB_TOKEN

          if [[ "$NODE_ARTIFACTS_STAGED" == "true" ]]; then
            sudo install -d -m 0755 /var/lib/silicium-dev/downloads
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-linux-dev.deb" /var/lib/silicium-dev/downloads/silicium-node-linux-dev.deb
            sudo install -m 0755 "$RELEASE_STAGING/silicium-node-linux-dev.AppImage" /var/lib/silicium-dev/downloads/silicium-node-linux-dev.AppImage
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-linux-dev.rpm" /var/lib/silicium-dev/downloads/silicium-node-linux-dev.rpm
            if [[ -f "$RELEASE_STAGING/silicium-node-windows-dev.exe" ]]; then
              sudo install -m 0644 "$RELEASE_STAGING/silicium-node-windows-dev.exe" /var/lib/silicium-dev/downloads/silicium-node-windows-dev.exe
            fi
          fi
          sudo install -d -m 0755 /var/lib/silicium-dev/releases
          cat <<EOF | sudo tee /var/lib/silicium-dev/releases/current.env >/dev/null
          SILICIUM_RELEASE_VERSION=$RELEASE_VERSION
          SILICIUM_RELEASE_CHANNEL=dev
          SILICIUM_RELEASE_BUILD=$RELEASE_BUILD
          SILICIUM_DEPLOY_REF=$DEPLOY_REF
          SILICIUM_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sudo rm -rf -- "$RELEASE_STAGING"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL=dev \
            SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/prepare-dev-config.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL=dev \
            SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/install-services.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL=dev \
            SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" SILICIUM_SKIP_PACKAGE_REPOSITORY_PUBLISH=1 \
            bash "$VPS_ROOT/deploy/compose/deploy.sh" "$VPS_ROOT"
          sudo systemctl start silicium-update-manifest-dev.service
          sudo SILICIUM_RELEASE_CHANNEL=dev bash "$VPS_ROOT/deploy/linux/post-deploy-check.sh" "$VPS_ROOT"
          echo "Development channel deployed: $RELEASE_VERSION ($RELEASE_BUILD)"

  frontend-deploy:
    if: ${{ github.event.inputs.deployment_target == 'frontend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,FrontEnd

      - name: Check out the selected development ref
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.inputs.ref || 'dev' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restrict this deployment to the dev branch
        shell: bash
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || 'dev' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REF" == dev ]] || {
            echo "The development workflow only deploys the dev ref." >&2
            exit 1
          }

      - name: Check out the pinned FrontEnd submodule
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git submodule sync -- FrontEnd
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraHeader=Authorization: Basic $git_auth" \
            submodule update --init --depth=1 -- FrontEnd

      - name: Build the frontend image on GitHub-hosted infrastructure
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/silicium-node/package.json').version")"
          image="silicium-dev-frontend:${GITHUB_SHA:0:12}"
          docker build --pull --platform linux/amd64 \
            --tag "$image" \
            --file FrontEnd/Dockerfile FrontEnd
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the built frontend image
        shell: bash
        env:
          FRONTEND_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          name="silicium-frontend-smoke-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" --publish 127.0.0.1:38080:3000 \
            --env NUXT_PUBLIC_SOLANA_CLUSTER=devnet \
            --env NUXT_PUBLIC_SIL_POOL_ID=66Un5iGRBuzE4kcVQkDkKrtZUVnTiXnxpUHoFL3mEsdS \
            "$FRONTEND_IMAGE" >/dev/null
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:38080/ >/dev/null; then
              echo "GitHub-built frontend returned HTTP successfully."
              exit 0
            fi
            sleep 2
          done
          docker logs "$name"
          echo "GitHub-built frontend did not become reachable." >&2
          exit 1

      - name: Transfer the image and restart only the dev website
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SILICIUM_SOLANA_RPC: ${{ secrets.SILICIUM_SOLANA_RPC }}
          FRONTEND_IMAGE: ${{ steps.image.outputs.image }}
          FRONTEND_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${VPS_HOST:-}" ]] || { echo "Missing VPS_HOST." >&2; exit 1; }
          [[ -n "${VPS_SSH_KEY:-}" ]] || { echo "Missing VPS_SSH_KEY." >&2; exit 1; }
          [[ -n "${VPS_KNOWN_HOSTS:-}" ]] || { echo "Missing VPS_KNOWN_HOSTS." >&2; exit 1; }
          [[ "$FRONTEND_IMAGE" =~ ^silicium-dev-frontend:[0-9a-f]{12}$ ]] || {
            echo "Invalid frontend image tag." >&2
            exit 1
          }
          [[ "$FRONTEND_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || {
            echo "Invalid frontend release version." >&2
            exit 1
          }

          ssh_dir="$RUNNER_TEMP/silicium-dev-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$ssh_dir/id_ed25519")
          vps_user="${VPS_USER:-luis}"
          vps_port="${VPS_PORT:-22}"

          if [[ -n "${SILICIUM_SOLANA_RPC:-}" ]]; then
            printf '%s' "$SILICIUM_SOLANA_RPC" | \
              ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
                "sudo -n python3 -c 'import os,pathlib,stat,sys,tempfile,urllib.parse; p=pathlib.Path(\"/etc/silicium-dev/compose.env\"); value=sys.stdin.read(); parsed=urllib.parse.urlsplit(value); assert parsed.scheme == \"https\" and parsed.netloc and \"devnet\" in value.lower() and \"\\n\" not in value and \"\\r\" not in value, \"expected an HTTPS Devnet RPC URL\"; lines=[line for line in p.read_text().splitlines() if not line.startswith(\"SILICIUM_SOLANA_RPC=\")]; lines.append(\"SILICIUM_SOLANA_RPC=\"+value); fd,name=tempfile.mkstemp(dir=str(p.parent),prefix=\".compose.env.\"); f=os.fdopen(fd,\"w\"); f.write(\"\\n\".join(lines)+\"\\n\"); f.close(); os.chmod(name,stat.S_IMODE(p.stat().st_mode)); os.replace(name,p)'"
          fi

          docker save "$FRONTEND_IMAGE" | gzip -1 | \
            ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
              "sudo -n docker load"

          ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
            "sudo -n env FRONTEND_IMAGE='$FRONTEND_IMAGE' FRONTEND_VERSION='$FRONTEND_VERSION' FRONTEND_BUILD='$GITHUB_SHA' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          vps_root=/opt/silicium-dev
          compose_file="$vps_root/deploy/compose/docker-compose.yml"
          compose_env=/etc/silicium-dev/compose.env
          [[ -f "$compose_file" ]] || { echo "Missing dev Compose file." >&2; exit 1; }
          [[ -f "$compose_env" ]] || { echo "Missing dev Compose environment." >&2; exit 1; }
          [[ "$FRONTEND_IMAGE" =~ ^silicium-dev-frontend:[0-9a-f]{12}$ ]] || {
            echo "Invalid frontend image tag." >&2
            exit 1
          }
          [[ "$FRONTEND_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || {
            echo "Invalid frontend release version." >&2
            exit 1
          }
          [[ "$FRONTEND_BUILD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid frontend build SHA." >&2
            exit 1
          }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid GitHub run ID." >&2; exit 1; }
          grep -Eq '^SILICIUM_RELEASE_CHANNEL=dev$' "$compose_env" || {
            echo "Compose config is not the isolated dev channel." >&2
            exit 1
          }

          read_compose_value() {
            local key="$1"
            sed -n "s/^${key}=//p" "$compose_env" | tail -n 1
          }
          orchestrator_port="$(read_compose_value SILICIUM_ORCHESTRATOR_PORT)"
          orchestrator_port="${orchestrator_port:-46200}"
          [[ "$orchestrator_port" =~ ^[0-9]{1,5}$ ]] && (( orchestrator_port > 0 && orchestrator_port <= 65535 )) || {
            echo "Invalid dev orchestrator port." >&2
            exit 1
          }
          backend_network="$(read_compose_value SILICIUM_BACKEND_NETWORK_NAME)"
          backend_network="${backend_network:-silicium-dev-backend}"
          [[ "$backend_network" =~ ^silicium-dev-[A-Za-z0-9_.-]+$ ]] || {
            echo "Invalid dev backend network name." >&2
            exit 1
          }
          backend_gateway="$(docker network inspect --format '{{(index .IPAM.Config 0).Gateway}}' "$backend_network")"
          [[ "$backend_gateway" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
            echo "Could not resolve the dev backend bridge gateway." >&2
            exit 1
          }
          config_dir="$(read_compose_value SILICIUM_CONFIG_DIR)"
          config_dir="${config_dir:-/etc/silicium-dev}"
          [[ "$config_dir" == /etc/silicium-dev ]] || {
            echo "Unexpected dev config directory." >&2
            exit 1
          }
          nginx_config_path="$config_dir/nginx.conf"
          tls_root="$(read_compose_value SILICIUM_TLS_ROOT)"
          if [[ -z "$tls_root" ]]; then
            data_root="$(read_compose_value SILICIUM_DATA_ROOT)"
            tls_root="${data_root:-/var/lib/silicium-dev}/tls"
          fi
          [[ -d "$tls_root" ]] || { echo "Missing dev TLS directory." >&2; exit 1; }
          nginx_template="$vps_root/deploy/compose/nginx.conf"
          nginx_staged="/tmp/silicium-dev-nginx-${RUN_ID}.conf"
          [[ -f "$nginx_template" ]] || { echo "Missing dev Nginx template." >&2; exit 1; }
          sed \
            -e "s#__SILICIUM_ORCHESTRATOR_PORT__#$orchestrator_port#g" \
            -e "s#host.docker.internal#$backend_gateway#g" \
            "$nginx_template" > "$nginx_staged"
          if grep -Eq '__SILICIUM_[A-Z0-9_]+__|host\.docker\.internal' "$nginx_staged"; then
            echo "The rendered dev Nginx config still has unresolved placeholders." >&2
            exit 1
          fi
          install -d -m 0750 "$config_dir"
          install -m 0644 "$nginx_staged" "$nginx_config_path"
          rm -f "$nginx_staged"
          export SILICIUM_NGINX_CONFIG="$nginx_config_path"
          export SILICIUM_HOST_GATEWAY="$backend_gateway"

          compose_base=(docker compose --project-name silicium-dev --env-file "$compose_env" -f "$compose_file")
          "${compose_base[@]}" config --services | grep -Fxq frontend || {
            echo "The dev Compose project has no frontend service." >&2
            exit 1
          }
          "${compose_base[@]}" run --rm --no-deps --entrypoint nginx proxy -t </dev/null
          docker image inspect "$FRONTEND_IMAGE" >/dev/null

          override_file="/tmp/silicium-dev-frontend-${RUN_ID}.yaml"
          trap 'rm -f "$override_file"' EXIT
          old_container="$("${compose_base[@]}" ps -q frontend | head -n 1 || true)"
          rollback_tag=""
          if [[ -n "$old_container" ]]; then
            old_image="$(docker inspect --format '{{.Image}}' "$old_container")"
            rollback_tag="silicium-dev-frontend:rollback-${RUN_ID}"
            docker image tag "$old_image" "$rollback_tag"
          fi

          write_override() {
            local image="$1"
            local with_release_metadata="$2"
            if [[ "$with_release_metadata" == true ]]; then
              cat <<EOF | tee "$override_file" >/dev/null
          services:
            frontend:
              image: $image
              environment:
                NUXT_PUBLIC_RELEASE_CHANNEL: dev
                NUXT_PUBLIC_RELEASE_VERSION: $FRONTEND_VERSION
                NUXT_PUBLIC_RELEASE_BUILD: $FRONTEND_BUILD
                NUXT_PUBLIC_SOLANA_CLUSTER: devnet
                NUXT_PUBLIC_SIL_POOL_ID: 66Un5iGRBuzE4kcVQkDkKrtZUVnTiXnxpUHoFL3mEsdS
          EOF
            else
              cat <<EOF | tee "$override_file" >/dev/null
          services:
            frontend:
              image: $image
          EOF
            fi
          }
          wait_frontend() {
            local container status
            container="$("${compose[@]}" ps -q frontend | head -n 1 || true)"
            [[ -n "$container" ]] || return 1
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              [[ "$status" == healthy || "$status" == running ]] && return 0
              [[ "$status" == unhealthy || "$status" == exited || "$status" == dead ]] && return 1
              sleep 2
            done
            return 1
          }
          wait_proxy() {
            local container status
            container="$("${compose_base[@]}" ps -aq proxy | head -n 1 || true)"
            [[ -n "$container" ]] || return 1
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
              if [[ "$status" == running ]]; then
                docker exec "$container" nginx -t >/dev/null 2>&1
                return $?
              fi
              [[ "$status" == dead ]] && return 1
              sleep 2
            done
            return 1
          }
          compose=(docker compose --project-name silicium-dev --env-file "$compose_env" -f "$compose_file" -f "$override_file")
          rollback() {
            if [[ -n "$rollback_tag" ]]; then
              echo "Restoring the previous frontend image."
              write_override "$rollback_tag" false
              "${compose[@]}" up -d --no-build --no-deps frontend
              wait_frontend || true
              "${compose[@]}" up -d --no-build --no-deps --force-recreate proxy || true
            fi
          }

          write_override "$FRONTEND_IMAGE" true
          if ! "${compose[@]}" up -d --no-build --no-deps frontend || ! wait_frontend; then
            rollback
            echo "The new frontend failed its container health check." >&2
            exit 1
          fi
          if ! "${compose[@]}" up -d --no-build --no-deps --force-recreate proxy; then
            rollback
            echo "The dev proxy could not be restarted after the frontend update." >&2
            exit 1
          fi
          if ! wait_proxy; then
            rollback
            echo "The dev proxy did not stay up with a valid Nginx config." >&2
            exit 1
          fi
          port="$(sed -nE 's/^SILICIUM_FRONTEND_HTTP_PORT=([0-9]+)$/\1/p' "$compose_env" | tail -n 1)"
          port="${port:-3000}"
          curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null || {
            rollback
            echo "The dev frontend did not respond on its host port." >&2
            exit 1
          }
          proxy_port="$(read_compose_value SILICIUM_PROXY_HTTPS_PORT)"
          proxy_port="${proxy_port:-8443}"
          [[ "$proxy_port" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid dev HTTPS ingress port." >&2; exit 1; }
          curl --noproxy '*' --insecure --fail --silent --show-error \
            --connect-timeout 4 --max-time 10 "https://10.77.0.1:${proxy_port}/" >/dev/null || {
            rollback
            echo "The dev HTTPS ingress did not respond on 10.77.0.1:${proxy_port}." >&2
            exit 1
          }
          "${compose[@]}" ps frontend proxy
          echo "GitHub-hosted frontend deployed: $FRONTEND_VERSION ($FRONTEND_BUILD)"
          REMOTE

  workers-deploy:
    if: ${{ github.event.inputs.deployment_target == 'workers' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,Network

      - name: Check out the selected development ref
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.inputs.ref || 'dev' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restrict this deployment to the dev branch
        shell: bash
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || 'dev' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REF" == dev ]] || {
            echo "The development workflow only deploys the dev ref." >&2
            exit 1
          }

      - name: Check out the pinned Network submodule
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git submodule sync -- Network
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraHeader=Authorization: Basic $git_auth" \
            submodule update --init --depth=1 -- Network

      - name: Define the miniworker image tag
        id: worker-image
        shell: bash
        run: |
          set -euo pipefail
          image="silicium-dev-miniworker:${GITHUB_SHA:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the miniworker image on GitHub-hosted infrastructure
        uses: docker/build-push-action@v7
        with:
          context: Network
          file: Network/infra/miniworker.Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ steps.worker-image.outputs.image }}
          cache-from: type=gha,scope=silicium-dev-miniworker
          cache-to: type=gha,scope=silicium-dev-miniworker,mode=max,ignore-error=true

      - name: Smoke-check the built miniworker image
        shell: bash
        env:
          WORKER_IMAGE: ${{ steps.worker-image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$WORKER_IMAGE" -ec '
            test -x /usr/local/bin/p2p_node
            test -x /usr/local/bin/compute_daemon
            test -x /usr/local/bin/solana-worker-wallet
            node --check /opt/worker-solana/solana-worker-settlement.mjs
          '

      - name: Build the portable orchestrator binary on GitHub
        uses: docker/build-push-action@v7
        with:
          context: Network
          file: Network/infra/orchestrator-musl.Dockerfile
          platforms: linux/amd64
          pull: true
          target: artifact
          outputs: type=local,dest=${{ runner.temp }}/silicium-dev-orchestrator
          cache-from: type=gha,scope=silicium-dev-orchestrator
          cache-to: type=gha,scope=silicium-dev-orchestrator,mode=max,ignore-error=true

      - name: Check the portable orchestrator artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/silicium-dev-orchestrator/p2p_node"
          chmod 0755 "$RUNNER_TEMP/silicium-dev-orchestrator/p2p_node"

      - name: Transfer image and roll miniworkers one at a time
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SILICIUM_SOLANA_RPC: ${{ secrets.SILICIUM_SOLANA_RPC }}
          WORKER_IMAGE: ${{ steps.worker-image.outputs.image }}
          WORKER_BUILD: ${{ github.sha }}
          ORCHESTRATOR_BINARY: ${{ runner.temp }}/silicium-dev-orchestrator/p2p_node
        run: |
          set -euo pipefail
          [[ -n "${VPS_HOST:-}" ]] || { echo "Missing VPS_HOST." >&2; exit 1; }
          [[ -n "${VPS_SSH_KEY:-}" ]] || { echo "Missing VPS_SSH_KEY." >&2; exit 1; }
          [[ -n "${VPS_KNOWN_HOSTS:-}" ]] || { echo "Missing VPS_KNOWN_HOSTS." >&2; exit 1; }
          [[ "$WORKER_IMAGE" =~ ^silicium-dev-miniworker:[0-9a-f]{12}$ ]] || {
            echo "Invalid miniworker image tag." >&2
            exit 1
          }
          [[ "$WORKER_BUILD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid miniworker build SHA." >&2
            exit 1
          }
          [[ -s "$ORCHESTRATOR_BINARY" && -x "$ORCHESTRATOR_BINARY" ]] || {
            echo "Missing portable orchestrator binary." >&2
            exit 1
          }

          ssh_dir="$RUNNER_TEMP/silicium-dev-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$ssh_dir/id_ed25519")
          vps_user="${VPS_USER:-luis}"
          vps_port="${VPS_PORT:-22}"
          orchestrator_staging="/tmp/silicium-dev-p2p-node-$GITHUB_RUN_ID"

          if [[ -n "${SILICIUM_SOLANA_RPC:-}" ]]; then
            printf '%s' "$SILICIUM_SOLANA_RPC" | \
              ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
                "sudo -n python3 -c 'import os,pathlib,sys,tempfile; p=pathlib.Path(\"/etc/silicium-dev/miniworkers.env\"); value=sys.stdin.read(); assert value.startswith(\"https://\") and \"devnet\" in value.lower() and \"\\n\" not in value and \"\\r\" not in value, \"expected an HTTPS Devnet RPC URL\"; lines=[line for line in p.read_text().splitlines() if not line.startswith(\"SILICIUM_SOLANA_RPC=\")]; lines.append(\"SILICIUM_SOLANA_RPC=\"+value); fd,name=tempfile.mkstemp(dir=str(p.parent),prefix=\".miniworkers.env.\"); f=os.fdopen(fd,\"w\"); f.write(\"\\n\".join(lines)+\"\\n\"); f.close(); os.chmod(name,0o600); os.replace(name,p)'"
            echo "Configured the Devnet RPC from the GitHub development secret."
          fi

          docker save "$WORKER_IMAGE" | gzip -1 | \
            ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
              "sudo -n docker load"

          scp "${ssh_opts[@]}" -P "$vps_port" "$ORCHESTRATOR_BINARY" \
            "$vps_user@$VPS_HOST:$orchestrator_staging"

          ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
            "sudo -n env WORKER_IMAGE='$WORKER_IMAGE' WORKER_BUILD='$WORKER_BUILD' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          vps_root=/opt/silicium-dev
          compose_file="$vps_root/deploy/compose/dev-miniworkers.yml"
          worker_env=/etc/silicium-dev/miniworkers.env
          [[ -f "$compose_file" ]] || { echo "Missing dev miniworker Compose file." >&2; exit 1; }
          [[ -f "$worker_env" ]] || { echo "Missing dev miniworker environment." >&2; exit 1; }
          [[ "$WORKER_IMAGE" =~ ^silicium-dev-miniworker:[0-9a-f]{12}$ ]] || {
            echo "Invalid miniworker image tag." >&2
            exit 1
          }
          [[ "$WORKER_BUILD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid miniworker build SHA." >&2
            exit 1
          }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid GitHub run ID." >&2; exit 1; }

          compose=(docker compose --project-name silicium-dev-miniworkers --env-file "$worker_env" -f "$compose_file")
          export SILICIUM_DEV_MINIWORKERS_RELEASE_BUILD="$WORKER_BUILD"
          services=()
          for number in $(seq -w 1 20); do services+=("miniworker-$number"); done
          configured_services="$("${compose[@]}" config --services)"
          declare -A old_images=()
          common_old_image=""
          for service in "${services[@]}"; do
            grep -Fxq "$service" <<<"$configured_services" || {
              echo "Missing expected dev miniworker service: $service" >&2
              exit 1
            }
            container="$("${compose[@]}" ps -q "$service" | head -n 1 || true)"
            [[ -n "$container" ]] || { echo "Miniworker is not running: $service" >&2; exit 1; }
            state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
            [[ "$state" == healthy || "$state" == running ]] || {
              echo "Miniworker is not healthy before rollout: $service ($state)" >&2
              exit 1
            }
            old_images[$service]="$(docker inspect --format '{{.Image}}' "$container")"
            if [[ -z "$common_old_image" ]]; then
              common_old_image="${old_images[$service]}"
            elif [[ "$common_old_image" != "${old_images[$service]}" ]]; then
              echo "Miniworker image versions differ; refusing a non-uniform rollout." >&2
              exit 1
            fi
          done
          docker image inspect "$WORKER_IMAGE" >/dev/null
          rollback_image="silicium-dev-miniworker:rollback-$RUN_ID"
          docker image tag "$common_old_image" "$rollback_image"
          docker image tag "$WORKER_IMAGE" silicium-dev-miniworker:local

          updated=()
          wait_worker() {
            local service="$1" container state
            container="$("${compose[@]}" ps -q "$service" | head -n 1 || true)"
            [[ -n "$container" ]] || return 1
            for attempt in $(seq 1 60); do
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              [[ "$state" == healthy || "$state" == running ]] && return 0
              [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]] && return 1
              sleep 2
            done
            return 1
          }
          rollback() {
            local service
            echo "Rolling back the miniworkers already changed."
            docker image tag "$common_old_image" silicium-dev-miniworker:local
            for service in "${updated[@]}"; do
              "${compose[@]}" up -d --no-build --no-deps --force-recreate "$service" || true
              wait_worker "$service" || true
            done
          }
          for service in "${services[@]}"; do
            updated+=("$service")
            if ! "${compose[@]}" up -d --no-build --no-deps --force-recreate "$service" || ! wait_worker "$service"; then
              rollback
              echo "Miniworker rollout failed at $service; earlier nodes were restored." >&2
              exit 1
            fi
            echo "Healthy after update: $service"
          done

          orchestrator_unit=silicium-orchestrator-dev.service
          orchestrator_env=/etc/silicium-dev/orchestrator.env
          main_pid="$(systemctl show --property=MainPID --value "$orchestrator_unit")"
          [[ "$main_pid" =~ ^[1-9][0-9]*$ ]] || {
            rollback
            echo "The dev orchestrator has no active process; rolled back the workers." >&2
            exit 1
          }
          orchestrator_binary="$(readlink -f "/proc/$main_pid/exe")"
          case "$orchestrator_binary" in
            "$vps_root"/Network/*/p2p_node) ;;
            *)
              rollback
              echo "The active dev orchestrator binary is outside the pinned Network checkout; rolled back the workers." >&2
              exit 1
              ;;
          esac
          [[ -f "$orchestrator_env" ]] || {
            rollback
            echo "Missing dev orchestrator environment; rolled back the workers." >&2
            exit 1
          }
          release_dir=/var/lib/silicium-dev/releases
          install -d -m 0700 "$release_dir"
          previous_binary="$release_dir/p2p_node.previous"
          previous_env="$release_dir/orchestrator.env.previous"
          install -m 0755 "$orchestrator_binary" "$previous_binary"
          cp -p "$orchestrator_env" "$previous_env"
          candidate_binary="$orchestrator_binary.new-$RUN_ID"
          install -m 0755 "/tmp/silicium-dev-p2p-node-$RUN_ID" "$candidate_binary"
          if ! python3 - "$orchestrator_env" "$WORKER_BUILD" <<'PY'
          import os
          import pathlib
          import stat
          import sys
          import tempfile

          path = pathlib.Path(sys.argv[1])
          build = sys.argv[2]
          if len(build) != 40 or any(char not in "0123456789abcdef" for char in build):
              raise SystemExit("Invalid orchestrator build identifier.")
          lines = [line for line in path.read_text().splitlines() if not line.startswith("SILICIUM_RELEASE_BUILD=")]
          lines.append(f"SILICIUM_RELEASE_BUILD={build}")
          fd, temporary = tempfile.mkstemp(prefix=".orchestrator.env.", dir=path.parent)
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as stream:
                  stream.write("\n".join(lines) + "\n")
              os.chmod(temporary, stat.S_IMODE(path.stat().st_mode))
              os.replace(temporary, path)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          PY
          then
            cp -p "$previous_env" "$orchestrator_env"
            rm -f "$candidate_binary" "/tmp/silicium-dev-p2p-node-$RUN_ID"
            rollback
            echo "Could not update orchestrator build metadata; rolled back the workers." >&2
            exit 1
          fi
          mv -f "$candidate_binary" "$orchestrator_binary"

          restore_orchestrator() {
            local restore_candidate="${orchestrator_binary}.restore-$RUN_ID"
            install -m 0755 "$previous_binary" "$restore_candidate"
            mv -f "$restore_candidate" "$orchestrator_binary"
            cp -p "$previous_env" "$orchestrator_env"
            systemctl restart "$orchestrator_unit" || true
          }
          if ! systemctl restart "$orchestrator_unit"; then
            restore_orchestrator
            rollback
            echo "Orchestrator restart failed; restored its previous binary and rolled back the workers." >&2
            exit 1
          fi
          orchestrator_port="$(sed -n 's/^SILICIUM_NODE_PORT=//p' "$orchestrator_env" | tail -n 1)"
          orchestrator_port="${orchestrator_port:-46200}"
          [[ "$orchestrator_port" =~ ^[0-9]{1,5}$ ]] && (( orchestrator_port > 0 && orchestrator_port <= 65535 )) || {
            restore_orchestrator
            rollback
            echo "Invalid dev orchestrator port; restored the previous runtime and workers." >&2
            exit 1
          }
          orchestrator_healthy=false
          for attempt in $(seq 1 30); do
            if systemctl is-active --quiet "$orchestrator_unit" \
              && curl --fail --silent --show-error --max-time 2 \
                "http://127.0.0.1:${orchestrator_port}/healthz" >/dev/null; then
              orchestrator_healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$orchestrator_healthy" != true ]]; then
            restore_orchestrator
            rollback
            rm -f "/tmp/silicium-dev-p2p-node-$RUN_ID"
            echo "The updated orchestrator did not become healthy; restored the prior runtime and workers." >&2
            exit 1
          fi
          rm -f "/tmp/silicium-dev-p2p-node-$RUN_ID"

          "${compose[@]}" ps "${services[@]}"
          while IFS= read -r prior_rollback; do
            [[ "$prior_rollback" == "$rollback_image" ]] || docker image rm "$prior_rollback" >/dev/null 2>&1 || true
          done < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | awk '$1 ~ /^silicium-dev-miniworker:rollback-/')
          echo "GitHub-built P2P runtime deployed to the dev orchestrator and all 20 miniworkers: $WORKER_BUILD"
          REMOTE

  worker-resources:
    if: ${{ github.event.inputs.deployment_target == 'worker-resources' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Apply bounded miniworker CPU limits over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${VPS_HOST:-}" && -n "${VPS_SSH_KEY:-}" && -n "${VPS_KNOWN_HOSTS:-}" ]] || {
            echo "Missing VPS SSH configuration." >&2
            exit 1
          }
          ssh_dir="$RUNNER_TEMP/silicium-dev-worker-resources-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o IdentitiesOnly=yes \
            -i "$ssh_dir/id_ed25519")
          ssh "${ssh_opts[@]}" -p "${VPS_PORT:-22}" \
            "${VPS_USER:-luis}@$VPS_HOST" "sudo -n bash -s" <<'REMOTE'
          set -euo pipefail
          compose_file=/opt/silicium-dev/deploy/compose/dev-miniworkers.yml
          worker_env=/etc/silicium-dev/miniworkers.env
          [[ -f "$compose_file" && -f "$worker_env" ]] || {
            echo "Development miniworker Compose configuration is missing." >&2
            exit 1
          }
          compose=(docker compose --project-name silicium-dev-miniworkers --env-file "$worker_env" -f "$compose_file")
          python3 - "$compose_file" <<'PY'
          import os
          import pathlib
          import re
          import stat
          import sys
          import tempfile

          path = pathlib.Path(sys.argv[1])
          original = path.read_text(encoding="utf-8")
          prior = re.compile(r'(?m)^(\s*cpus:\s*)["\']?0\.10["\']?\s*$')
          target = re.compile(r'(?m)^\s*cpus:\s*["\']?0\.05["\']?\s*$')
          if len(prior.findall(original)) == 1:
              updated = prior.sub(r'\g<1>"0.05"', original, count=1)
          elif len(target.findall(original)) == 1:
              updated = original
          else:
              raise SystemExit("Expected exactly one miniworker CPU limit of 0.10 or 0.05.")
          if updated != original:
              mode = stat.S_IMODE(path.stat().st_mode)
              fd, temporary = tempfile.mkstemp(prefix=".dev-miniworkers.", dir=path.parent)
              with os.fdopen(fd, "w", encoding="utf-8") as stream:
                  stream.write(updated)
              os.chmod(temporary, mode)
              os.replace(temporary, path)
          print("Persistent miniworker CPU limit set to 0.05 vCPU each.")
          PY

          configured_services="$("${compose[@]}" config --services)"
          for number in $(seq -w 1 20); do
            service="miniworker-$number"
            grep -Fxq "$service" <<<"$configured_services" || {
              echo "Missing miniworker Compose service: $service" >&2
              exit 1
            }
            container="$(docker ps -aq --filter "name=silicium-dev-miniworker-$number" | head -n 1 || true)"
            if [[ -z "$container" ]]; then
              "${compose[@]}" up -d --no-build --no-deps "$service"
              container="$(docker ps -q --filter "name=silicium-dev-miniworker-$number" | head -n 1 || true)"
            fi
            [[ -n "$container" ]] || { echo "Miniworker is unavailable: $service" >&2; exit 1; }
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [[ "$state" != running ]]; then
              "${compose[@]}" up -d --no-build --no-deps "$service"
              container="$(docker ps -q --filter "name=silicium-dev-miniworker-$number" | head -n 1 || true)"
            fi
            [[ -n "$container" ]] || { echo "Miniworker did not start: $service" >&2; exit 1; }
            docker update --cpus 0.05 "$container" >/dev/null
            quota="$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$container")"
            [[ "$quota" == 50000000 ]] || {
              echo "Unexpected CPU quota for $service: $quota" >&2
              exit 1
            }
            ready=false
            for attempt in $(seq 1 15); do
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [[ "$state" == healthy || "$state" == running ]]; then ready=true; break; fi
              if [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]]; then break; fi
              sleep 2
            done
            [[ "$ready" == true ]] || {
              echo "Miniworker is not healthy after CPU quota update: $service ($state)" >&2
              exit 1
            }
            echo "CPU quota updated without restart: $service"
          done
          "${compose[@]}" ps
          docker stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' \
            $(docker ps -q --filter name=silicium-dev-miniworker-)
          REMOTE

