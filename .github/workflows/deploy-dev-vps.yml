          ssh "${ssh_opts[@]}" -p "${VPS_PORT:-22}" \
            "${VPS_USER:-luis}@$VPS_HOST" "sudo -n env SILICIUM_DIAGNOSTIC_JOB_ID='${NETWORK_JOB_ID:-}' bash -s" <<'REMOTE'
