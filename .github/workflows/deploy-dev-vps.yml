name: Development VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Development ref to deploy."
        required: false
        default: dev
      vps_root:
        description: "Development checkout path on the self-hosted VPS runner."
        required: false
        default: /opt/silicium-dev
      release_tag:
        description: "Existing dev GitHub Release tag to install. Blank selects the newest published dev release."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: silicium-vps-dev
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 10
    steps:
      - name: Check VPS without changing state
        shell: bash
        env:
          VPS_ROOT: ${{ github.event.inputs.vps_root }}
        run: |
          set -euo pipefail
          VPS_ROOT="${VPS_ROOT:-/opt/silicium-dev}"
          vps_root="${VPS_ROOT:-/opt/silicium-dev}"
          [[ "$vps_root" == "/opt/silicium-dev" ]] || {
            echo "The development workflow is restricted to /opt/silicium-dev." >&2
            exit 1
          }
          echo "host=$(hostname -f 2>/dev/null || hostname)"
          echo "user=$(id -un)"
          command -v python3 >/dev/null
          command -v docker >/dev/null
          docker compose version
          sudo -n true

          # Production is allowed to remain active: the channel contract now
          # gives dev its own systemd units, ports, Compose project and data
          # roots. Report the state for the audit trail without touching it.
          if sudo systemctl is-active --quiet silicium-orchestrator.service 2>/dev/null; then
            echo "Production orchestrator is active; channel isolation will preserve it."
          fi
          if command -v wg >/dev/null 2>&1 && sudo systemctl is-active --quiet wg-quick@wg0.service 2>/dev/null; then
            echo "Development WireGuard is already active; the deploy will converge its configuration."
          else
            echo "Development WireGuard is not provisioned yet; the deploy bootstrap will install it."
          fi
          if docker ps --format '{{.Label "com.docker.compose.project"}}' 2>/dev/null | grep -Fxq silicium; then
            echo "Production Compose project is active; channel isolation will preserve it."
          fi

          if [[ -d "$vps_root" ]]; then
            [[ -f "$vps_root/deploy/release/channels.json" ]] || {
              echo "Existing development checkout is incomplete: $vps_root" >&2
              exit 22
            }
          fi
          for env_file in orchestrator.env backend.env frontend.env compose.env update-channels.env; do
            if [[ ! -f "/etc/silicium-dev/$env_file" ]]; then
              echo "Missing development config: /etc/silicium-dev/$env_file" >&2
            fi
          done
          df -h / /opt
          echo "Development preflight passed; no VPS state was changed."

  deploy:
    needs: [preflight]
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 60
    environment: development
    steps:
      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out development release metadata
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.inputs.ref || 'dev' }}
          fetch-depth: 1
          sparse-checkout: |
            apps/silicium-node/package.json
          sparse-checkout-cone-mode: false

      - name: Resolve and download validated dev release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/silicium-node/package.json').version")"
          rm -rf -- release-assets
          install -d -m 0755 release-assets
          python3 - "$version" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          version = sys.argv[1]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          input_tag = os.environ.get("RELEASE_TAG_INPUT", "").strip()
          preferred_tag = f"dev-{version}-{os.environ['GITHUB_SHA'][:12]}"
          api_root = f"https://api.github.com/repos/{repository}"
          api_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "silicium-dev-deployer",
          }

          def origin(url):
              parsed = urllib.parse.urlsplit(url)
              return parsed.scheme, parsed.hostname, parsed.port

          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  redirected = super().redirect_request(request, file_pointer, code, message, headers, new_url)
                  if redirected is not None and origin(request.full_url) != origin(new_url):
                      redirected.remove_header("Authorization")
                      redirected.remove_header("X-GitHub-Api-Version")
                  return redirected

          opener = urllib.request.build_opener(SafeRedirectHandler())

          def get_json(url):
              request = urllib.request.Request(url, headers=api_headers)
              with opener.open(request, timeout=60) as response:
                  return json.load(response)

          def get_release(tag):
              encoded_tag = urllib.parse.quote(tag, safe="")
              return get_json(f"{api_root}/releases/tags/{encoded_tag}")

          if input_tag:
              tag = input_tag
              release = get_release(tag)
          else:
              release = None
              try:
                  candidate = get_release(preferred_tag)
                  if candidate.get("prerelease") and not candidate.get("draft"):
                      release = candidate
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if release is None:
                  releases = get_json(f"{api_root}/releases?per_page=100")
                  candidates = [item for item in releases
                                if item.get("prerelease") and not item.get("draft")
                                and item.get("tag_name", "").startswith(f"dev-{version}-")]
                  candidates.sort(key=lambda item: item.get("created_at", ""), reverse=True)
                  if not candidates:
                      raise SystemExit(f"No published dev release for checkout version {version}.")
                  release = candidates[0]
              tag = release.get("tag_name", "")

          if not re.fullmatch(r"dev-[A-Za-z0-9._+-]+-[0-9a-fA-F]{7,64}", tag):
              raise SystemExit("Release tag is not a valid dev tag.")
          if release.get("draft") or not release.get("prerelease"):
              raise SystemExit("Selected release is not a published dev prerelease.")

          os.makedirs("release-assets", exist_ok=True)
          selected = {}
          for asset in release.get("assets", []):
              name = asset.get("name", "")
              if name == "release-channel.json" or name.endswith((".AppImage", ".deb", ".rpm", ".exe")):
                  suffix = "release-channel.json" if name == "release-channel.json" else name.rsplit(".", 1)[-1]
                  if suffix in selected:
                      raise SystemExit(f"Release contains multiple .{suffix} assets.")
                  selected[suffix] = asset

          for required in ("release-channel.json", "AppImage", "deb", "rpm"):
              if required not in selected:
                  raise SystemExit(f"Release is missing required asset: {required}")

          for suffix, asset in selected.items():
              request = urllib.request.Request(
                  asset["url"],
                  headers={**api_headers, "Accept": "application/octet-stream"},
              )
              with opener.open(request, timeout=300) as response:
                  data = response.read()
              if not data:
                  raise SystemExit(f"Release asset {asset['name']} is empty.")
              target = os.path.join("release-assets", asset["name"])
              with open(target, "wb") as output:
                  output.write(data)

          with open("release-assets/release-channel.json", encoding="utf-8") as source:
              metadata = json.load(source)
          if metadata.get("channel") != "dev":
              raise SystemExit("release-channel.json is not a dev release")
          if str(metadata.get("version", "")) != version:
              raise SystemExit(
                  f"release version {metadata.get('version')!r} does not match checkout {version!r}"
              )
          commit = str(metadata.get("commit", ""))
          if not re.fullmatch(r"[0-9a-fA-F]{7,64}", commit):
              raise SystemExit("release-channel.json has an invalid source commit")
          if not tag.endswith(commit[:12]):
              raise SystemExit("release tag and release-channel.json source commit disagree")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={tag}\n")
              output.write(f"release_version={version}\n")
              output.write(f"release_build={commit}\n")
          PY
          python3 - "release-assets/release-channel.json" "$version" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          if metadata.get("channel") != "dev":
              raise SystemExit("release-channel.json is not a dev release")
          if str(metadata.get("version", "")) != sys.argv[2]:
              raise SystemExit(
                  f"release version {metadata.get('version')!r} does not match checkout {sys.argv[2]!r}"
              )
          if not metadata.get("commit"):
              raise SystemExit("release-channel.json has no source commit")
          PY
          shopt -s nullglob
          appimages=(release-assets/*.AppImage)
          debs=(release-assets/*.deb)
          rpms=(release-assets/*.rpm)
          (( ${#appimages[@]} == 1 )) || { echo "Expected exactly one dev AppImage." >&2; exit 1; }
          (( ${#debs[@]} == 1 )) || { echo "Expected exactly one dev .deb." >&2; exit 1; }
          (( ${#rpms[@]} == 1 )) || { echo "Expected exactly one dev .rpm." >&2; exit 1; }
          if [[ "${appimages[0]}" != "release-assets/silicium-node-linux-dev.AppImage" ]]; then
            mv -- "${appimages[0]}" release-assets/silicium-node-linux-dev.AppImage
          fi
          if [[ "${debs[0]}" != "release-assets/silicium-node-linux-dev.deb" ]]; then
            mv -- "${debs[0]}" release-assets/silicium-node-linux-dev.deb
          fi
          if [[ "${rpms[0]}" != "release-assets/silicium-node-linux-dev.rpm" ]]; then
            mv -- "${rpms[0]}" release-assets/silicium-node-linux-dev.rpm
          fi
          # Releases built before the Windows dev lane have no installer: deploy them anyway.
          exes=(release-assets/*.exe)
          (( ${#exes[@]} <= 1 )) || { echo "Expected at most one dev Windows installer." >&2; exit 1; }
          if (( ${#exes[@]} == 1 )) && [[ "${exes[0]}" != "release-assets/silicium-node-windows-dev.exe" ]]; then
            mv -- "${exes[0]}" release-assets/silicium-node-windows-dev.exe
          fi
          (( ${#exes[@]} == 1 )) || echo "::warning::This dev release has no Windows installer."
          release_staging="/tmp/silicium-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "release_staging=$release_staging"
          } >> "$GITHUB_OUTPUT"

      - name: Stage validated dev installers on VPS
        shell: bash
        env:
          RELEASE_STAGING: ${{ steps.release.outputs.release_staging }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RELEASE_STAGING"
          install -m 0644 release-assets/silicium-node-linux-dev.deb "$RELEASE_STAGING/"
          install -m 0755 release-assets/silicium-node-linux-dev.AppImage "$RELEASE_STAGING/"
          install -m 0644 release-assets/silicium-node-linux-dev.rpm "$RELEASE_STAGING/"
          if [[ -f release-assets/silicium-node-windows-dev.exe ]]; then
            install -m 0644 release-assets/silicium-node-windows-dev.exe "$RELEASE_STAGING/"
          fi

      - name: Pull and deploy the dev channel
        shell: bash
        env:
          VPS_ROOT: ${{ github.event.inputs.vps_root }}
          VPS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_REF: ${{ github.event.inputs.ref || 'dev' }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_BUILD: ${{ steps.release.outputs.release_build }}
          RELEASE_STAGING: ${{ steps.release.outputs.release_staging }}
          NODE_ARTIFACTS_STAGED: true
        run: |
          set -euo pipefail
          VPS_ROOT="${VPS_ROOT:-/opt/silicium-dev}"
          VPS_GITHUB_TOKEN="${VPS_GITHUB_TOKEN:?}"
          DEPLOY_REF="${DEPLOY_REF:?}"
          RELEASE_VERSION="${RELEASE_VERSION:?}"
          RELEASE_BUILD="${RELEASE_BUILD:?}"
          RELEASE_STAGING="${RELEASE_STAGING:?}"
          NODE_ARTIFACTS_STAGED="${NODE_ARTIFACTS_STAGED:-false}"
          [[ "$VPS_ROOT" == "/opt/silicium-dev" ]] || { echo "Invalid dev root." >&2; exit 1; }
          [[ "$DEPLOY_REF" == "dev" ]] || { echo "The dev workflow only deploys the dev ref." >&2; exit 1; }
          GIT_AUTH="$(printf 'x-access-token:%s' "$VPS_GITHUB_TOKEN" | base64 -w 0)"
          git_auth() {
            sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
              "GIT_CONFIG_VALUE_0=Authorization: Basic $GIT_AUTH" git "$@"
          }

          if [[ ! -d "$VPS_ROOT/.git" ]]; then
            sudo install -d -m 0755 "$VPS_ROOT"
            sudo chown "$(id -u):$(id -g)" "$VPS_ROOT"
            git_auth clone --branch dev --recurse-submodules \
              https://github.com/Silicium-Project/Fusion.git "$VPS_ROOT"
          fi
          sudo git config --system --add safe.directory "$VPS_ROOT"
          sudo git -C "$VPS_ROOT" remote set-url origin https://github.com/Silicium-Project/Fusion.git
          sudo git -C "$VPS_ROOT" reset --hard --quiet || true
          sudo git -C "$VPS_ROOT" clean -ffd || true
          sudo git -C "$VPS_ROOT" submodule foreach --recursive 'git reset --hard --quiet && git clean -ffd' || true
          git_auth -C "$VPS_ROOT" fetch --no-tags --prune origin dev
          sudo git -C "$VPS_ROOT" checkout dev
          sudo git -C "$VPS_ROOT" reset --hard origin/dev
          sudo git -C "$VPS_ROOT" submodule sync -- BackEnd FrontEnd Network
          git_auth -C "$VPS_ROOT" submodule update --init --force --recursive -- BackEnd FrontEnd Network
          sudo git -C "$VPS_ROOT" clean -ffd
          sudo git -C "$VPS_ROOT" submodule foreach --recursive 'git clean -ffd'
          sudo SILICIUM_STALE_JOB_DAYS=365000 SILICIUM_PRUNE_DOCKER=auto \
            bash "$VPS_ROOT/deploy/linux/cleanup-vps.sh"
          unset GIT_AUTH VPS_GITHUB_TOKEN

          if [[ "$NODE_ARTIFACTS_STAGED" == "true" ]]; then
            sudo install -d -m 0755 /var/lib/silicium-dev/downloads
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-linux-dev.deb" /var/lib/silicium-dev/downloads/silicium-node-linux-dev.deb
            sudo install -m 0755 "$RELEASE_STAGING/silicium-node-linux-dev.AppImage" /var/lib/silicium-dev/downloads/silicium-node-linux-dev.AppImage
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-linux-dev.rpm" /var/lib/silicium-dev/downloads/silicium-node-linux-dev.rpm
            if [[ -f "$RELEASE_STAGING/silicium-node-windows-dev.exe" ]]; then
              sudo install -m 0644 "$RELEASE_STAGING/silicium-node-windows-dev.exe" /var/lib/silicium-dev/downloads/silicium-node-windows-dev.exe
            fi
          fi
          sudo install -d -m 0755 /var/lib/silicium-dev/releases
          cat <<EOF | sudo tee /var/lib/silicium-dev/releases/current.env >/dev/null
          SILICIUM_RELEASE_VERSION=$RELEASE_VERSION
          SILICIUM_RELEASE_CHANNEL=dev
          SILICIUM_RELEASE_BUILD=$RELEASE_BUILD
          SILICIUM_DEPLOY_REF=$DEPLOY_REF
          SILICIUM_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sudo rm -rf -- "$RELEASE_STAGING"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL=dev \
            SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/prepare-dev-config.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL=dev \
            SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/install-services.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL=dev \
            SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" SILICIUM_SKIP_PACKAGE_REPOSITORY_PUBLISH=1 \
            bash "$VPS_ROOT/deploy/compose/deploy.sh" "$VPS_ROOT"
          sudo systemctl start silicium-update-manifest-dev.service
          sudo SILICIUM_RELEASE_CHANNEL=dev bash "$VPS_ROOT/deploy/linux/post-deploy-check.sh" "$VPS_ROOT"
          echo "Development channel deployed: $RELEASE_VERSION ($RELEASE_BUILD)"
