          echo '=== Measured CPU consumers and owning cgroups (2 seconds) ==='
          python3 - <<'PY'
          import os
          import time

          def total_ticks():
              with open('/proc/stat', encoding='ascii') as stream:
                  return sum(map(int, stream.readline().split()[1:]))

          def process_ticks(path):
              try:
                  stat = open(path, encoding='ascii').read()
                  tail = stat[stat.rfind(')') + 2:].split()
                  return int(tail[11]) + int(tail[12])
              except (OSError, ValueError, IndexError):
                  return None

          before_total = total_ticks()
          before = {}
          for entry in os.scandir('/proc'):
              if entry.name.isdigit():
                  ticks = process_ticks(f'{entry.path}/stat')
                  if ticks is not None:
                      before[entry.name] = ticks
          time.sleep(2)
          elapsed_total = total_ticks() - before_total
          cores = os.cpu_count() or 1
          rows = []
          for pid, old_ticks in before.items():
              ticks = process_ticks(f'/proc/{pid}/stat')
              if ticks is None or ticks <= old_ticks:
                  continue
              percent = (ticks - old_ticks) / elapsed_total * cores * 100 if elapsed_total else 0
              try:
                  name = open(f'/proc/{pid}/comm', encoding='utf-8').read().strip()
              except OSError:
                  name = '?'
              try:
                  exe = os.path.basename(os.readlink(f'/proc/{pid}/exe'))
              except OSError:
                  exe = '?'
              try:
                  cgroup = next(line.split(':', 2)[2] for line in open(f'/proc/{pid}/cgroup', encoding='ascii') if line.startswith('0::'))
              except (OSError, StopIteration):
                  cgroup = '?'
              rows.append((percent, pid, name, exe, cgroup))
          for percent, pid, name, exe, cgroup in sorted(rows, reverse=True)[:20]:
              print(f'one_core_cpu={percent:.1f}% pid={pid} comm={name} exe={exe} cgroup={cgroup}')
          PY
          echo '=== Runner and Docker service accounting ==='
          systemctl list-units --all 'actions.runner.*.service' --no-legend --plain 2>&1 || true
          for unit in docker.service actions.runner.Silicium-Project-Fusion.fusion-linux-vps.service actions.runner.Silicium-Project-Fusion.fusion-vps-fusion-extra-1.service; do
            systemctl show "$unit" --property=ActiveState,MainPID,CPUAccounting,CPUUsageNSec,ControlGroup 2>&1 || true
          done
          echo '=== Hot process details and busiest dockerd threads ==='
          for pid in $(ps -eo pid=,comm=,pcpu= --sort=-pcpu | awk '$2 == "dockerd" || $2 == "node" {print $1}' | head -n 5); do
            ps -p "$pid" -o pid,ppid,stat,comm,etime,pcpu
            printf 'exe='; readlink "/proc/$pid/exe" 2>/dev/null || true
            printf 'cwd='; readlink "/proc/$pid/cwd" 2>/dev/null || true
            printf 'cgroup='; tr '\n' ' ' < "/proc/$pid/cgroup" 2>/dev/null || true; printf '\n'
            if [[ "$(cat "/proc/$pid/comm" 2>/dev/null || true)" == dockerd ]]; then
              ps -L -p "$pid" -o pid,tid,stat,pcpu,comm --sort=-pcpu | head -n 12
              python3 - "$pid" <<'PY'
          import os
          import sys
          import time

          process = sys.argv[1]
          clock_ticks = os.sysconf('SC_CLK_TCK')

          def read_threads():
              rows = {}
              root = f'/proc/{process}/task'
              try:
                  tids = os.listdir(root)
              except OSError:
                  return rows
              for tid in tids:
                  try:
                      stat = open(f'{root}/{tid}/stat', encoding='ascii').read()
                      tail = stat[stat.rfind(')') + 2:].split()
                      ticks = int(tail[11]) + int(tail[12])
                      name = open(f'{root}/{tid}/comm', encoding='utf-8').read().strip()
                      rows[tid] = (ticks, name)
                  except (OSError, ValueError, IndexError):
                      continue
              return rows

          before = read_threads()
          started = time.monotonic()
          time.sleep(3)
          elapsed = time.monotonic() - started
          after = read_threads()
          rows = []
          for tid, (ticks, name) in after.items():
              old = before.get(tid)
              if old and ticks > old[0]:
                  rows.append((100 * (ticks - old[0]) / clock_ticks / elapsed, tid, name))
          print('dockerd_thread_cpu_sample=')
          for percent, tid, name in sorted(rows, reverse=True)[:12]:
              print(f'  tid={tid} cpu_one_core={percent:.1f}% comm={name}')
          PY
            fi
          done
          echo '=== Orphaned Fusion runner Node process candidates ==='
          for pid in $(ps -eo pid=,ppid=,comm= | awk '$2 == 1 && $3 == "MainThread" {print $1}'); do
            [[ -r "/proc/$pid/cgroup" ]] || continue
            if ! grep -Fq '/system.slice/actions.runner.Silicium-Project-Fusion.fusion-linux-vps.service' "/proc/$pid/cgroup"; then
              continue
            fi
            ps -p "$pid" -o pid,ppid,pgid,sid,stat,comm,etime,pcpu
            printf 'exe='; readlink "/proc/$pid/exe" 2>/dev/null || true
            printf 'cwd='; readlink "/proc/$pid/cwd" 2>/dev/null || true
            python3 - "$pid" <<'PY'
          import json
          import os
          import sys

          pid = sys.argv[1]
          try:
              raw = open(f'/proc/{pid}/cmdline', 'rb').read().split(b'\0')
              argv = [item.decode('utf-8', 'replace') for item in raw if item]
          except OSError:
              argv = []
          summary = []
          for index, item in enumerate(argv):
              if index == 0:
                  summary.append(os.path.basename(item)[:80])
              elif item.startswith('-'):
                  summary.append(item.split('=', 1)[0][:80])
              elif item.endswith(('.js', '.mjs', '.cjs')):
                  summary.append(os.path.basename(item)[:120])
              else:
                  summary.append('<redacted>')
          print('argv_summary=' + json.dumps(summary))
          PY
          done
          echo '=== P2P process cgroups ==='
          ps -eo pid=,comm=,pcpu= --sort=-pcpu \
            | awk '$2 == "p2p_node" {print $1}' | head -n 10 \
            | while read -r pid; do
                [[ -r "/proc/$pid/cgroup" ]] || continue
                printf 'pid=%s ' "$pid"
                tr '\n' ' ' < "/proc/$pid/cgroup"
                printf '\n'
              done
          echo '=== Dev orchestrator service accounting ==='
          systemctl show silicium-orchestrator-dev.service \
            --property=ActiveState,MainPID,CPUAccounting,CPUUsageNSec,ControlGroup 2>&1 || true
          echo '=== Container CPU snapshot ==='
          docker stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' \
            | sort -k2,2nr | head -n 28
          echo '=== Miniworker configured quotas ==='
          for container in $(docker ps -q --filter name=silicium-dev-miniworker-); do
            docker inspect --format '{{.Name}} pid={{.State.Pid}} cpus={{.HostConfig.NanoCpus}}' "$container"
          done
          echo '=== Docker daemon churn and connection counts ==='
          docker info --format 'logging_driver={{.LoggingDriver}} storage_driver={{.Driver}}'
          echo '=== Docker daemon executable and Unix-socket clients ==='
          dockerd_pid="$(systemctl show docker.service --property=MainPID --value 2>/dev/null || true)"
          file /usr/bin/dockerd 2>&1 || true
          readelf -h /usr/bin/dockerd 2>/dev/null | grep -E 'Type:|Entry point address:' || true
          if [[ "$dockerd_pid" =~ ^[1-9][0-9]*$ ]]; then
            grep '/usr/bin/dockerd' "/proc/$dockerd_pid/maps" 2>/dev/null | head -n 8 || true
          fi
          ss -xap 2>/dev/null | grep -F 'docker.sock' | head -n 30 || true
          python3 - <<'PY'
          import os
          import subprocess

          lines = subprocess.run(['ss', '-xap'], capture_output=True, text=True).stdout.splitlines()
          peer_inodes = set()
          for line in lines:
              fields = line.split()
              try:
                  path_index = fields.index('/run/docker.sock')
              except ValueError:
                  continue
              if path_index + 3 < len(fields) and fields[path_index + 3].isdigit():
                  peer_inodes.add(fields[path_index + 3])

          matches = []
          def process_summary(pid):
              base = f'/proc/{pid}'
              try:
                  comm = open(f'{base}/comm', encoding='utf-8').read().strip()
                  raw = open(f'{base}/cmdline', 'rb').read().split(b'\0')
                  argv = [item.decode('utf-8', 'replace') for item in raw if item]
                  cgroup = next(
                      line.split(':', 2)[2].strip()
                      for line in open(f'{base}/cgroup', encoding='ascii')
                      if line.startswith('0::')
                  )
              except (OSError, StopIteration):
                  return 'unavailable'
              executable = os.path.basename(argv[0]) if argv else comm
              action = ''
              if executable in {'docker', 'docker-compose'} and len(argv) > 1:
                  action = next((item for item in argv[1:] if not item.startswith('-')), '')
              flags = sorted({item.split('=', 1)[0] for item in argv if item.startswith('-')})
              return f'{executable} action={action or "-"} flags={",".join(flags)} cgroup={cgroup}'

          for entry in os.scandir('/proc'):
              if not entry.name.isdigit():
                  continue
              pid = entry.name
              try:
                  fds = os.scandir(f'{entry.path}/fd')
                  with fds:
                      for fd in fds:
                          try:
                              target = os.readlink(fd.path)
                          except OSError:
                              continue
                          if target.startswith('socket:[') and target.endswith(']'):
                              inode = target[8:-1]
                              if inode in peer_inodes:
                                  parent = open(f'{entry.path}/stat', encoding='ascii').read().split(') ', 1)[1].split()[1]
                                  matches.append((inode, pid, parent, process_summary(pid), process_summary(parent)))
              except OSError:
                  continue

          print('docker_socket_clients=')
          for inode, pid, parent, process, parent_process in sorted(matches):
              print(f'  pid={pid} process={process} ppid={parent} parent={parent_process} peer_inode={inode}')
          if not matches:
              print('  no client fd matched the active dockerd peers')
          PY
          docker events --since 5m --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --format '{{.Type}} {{.Action}} {{.Actor.Attributes.name}}' \
            | sort | uniq -c | sort -nr | head -n 20
          printf 'established_tcp_sockets='
          ss -Htan state established 2>/dev/null | wc -l
          printf 'udp_sockets='
          ss -Huan 2>/dev/null | wc -l
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          containers = subprocess.check_output(
              ['docker', 'ps', '-q', '--filter', 'name=silicium-dev-miniworker-'],
              text=True,
          ).split()
          paths = {}
          for container in containers:
              raw = subprocess.check_output(['docker', 'inspect', container], text=True)
              data = json.loads(raw)[0]
              path = data.get('LogPath')
              if path:
                  paths[data.get('Name', container)] = path

          def sizes():
              result = {}
              for name, path in paths.items():
                  try:
                      result[name] = os.stat(path).st_size
                  except OSError:
                      result[name] = 0
              return result

          before = sizes()
          time.sleep(3)
          after = sizes()
          rates = sorted(
              ((after[name] - before.get(name, 0)) / 3 for name in after),
              reverse=True,
          )
          print(f'miniworker_log_growth_total_bytes_per_second={sum(rates):.0f}')
          print(f'miniworker_log_growth_peak_bytes_per_second={(rates[0] if rates else 0):.0f}')
          PY
          echo '=== dockerd sampled call stacks ==='
          dockerd_pid="$(systemctl show docker.service --property=MainPID --value 2>/dev/null || true)"
          if command -v perf >/dev/null 2>&1 && [[ "$dockerd_pid" =~ ^[1-9][0-9]*$ ]]; then
            profile="$(mktemp /tmp/silicium-dockerd.XXXXXX.data)"
            if timeout 12 perf record -F 49 -g -p "$dockerd_pid" -o "$profile" -- sleep 5 >/dev/null 2>&1; then
              timeout 5 perf report -i "$profile" --stdio --no-children --sort comm,dso,symbol | head -n 45
              if command -v go >/dev/null 2>&1; then
                echo '=== Go symbol lookup for dockerd sampled addresses ==='
                go version
                python3 - "$dockerd_pid" "$profile" <<'PY'
          import re
          import subprocess
          import sys

          pid, profile = sys.argv[1:]
          bias = None
          executable_range = None
          try:
              with open(f'/proc/{pid}/maps', encoding='ascii') as maps:
                  for line in maps:
                      fields = line.split()
                      if len(fields) >= 6 and fields[-1] == '/usr/bin/dockerd' and 'x' in fields[1]:
                          start = int(fields[0].split('-', 1)[0], 16)
                          end = int(fields[0].split('-', 1)[1], 16)
                          offset = int(fields[2], 16)
                          bias = start - offset
                          executable_range = (start, end, offset)
                          break
          except (OSError, ValueError):
              pass
          if bias is None:
              print('Could not determine dockerd PIE load bias.')
              raise SystemExit(0)

          sampled = subprocess.run(
              ['perf', 'script', '-i', profile, '-F', 'ip,dso'],
              capture_output=True,
              text=True,
              timeout=8,
          )
          addresses = []
          start, end, offset = executable_range
          for line in sampled.stdout.splitlines():
              if 'dockerd' not in line:
                  continue
              match = re.search(r'\b0x([0-9a-fA-F]+)\b', line)
              if match:
                  address = int(match.group(1), 16)
                  if start <= address < end:
                      addresses.append(address - bias)
                  elif offset <= address < offset + end - start:
                      addresses.append(address)
          unique = list(dict.fromkeys(addresses))[:40]
          if not unique:
              print('No dockerd instruction addresses were captured by perf script.')
              raise SystemExit(0)
          lookup = subprocess.run(
              ['go', 'tool', 'addr2line', '/usr/bin/dockerd'],
              input=''.join(f'{address:x}\n' for address in unique),
              capture_output=True,
              text=True,
              timeout=8,
          )
          symbols = lookup.stdout.splitlines()
          for index, address in enumerate(unique):
              result = ' '.join(symbols[index * 2:index * 2 + 2]) or 'unresolved'
              print(f'pc=0x{address:x} symbol={result}')
          if lookup.returncode:
              print('addr2line_error=' + lookup.stderr.strip()[:300])
          PY
              else
                echo 'Go toolchain is absent; dockerd remains unsymbolized.'
              fi
            else
              echo 'perf sampling was blocked or unavailable on this host.'
            fi
            rm -f "$profile"
          else
            echo 'perf is not installed or dockerd is not running.'
          fi
          REMOTE

  cpu-reclaim:
    if: ${{ github.event.inputs.deployment_target == 'cpu-reclaim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: development
    steps:
      - name: Stop only the verified stale restore process over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PROCESS_ID: ${{ github.event.inputs.process_id }}
        run: |
          set -euo pipefail
          [[ "${PROCESS_ID:-}" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "A numeric process_id is required." >&2
            exit 1
          }
          [[ -n "${VPS_HOST:-}" && -n "${VPS_SSH_KEY:-}" && -n "${VPS_KNOWN_HOSTS:-}" ]] || {
            echo "Missing VPS SSH configuration." >&2
            exit 1
          }
          ssh_dir="$RUNNER_TEMP/silicium-dev-cpu-reclaim-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o IdentitiesOnly=yes \
            -i "$ssh_dir/id_ed25519")
          ssh "${ssh_opts[@]}" -p "${VPS_PORT:-22}" \
            "${VPS_USER:-luis}@$VPS_HOST" \
            "sudo -n bash -s -- '$PROCESS_ID'" <<'REMOTE'
          set -euo pipefail
          pid="$1"
          proc="/proc/$pid"
          [[ -r "$proc/status" && -r "$proc/cgroup" && -r "$proc/cmdline" ]] || {
            echo "Target process has already exited." >&2
            exit 1
          }
          ppid="$(awk '/^PPid:/ {print $2}' "$proc/status")"
          exe="$(readlink "$proc/exe")"
          cwd="$(readlink "$proc/cwd")"
          cgroup="$(cat "$proc/cgroup")"
          elapsed="$(ps -o etimes= -p "$pid" | tr -d '[:space:]')"
          [[ "$ppid" == 1 ]] || { echo "Target is no longer an orphan." >&2; exit 1; }
          [[ "$cgroup" == *'/system.slice/actions.runner.Silicium-Project-Fusion.fusion-linux-vps.service'* ]] || {
            echo "Target is not inside the Fusion VPS runner cgroup." >&2
            exit 1
          }
          runner_main_pid="$(systemctl show actions.runner.Silicium-Project-Fusion.fusion-linux-vps.service --property=MainPID --value)"
          [[ "$runner_main_pid" =~ ^[0-9]+$ && "$pid" != "$runner_main_pid" ]] || {
            echo "Target is the runner service process or its MainPID could not be verified." >&2
            exit 1
          }
          [[ "$exe" =~ ^/home/luis/externals\.[^/]*/node24/bin/node$ ]] || {
            echo "Target executable does not match the Node 24 runner child." >&2
            exit 1
          }
          [[ "$cwd" == /home/luis/_work/Fusion/Fusion ]] || {
            echo "Target is outside the Fusion runner workspace." >&2
            exit 1
          }
          [[ "$elapsed" =~ ^[0-9]+$ ]] && (( elapsed >= 86400 )) || {
            echo "Target process is not at least 24 hours old." >&2
            exit 1
          }
          python3 - "$pid" <<'PY'
          import sys

          raw = open(f'/proc/{sys.argv[1]}/cmdline', 'rb').read().split(b'\0')
          argv = [item.decode('utf-8', 'replace') for item in raw if item]
          if len(argv) != 2 or argv[0].rsplit('/', 1)[-1] != 'node' or argv[1].rsplit('/', 1)[-1] != 'restore.js':
              raise SystemExit('Target command is not exactly node restore.js.')
          PY
          printf 'Stopping verified orphan: pid=%s age_seconds=%s cgroup=Fusion-runner command=node-restore.js\n' "$pid" "$elapsed"
          kill -TERM "$pid"
          for _ in $(seq 1 10); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Orphaned restore process exited after SIGTERM.'
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo 'The orphan did not exit after SIGTERM; no stronger signal was sent.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import time

          with open('/proc/stat', encoding='ascii') as stream:
              first = [int(value) for value in stream.readline().split()[1:]]
          total_a, idle_a = sum(first), first[3] + first[4]
          time.sleep(2)
          with open('/proc/stat', encoding='ascii') as stream:
              second = [int(value) for value in stream.readline().split()[1:]]
          total_b, idle_b = sum(second), second[3] + second[4]
          total_delta = total_b - total_a
          idle_delta = idle_b - idle_a
          busy = 100 * (1 - idle_delta / total_delta) if total_delta else 0
          print(f'host_cpu_busy_percent_after_reclaim={busy:.1f}')
          PY
          cat /proc/pressure/cpu 2>/dev/null || true
          REMOTE
