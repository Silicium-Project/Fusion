name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA). Defaults to event ref."
        required: false
        default: ""
      vps_user:
        description: "SSH user on VPS"
        required: false
        default: "ubuntu"
      vps_port:
        description: "SSH port on VPS"
        required: false
        default: "22"
      vps_root:
        description: "Root path of Fusion checkout on VPS"
        required: false
        default: "/opt/silicium"
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: silicium-vps-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      network: ${{ steps.detect.outputs.network }}
      node_build: ${{ steps.detect.outputs.node_build }}
      submodules: ${{ steps.detect.outputs.submodules }}
      validate: ${{ steps.detect.outputs.validate }}
      deployable: ${{ steps.detect.outputs.deployable }}
    steps:
      - name: Check out the composition
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed surfaces
        id: detect
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          force_all=false
          base="${EVENT_BEFORE:-}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "$base" || "$base" =~ ^0+$ ]]; then
            force_all=true
          else
            git fetch --no-tags --depth=1 origin "$base"
          fi

          if [[ "$force_all" == true ]]; then
            changed_paths="__all__"
          else
            changed_paths="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi

          matches() {
            [[ "$force_all" == true ]] || printf '%s\n' "$changed_paths" | grep -Eq "$1"
          }

          web=false
          network=false
          node_build=false
          submodules=false
          validate=false
          deployable=false

          if matches '^(BackEnd|FrontEnd|Network)(/|$)|^deploy/(compose|linux)/|^deploy/ci/validate-web-stack\.sh$|^\.gitmodules$'; then web=true; fi
          if matches '^(BackEnd|Network)(/|$)|^deploy/(compose|linux)/'; then network=true; fi
          if matches '^Network(/|$)|^apps/silicium-node/|^deploy/ci/build-linux-client\.sh$|^\.gitmodules$'; then node_build=true; fi
          if matches '^BackEnd$|^FrontEnd$|^Network$|^\.gitmodules$'; then submodules=true; fi
          if matches '^(BackEnd|FrontEnd|Network|apps/silicium-node|deploy/|\.gitmodules$|\.github/workflows/)'; then validate=true; fi
          if [[ "$web" == true || "$network" == true || "$node_build" == true ]]; then deployable=true; fi

          # A workflow-only change must exercise the lanes it modifies, but
          # it should not rebuild or redeploy the product by itself.
          if matches '^\.github/workflows/'; then
            web=true
            network=true
            validate=true
          fi

          printf 'Changed paths:\n%s\n' "$changed_paths"
          for name in web network node_build submodules validate deployable; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_OUTPUT"
          done

  prepare-vps-runner:
    needs: [changes]
    if: ${{ needs.changes.outputs.deployable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reclaim stale VPS runner workspaces
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event.inputs.vps_user }}
          VPS_PORT: ${{ github.event.inputs.vps_port }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_SSH_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS are required." >&2
            exit 1
          fi
          vps_user="${VPS_USER:-ubuntu}"
          vps_port="${VPS_PORT:-22}"
          ssh_dir="$RUNNER_TEMP/silicium-vps-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o IdentitiesOnly=yes \
            -i "$ssh_dir/id_ed25519" -p "$vps_port" \
            "$vps_user@$VPS_HOST" "sudo -n bash -s" <<'REMOTE'
          set -euo pipefail
          for workspace in /home/*/_work/Fusion /opt/github-runner*/_work/Fusion; do
            if [[ -d "$workspace" ]]; then
              rm -rf -- "$workspace"
            fi
          done
          for release_staging in /tmp/silicium-release-*; do
            if [[ -d "$release_staging" ]]; then
              rm -rf -- "$release_staging"
            fi
          done
          df -h / /opt
          REMOTE

  submodule-ci-gate:
    needs: [changes, prepare-vps-runner]
    if: ${{ needs.changes.outputs.submodules == 'true' && needs.changes.outputs.deployable == 'true' }}
    uses: ./.github/workflows/submodule-ci-gate.yml
    secrets: inherit

  validate-monorepo:
    needs: [changes, submodule-ci-gate]
    if: ${{ always() && needs.changes.outputs.validate == 'true' && (needs.submodule-ci-gate.result == 'success' || needs.submodule-ci-gate.result == 'skipped') }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Validate composition only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[-]'; then
            echo "A declared submodule is not initialized." >&2
            exit 1
          fi

  tests:
    needs: [changes, submodule-ci-gate]
    if: ${{ always() && needs.changes.outputs.validate == 'true' && (needs.submodule-ci-gate.result == 'success' || needs.submodule-ci-gate.result == 'skipped') }}
    uses: ./.github/workflows/test.yml
    with:
      skip_submodule_ci_gate: true
      web_stack_already_validated: false
      run_web_stack: ${{ needs.changes.outputs.web == 'true' }}
      run_network_core: ${{ needs.changes.outputs.network == 'true' }}
      run_network_e2e: ${{ needs.changes.outputs.network == 'true' }}
      run_network_smoke: ${{ needs.changes.outputs.network == 'true' }}
    secrets: inherit

  build-desktop:
    needs: [changes, validate-monorepo]
    if: ${{ needs.changes.outputs.node_build == 'true' && needs.validate-monorepo.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: powershell
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $staleRules = & git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' 2>$null
          foreach ($rule in $staleRules) {
            $key = ($rule -split '\s+', 2)[0]
            if ($key) { & git config --global --unset-all $key 2>$null }
          }
          $gitAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GH_TOKEN)"))
          & git submodule sync -- BackEnd FrontEnd Network
          if ($LASTEXITCODE -ne 0) { throw "Failed to sync declared submodules" }
          & git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic $gitAuth" submodule update --init --force --recursive -- BackEnd FrontEnd Network
          if ($LASTEXITCODE -ne 0) { throw "Failed to update declared submodules" }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Verify Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $python311 = Join-Path $env:LOCALAPPDATA "Programs\Python\Python311"
          if (Test-Path (Join-Path $python311 "python.exe")) {
            $pythonScripts = Join-Path $python311 "Scripts"
            $python311 | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $pythonScripts | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            & (Join-Path $python311 "python.exe") --version
          } else {
            & py -3.11 --version
            if ($LASTEXITCODE -ne 0) { throw "Python 3.11 is required on the Windows deploy runner" }
          }

      - name: Set up Rust
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $toolCache = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { Join-Path $env:RUNNER_TEMP "tool-cache" }
          $rustRoot = Join-Path $toolCache "rust"
          $cargoHome = Join-Path $rustRoot "cargo"
          $rustupHome = Join-Path $rustRoot "rustup"
          $cargoBin = Join-Path $cargoHome "bin"

          New-Item -ItemType Directory -Force -Path $cargoHome, $rustupHome, $cargoBin | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          $env:PATH = "$cargoBin;$env:PATH"

          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInit = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustupInit
            & $rustupInit -y --profile minimal --default-toolchain stable --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw "Failed to install rustup on Windows deploy runner" }
          }

          & rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Failed to install/update Rust stable toolchain" }
          & rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "Failed to select Rust stable toolchain" }
          & rustc --version
          & cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/silicium-node/src-tauri
            Network/networked/p2p_node
            Network/networked/compute_daemon

      - name: Install desktop dependencies
        working-directory: apps/silicium-node
        run: npm ci

      - name: Import Windows code-signing certificate
        shell: powershell
        env:
          SILICIUM_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.SILICIUM_WINDOWS_CERTIFICATE_BASE64 }}
          SILICIUM_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SILICIUM_WINDOWS_CERTIFICATE_PASSWORD }}
          SILICIUM_WINDOWS_ALLOW_SELF_SIGNED: ${{ vars.SILICIUM_WINDOWS_ALLOW_SELF_SIGNED }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SILICIUM_WINDOWS_CERTIFICATE_BASE64)) {
            throw "Missing SILICIUM_WINDOWS_CERTIFICATE_BASE64 Actions secret"
          }
          if ([string]::IsNullOrEmpty($env:SILICIUM_WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing SILICIUM_WINDOWS_CERTIFICATE_PASSWORD Actions secret"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "silicium-node-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String(($env:SILICIUM_WINDOWS_CERTIFICATE_BASE64 -replace "\s", ""))
            )
          } catch {
            throw "SILICIUM_WINDOWS_CERTIFICATE_BASE64 is not valid base64: $($_.Exception.Message)"
          }

          $password = ConvertTo-SecureString $env:SILICIUM_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importParameters = @{
            FilePath = $certificatePath
            CertStoreLocation = "Cert:\CurrentUser\My"
            Password = $password
            Exportable = $true
          }
          $imported = @(Import-PfxCertificate @importParameters)
          $signingCertificate = $imported |
            Where-Object { $_.HasPrivateKey } |
            Select-Object -First 1
          if (-not $signingCertificate) {
            throw "The PFX does not contain a certificate with a private key"
          }
          if (@($signingCertificate.EnhancedKeyUsageList.ObjectId) -notcontains "1.3.6.1.5.5.7.3.3") {
            throw "The PFX certificate is not valid for code signing"
          }

          $isSelfSigned = $signingCertificate.Subject -eq $signingCertificate.Issuer
          if ($isSelfSigned) {
            if ($env:SILICIUM_WINDOWS_ALLOW_SELF_SIGNED -ne "true") {
              throw "A self-signed certificate is allowed only when SILICIUM_WINDOWS_ALLOW_SELF_SIGNED=true"
            }
            $publicCertificatePath = Join-Path $env:RUNNER_TEMP "silicium-node-code-signing.cer"
            Export-Certificate -Cert $signingCertificate -FilePath $publicCertificatePath -Type CERT | Out-Null
            Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
            Remove-Item -LiteralPath $publicCertificatePath -Force
            Write-Warning "Using a self-signed Windows certificate for test-only packaging"
          }

          $thumbprint = $signingCertificate.Thumbprint.ToUpperInvariant()
          $signingConfig = Join-Path $env:RUNNER_TEMP "silicium-node-windows-signing.conf.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 8 | Out-File -FilePath $signingConfig -Encoding utf8

          "SILICIUM_TAURI_CONFIG=$signingConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SILICIUM_WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Locate Windows signing tool
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $signTool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -File -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "Windows SDK signtool.exe was not found on the GitHub-hosted runner"
          }
          "TAURI_WINDOWS_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build development and production installers
        shell: powershell
        working-directory: apps/silicium-node
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SILICIUM_TAURI_CONFIG) { throw "Windows signing configuration was not initialized" }
          if (-not $env:SILICIUM_WINDOWS_CERTIFICATE_THUMBPRINT) { throw "Windows signing certificate was not imported" }
          $artifacts = Join-Path $PWD "ci-artifacts"
          $devVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $prodVersion = (Get-Content src-tauri/tauri.prod.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null

          function Assert-ValidAuthenticodeSignature([string] $path, [string] $label) {
            if (-not (Test-Path -LiteralPath $path)) { throw "$label was not produced: $path" }
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne "Valid") {
              throw "$label is not Authenticode-valid: $($signature.Status) ($($signature.StatusMessage))"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:SILICIUM_WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "$label was signed by an unexpected certificate"
            }
          }

          $env:SILICIUM_RELEASE_CHANNEL = "dev"
          $env:SILICIUM_RELEASE_VERSION = $devVersion
          $env:SILICIUM_RELEASE_BUILD = "${{ github.sha }}"
          & .\build-installer.cmd
          if ($LASTEXITCODE -ne 0) { throw "Development installer build failed" }
          $devInstaller = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $devInstaller) { throw "Development installer was not produced" }
          Assert-ValidAuthenticodeSignature (Join-Path $PWD "src-tauri\target\release\silicium-node.exe") "Development application"
          Assert-ValidAuthenticodeSignature $devInstaller.FullName "Development installer"
          Copy-Item $devInstaller.FullName (Join-Path $artifacts "silicium-node-windows-dev.exe") -Force

          $env:SILICIUM_RELEASE_CHANNEL = "prod"
          $env:SILICIUM_RELEASE_VERSION = $prodVersion
          $env:SILICIUM_SKIP_RUNTIME_PREPARE = "1"
          # The dev build has already produced the unchanged frontend assets.
          # Tauri still packages the production Rust binary, but does not
          # invoke the frontend bundler a second time.
          $env:SILICIUM_SKIP_FRONTEND_BUILD = "1"
          & .\build-installer.cmd
          if ($LASTEXITCODE -ne 0) { throw "Production installer build failed" }
          $prodInstaller = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $prodInstaller) { throw "Production installer was not produced" }
          Assert-ValidAuthenticodeSignature (Join-Path $PWD "src-tauri\target\release\silicium-node.exe") "Production application"
          Assert-ValidAuthenticodeSignature $prodInstaller.FullName "Production installer"
          Copy-Item $prodInstaller.FullName (Join-Path $artifacts "silicium-node-windows.exe") -Force

          Get-FileHash (Join-Path $artifacts "*.exe") -Algorithm SHA256

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-windows-installers
          path: apps/silicium-node/ci-artifacts/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Stage desktop installers on VPS
        working-directory: apps/silicium-node
        shell: powershell
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event.inputs.vps_user }}
          VPS_PORT: ${{ github.event.inputs.vps_port }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VPS_HOST) { throw "Missing VPS_HOST secret" }
          if (-not $env:VPS_SSH_KEY) { throw "Missing VPS_SSH_KEY secret" }
          if (-not $env:VPS_KNOWN_HOSTS) { throw "Missing VPS_KNOWN_HOSTS secret" }
          $vpsUser = if ([string]::IsNullOrWhiteSpace($env:VPS_USER)) { "ubuntu" } else { $env:VPS_USER }
          $vpsPort = if ([string]::IsNullOrWhiteSpace($env:VPS_PORT)) { "22" } else { $env:VPS_PORT }
          $vpsHost = $env:VPS_HOST
          $releaseStaging = "/tmp/silicium-release-${{ github.run_id }}-${{ github.run_attempt }}"
          $sshDir = Join-Path $HOME ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $sshKey = Join-Path $sshDir "id_ed25519"
          [System.IO.File]::WriteAllText(
            $sshKey,
            (($env:VPS_SSH_KEY -replace "`r", "") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $sshDir "known_hosts"),
            (($env:VPS_KNOWN_HOSTS -replace "`r", "") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          & icacls $sshKey /inheritance:r /grant:r "$($env:USERNAME):F" | Out-Null
          $knownHosts = Join-Path $sshDir "known_hosts"
          & ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$knownHosts" -o IdentitiesOnly=yes -i $sshKey -p $vpsPort "$vpsUser@$vpsHost" "install -d -m 700 '$releaseStaging'"
          & scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$knownHosts" -o IdentitiesOnly=yes -i $sshKey -P $vpsPort `
            "ci-artifacts/silicium-node-windows-dev.exe" `
            "ci-artifacts/silicium-node-windows.exe" `
            "$vpsUser@${vpsHost}:$releaseStaging/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage Windows installers on VPS" }

  build-linux:
    needs: [changes, validate-monorepo]
    if: ${{ needs.changes.outputs.node_build == 'true' && needs.validate-monorepo.result == 'success' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Reclaim Linux build workspace
        shell: bash
        run: |
          set -euo pipefail
          # Keep ignored dependency and Cargo target directories. checkout and
          # the build scripts replace tracked inputs; deleting these caches
          # turns every Linux release into a full rebuild.
          git clean -ffd
          git submodule foreach --recursive 'git clean -ffd'
          df -h "$GITHUB_WORKSPACE"

      - name: Verify Linux desktop prerequisites
        run: |
          set -euo pipefail
          missing=()
          for package in \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf python3-pip; do
            installed=false
            if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              installed=true
            elif [[ "$package" == "libfuse2" ]] && dpkg-query -W -f='${Status}' libfuse2t64 2>/dev/null | grep -q 'install ok installed'; then
              installed=true
            fi
            if [[ "$installed" != true ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Linux desktop prerequisites: %s\n' "${missing[*]}" >&2
            printf 'Run deploy/linux/bootstrap-submodule-runners.sh as root on the VPS.\n' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/silicium-node/src-tauri
            Network/networked/p2p_node
            Network/networked/compute_daemon

      - name: Cache Tauri Linux bundler tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: ${{ runner.os }}-tauri-linux-bundler-v1
          restore-keys: |
            ${{ runner.os }}-tauri-linux-bundler-

      - name: Build Linux development bundles
        shell: bash
        working-directory: apps/silicium-node
        env:
          SILICIUM_RELEASE_CHANNEL: dev
          SILICIUM_RELEASE_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/ci/build-linux-client.sh" "$GITHUB_WORKSPACE"
          install -d ci-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb ci-artifacts/silicium-node-linux-dev.deb
          cp src-tauri/target/release/bundle/appimage/*.AppImage ci-artifacts/silicium-node-linux-dev.AppImage
          sha256sum ci-artifacts/*

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-linux-installers
          path: apps/silicium-node/ci-artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Stage Linux bundle on VPS
        working-directory: apps/silicium-node
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event.inputs.vps_user }}
          VPS_PORT: ${{ github.event.inputs.vps_port }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          VPS_USER="${VPS_USER:-ubuntu}"
          VPS_PORT="${VPS_PORT:-22}"
          RELEASE_STAGING="/tmp/silicium-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$RELEASE_STAGING'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT" \
            ci-artifacts/silicium-node-linux-dev.deb \
            ci-artifacts/silicium-node-linux-dev.AppImage \
            "$VPS_USER@$VPS_HOST:$RELEASE_STAGING/"

  release-metadata:
    needs: [changes]
    if: ${{ needs.changes.outputs.deployable == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: apps/silicium-node/package.json
          sparse-checkout-cone-mode: false

      - name: Read node version
        id: meta
        shell: bash
        run: echo "release_version=$(node -p "require('./apps/silicium-node/package.json').version")" >> "$GITHUB_OUTPUT"

  release-node:
    needs: [changes, validate-monorepo, build-desktop, build-linux, tests]
    if: ${{ always() && needs.changes.outputs.node_build == 'true' && needs.validate-monorepo.result == 'success' && needs.build-desktop.result == 'success' && needs.build-linux.result == 'success' && needs.tests.result == 'success' }}
    runs-on: [self-hosted, fusion-linux]
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release installers
        uses: actions/download-artifact@v4
        with:
          pattern: silicium-node-*-installers
          path: release-assets
          merge-multiple: true

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/silicium-node/package.json').version")"
          TAG="v${VERSION}"
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release tag and installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body: |
            Silicium node release ${{ steps.meta.outputs.release_version }}
            
            - Triggered from main pipeline
            - Submodules pinned in Fusion at ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.release_version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [changes, validate-monorepo, tests, build-desktop, build-linux, release-node, release-metadata]
    if: ${{ always() && needs.changes.outputs.deployable == 'true' && needs.validate-monorepo.result == 'success' && needs.tests.result == 'success' && (needs.changes.outputs.node_build != 'true' || (needs.build-desktop.result == 'success' && needs.build-linux.result == 'success' && needs.release-node.result == 'success')) && needs.release-metadata.result == 'success' }}
    runs-on: [self-hosted, fusion-linux]
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
      RELEASE_VERSION: ${{ needs.release-node.outputs.release_version || needs.release-metadata.outputs.release_version }}
      RELEASE_CHANNEL: ${{ startsWith(github.ref_name, 'v') && 'prod' || 'dev' }}
      RELEASE_BUILD: ${{ github.sha }}
      NODE_ARTIFACTS_STAGED: ${{ needs.changes.outputs.node_build }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error title=Missing secret::Configure VPS_SSH_KEY in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error title=Missing secret::Configure VPS_KNOWN_HOSTS in repository Actions secrets."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Pull and deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event.inputs.vps_user }}
          VPS_PORT: ${{ github.event.inputs.vps_port }}
          VPS_ROOT: ${{ github.event.inputs.vps_root }}
          VPS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_REF: ${{ env.DEPLOY_REF }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          RELEASE_BUILD: ${{ env.RELEASE_BUILD }}
          NODE_ARTIFACTS_STAGED: ${{ env.NODE_ARTIFACTS_STAGED }}
        run: |
          set -euo pipefail
          VPS_USER="${VPS_USER:-ubuntu}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_ROOT="${VPS_ROOT:-/opt/silicium}"
          if [ -z "$VPS_GITHUB_TOKEN" ]; then
            echo "::error title=Missing secret::Configure VPS_GITHUB_TOKEN with read access to Fusion, BackEnd, FrontEnd, and Network."
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "::error title=Missing secret::Configure VPS_HOST in repository Actions secrets."
            exit 1
          fi
          if [ -z "$DEPLOY_REF" ]; then
            echo "::error title=Invalid deploy ref::DEPLOY_REF resolved to an empty value."
            exit 1
          fi
          RELEASE_STAGING="/tmp/silicium-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$RELEASE_STAGING'"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_ROOT='$VPS_ROOT' VPS_GITHUB_TOKEN='$VPS_GITHUB_TOKEN' RELEASE_STAGING='$RELEASE_STAGING' DEPLOY_REF='$DEPLOY_REF' RELEASE_VERSION='$RELEASE_VERSION' RELEASE_CHANNEL='$RELEASE_CHANNEL' RELEASE_BUILD='$RELEASE_BUILD' NODE_ARTIFACTS_STAGED='$NODE_ARTIFACTS_STAGED' bash -s" <<'REMOTE'
          set -euo pipefail
          GIT_AUTH="$(printf 'x-access-token:%s' "$VPS_GITHUB_TOKEN" | base64 -w 0)"
          git_auth() {
            sudo env \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraHeader \
              "GIT_CONFIG_VALUE_0=Authorization: Basic $GIT_AUTH" \
              git "$@"
          }
          sudo git config --system --add safe.directory "$VPS_ROOT"
          sudo git -C "$VPS_ROOT" remote set-url origin https://github.com/Silicium-Project/Fusion.git
          git_auth -C "$VPS_ROOT" fetch --tags --prune origin
          if git -C "$VPS_ROOT" rev-parse --verify --quiet "refs/remotes/origin/$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
            sudo git -C "$VPS_ROOT" reset --hard "origin/$DEPLOY_REF"
          elif git -C "$VPS_ROOT" rev-parse --verify --quiet "refs/tags/$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
          elif git -C "$VPS_ROOT" rev-parse --verify --quiet "$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
          else
            echo "Deploy ref not found: $DEPLOY_REF" >&2
            exit 1
          fi
          sudo git -C "$VPS_ROOT" submodule sync -- BackEnd FrontEnd Network
          for submodule in BackEnd FrontEnd Network; do
            submodule_path="$VPS_ROOT/$submodule"
            if [ -d "$submodule_path" ] && [ ! -e "$submodule_path/.git" ]; then
              sudo rm -rf -- "$submodule_path"
            fi
          done
          git_auth -C "$VPS_ROOT" submodule update --init --force --recursive -- BackEnd FrontEnd Network
          sudo usermod -aG docker github-runner || true
          unset GIT_AUTH VPS_GITHUB_TOKEN
          if [[ "$NODE_ARTIFACTS_STAGED" == "true" ]]; then
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-windows-dev.exe" /var/lib/silicium/downloads/silicium-node-windows-dev.exe
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-windows.exe" /var/lib/silicium/downloads/silicium-node-windows.exe
            sudo install -m 0644 "$RELEASE_STAGING/silicium-node-linux-dev.deb" /var/lib/silicium/downloads/silicium-node-linux-dev.deb
            sudo install -m 0755 "$RELEASE_STAGING/silicium-node-linux-dev.AppImage" /var/lib/silicium/downloads/silicium-node-linux-dev.AppImage
          else
            echo "Node sources unchanged; retaining the existing downloaded installers."
          fi
          sudo install -d -m 0755 /var/lib/silicium/releases
          cat <<EOF | sudo tee /var/lib/silicium/releases/current.env >/dev/null
          SILICIUM_RELEASE_VERSION=$RELEASE_VERSION
          SILICIUM_RELEASE_CHANNEL=$RELEASE_CHANNEL
          SILICIUM_RELEASE_BUILD=$RELEASE_BUILD
          SILICIUM_DEPLOY_REF=$DEPLOY_REF
          SILICIUM_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          rm -rf -- "$RELEASE_STAGING"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL="$RELEASE_CHANNEL" SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/install-services.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL="$RELEASE_CHANNEL" SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/compose/deploy.sh" "$VPS_ROOT"
          sudo systemctl start silicium-update-manifest.service
          if systemctl cat silicium-node.service >/dev/null 2>&1; then
            sudo systemctl restart silicium-node.service
          else
            echo "Skipping silicium-node.service restart: unit is not installed on this host."
          fi
          sudo bash "$VPS_ROOT/deploy/linux/post-deploy-check.sh" "$VPS_ROOT"
          sudo env \
            E2E_TIMEOUT_S=2400 \
            E2E_WAIT_S=1200 \
            DOCKER_CLIENT_TIMEOUT=1200 \
            COMPOSE_HTTP_TIMEOUT=1200 \
            bash "$VPS_ROOT/deploy/compose/e2e.sh" "$VPS_ROOT"
          echo "Release deployed successfully"
          cat /var/lib/silicium/releases/current.env
          REMOTE

      - name: Publish deployment summary
        run: |
          {
            echo "## VPS deployment"
            echo ""
            echo "- deploy ref: $DEPLOY_REF"
            echo "- release version: $RELEASE_VERSION"
            echo "- release channel: $RELEASE_CHANNEL"
            echo "- release build: $RELEASE_BUILD"
            echo "- ssh user: ${VPS_USER:-ubuntu}"
          } >> "$GITHUB_STEP_SUMMARY"
