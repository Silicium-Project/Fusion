name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA). Defaults to event ref."
        required: false
        default: ""
      vps_user:
        description: "SSH user on VPS"
        required: false
        default: "luis"
      vps_port:
        description: "SSH port on VPS"
        required: false
        default: "22"
      vps_root:
        description: "Root path of Fusion checkout on VPS"
        required: false
        default: "/opt/silicium"
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write
  actions: write

concurrency:
  group: silicium-vps-deploy
  cancel-in-progress: false

jobs:
  validate-monorepo:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync -- BackEnd FrontEnd Network
          git submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/silicium-node/package-lock.json
            FrontEnd/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'

      - name: Validate FrontEnd
        working-directory: FrontEnd
        run: |
          npm ci
          npm run test
          npm run build

      - name: Validate siliciuim-node
        working-directory: apps/silicium-node
        run: |
          npm ci
          npm run test
          npm run build

      - name: Validate BackEnd
        working-directory: BackEnd
        run: |
          go test ./...

  cleanup-artifacts:
    needs: [validate-monorepo]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete stale Silicium node artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" --paginate --jq '
              .artifacts[]
              | select(.name == "silicium-node-windows" or .name == "silicium-node-linux")
              | .id
            '
          )"
          if [ -z "${artifact_ids:-}" ]; then
            echo "No stale Silicium node artifacts found."
            exit 0
          fi
          deleted=0
          while IFS= read -r artifact_id; do
            if [ -z "$artifact_id" ]; then
              continue
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted=$((deleted + 1))
          done <<< "$artifact_ids"
          echo "Deleted $deleted stale Silicium node artifacts."

  build-desktop:
    needs: [validate-monorepo, cleanup-artifacts]
    runs-on: windows-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync -- BackEnd FrontEnd Network
          git submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/silicium-node/src-tauri

      - name: Install desktop dependencies
        working-directory: apps/silicium-node
        run: npm ci

      - name: Build development and production installers
        shell: pwsh
        working-directory: apps/silicium-node
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = Join-Path $PWD "ci-artifacts"
          $devVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $prodVersion = (Get-Content src-tauri/tauri.prod.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null

          $env:SILICIUM_RELEASE_CHANNEL = "dev"
          $env:SILICIUM_RELEASE_VERSION = $devVersion
          $env:SILICIUM_RELEASE_BUILD = "${{ github.sha }}"
          & .\build-installer.cmd
          if ($LASTEXITCODE -ne 0) { throw "Development installer build failed" }
          $devInstaller = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $devInstaller) { throw "Development installer was not produced" }
          Copy-Item $devInstaller.FullName (Join-Path $artifacts "silicium-node-windows-dev.exe") -Force

          $env:SILICIUM_RELEASE_CHANNEL = "prod"
          $env:SILICIUM_RELEASE_VERSION = $prodVersion
          $env:SILICIUM_SKIP_RUNTIME_PREPARE = "1"
          & .\build-installer.cmd
          if ($LASTEXITCODE -ne 0) { throw "Production installer build failed" }
          $prodInstaller = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $prodInstaller) { throw "Production installer was not produced" }
          Copy-Item $prodInstaller.FullName (Join-Path $artifacts "silicium-node-windows.exe") -Force

          Get-FileHash (Join-Path $artifacts "*.exe") -Algorithm SHA256

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-windows
          path: apps/silicium-node/ci-artifacts/*.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: [validate-monorepo, cleanup-artifacts]
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync -- BackEnd FrontEnd Network
          git submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf python3-pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/silicium-node/src-tauri

      - name: Build Linux development bundles
        working-directory: apps/silicium-node
        env:
          SILICIUM_RELEASE_CHANNEL: dev
          SILICIUM_RELEASE_BUILD: ${{ github.sha }}
        run: |
          export SILICIUM_RELEASE_VERSION="$(node -p "require('./package.json').version")"
          npm ci
          npm run build
          npm run prepare:runtime:linux
          cargo test --manifest-path src-tauri/Cargo.toml
          npx tauri build --bundles deb
          install -d ci-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb ci-artifacts/silicium-node-linux-dev.deb
          sha256sum ci-artifacts/*

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-linux
          path: apps/silicium-node/ci-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release-node:
    needs: [validate-monorepo, build-desktop, build-linux]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/silicium-node/package.json').version")"
          TAG="v${VERSION}"
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag and GitHub release
        if: steps.meta.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          body: |
            Silicium node release ${{ steps.meta.outputs.release_version }}
            
            - Triggered from main pipeline
            - Submodules pinned in Fusion at ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [validate-monorepo, build-desktop, build-linux, release-node]
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
      RELEASE_VERSION: ${{ needs.release-node.outputs.release_version }}
      RELEASE_CHANNEL: ${{ startsWith(github.ref_name, 'v') && 'prod' || 'dev' }}
      RELEASE_BUILD: ${{ github.sha }}
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          name: silicium-node-windows
          path: release-artifacts

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: silicium-node-linux
          path: release-artifacts

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error title=Missing secret::Configure VPS_SSH_KEY in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error title=Missing secret::Configure VPS_KNOWN_HOSTS in repository Actions secrets."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Pull and deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event.inputs.vps_user }}
          VPS_PORT: ${{ github.event.inputs.vps_port }}
          VPS_ROOT: ${{ github.event.inputs.vps_root }}
          VPS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_REF: ${{ env.DEPLOY_REF }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          RELEASE_BUILD: ${{ env.RELEASE_BUILD }}
        run: |
          set -euo pipefail
          VPS_USER="${VPS_USER:-luis}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_ROOT="${VPS_ROOT:-/opt/silicium}"
          if [ -z "$VPS_GITHUB_TOKEN" ]; then
            echo "::error title=Missing secret::Configure VPS_GITHUB_TOKEN with read access to Fusion, BackEnd, FrontEnd, and Network."
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "::error title=Missing secret::Configure VPS_HOST in repository Actions secrets."
            exit 1
          fi
          if [ -z "$DEPLOY_REF" ]; then
            echo "::error title=Invalid deploy ref::DEPLOY_REF resolved to an empty value."
            exit 1
          fi
          RELEASE_STAGING="/tmp/silicium-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$RELEASE_STAGING'"
          scp -P "$VPS_PORT" \
            release-artifacts/silicium-node-windows-dev.exe \
            release-artifacts/silicium-node-windows.exe \
            release-artifacts/silicium-node-linux-dev.deb \
            "$VPS_USER@$VPS_HOST:$RELEASE_STAGING/"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_ROOT='$VPS_ROOT' VPS_GITHUB_TOKEN='$VPS_GITHUB_TOKEN' RELEASE_STAGING='$RELEASE_STAGING' DEPLOY_REF='$DEPLOY_REF' RELEASE_VERSION='$RELEASE_VERSION' RELEASE_CHANNEL='$RELEASE_CHANNEL' RELEASE_BUILD='$RELEASE_BUILD' bash -s" <<'REMOTE'
          set -euo pipefail
          GIT_AUTH="$(printf 'x-access-token:%s' "$VPS_GITHUB_TOKEN" | base64 -w 0)"
          git_auth() {
            sudo env \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraHeader \
              "GIT_CONFIG_VALUE_0=Authorization: Basic $GIT_AUTH" \
              git "$@"
          }
          sudo git config --system --add safe.directory "$VPS_ROOT"
          sudo git -C "$VPS_ROOT" remote set-url origin https://github.com/Silicium-Project/Fusion.git
          git_auth -C "$VPS_ROOT" fetch --tags --prune origin
          if git -C "$VPS_ROOT" rev-parse --verify --quiet "refs/remotes/origin/$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
            sudo git -C "$VPS_ROOT" reset --hard "origin/$DEPLOY_REF"
          elif git -C "$VPS_ROOT" rev-parse --verify --quiet "refs/tags/$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
          elif git -C "$VPS_ROOT" rev-parse --verify --quiet "$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
          else
            echo "Deploy ref not found: $DEPLOY_REF" >&2
            exit 1
          fi
          sudo git -C "$VPS_ROOT" submodule sync -- BackEnd FrontEnd Network
          for submodule in BackEnd FrontEnd Network; do
            submodule_path="$VPS_ROOT/$submodule"
            if [ -d "$submodule_path" ] && [ ! -e "$submodule_path/.git" ]; then
              sudo rm -rf -- "$submodule_path"
            fi
          done
          git_auth -C "$VPS_ROOT" submodule update --init --force --recursive -- BackEnd FrontEnd Network
          unset GIT_AUTH VPS_GITHUB_TOKEN
          sudo install -m 0644 "$RELEASE_STAGING/silicium-node-windows-dev.exe" /var/lib/silicium/downloads/silicium-node-windows-dev.exe
          sudo install -m 0644 "$RELEASE_STAGING/silicium-node-windows.exe" /var/lib/silicium/downloads/silicium-node-windows.exe
          sudo install -m 0644 "$RELEASE_STAGING/silicium-node-linux-dev.deb" /var/lib/silicium/downloads/silicium-node-linux-dev.deb
          sudo install -d -m 0755 /var/lib/silicium/releases
          cat <<EOF | sudo tee /var/lib/silicium/releases/current.env >/dev/null
          SILICIUM_RELEASE_VERSION=$RELEASE_VERSION
          SILICIUM_RELEASE_CHANNEL=$RELEASE_CHANNEL
          SILICIUM_RELEASE_BUILD=$RELEASE_BUILD
          SILICIUM_DEPLOY_REF=$DEPLOY_REF
          SILICIUM_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          rm -rf -- "$RELEASE_STAGING"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL="$RELEASE_CHANNEL" SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/install-services.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL="$RELEASE_CHANNEL" SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/compose/deploy.sh" "$VPS_ROOT"
          sudo systemctl start silicium-update-manifest.service
          sudo systemctl restart silicium-node.service || true
          sudo bash "$VPS_ROOT/deploy/linux/post-deploy-check.sh" "$VPS_ROOT"
          sudo bash "$VPS_ROOT/deploy/compose/e2e.sh" "$VPS_ROOT"
          echo "Release deployed successfully"
          cat /var/lib/silicium/releases/current.env
          REMOTE

      - name: Publish deployment summary
        run: |
          {
            echo "## VPS deployment"
            echo ""
            echo "- deploy ref: $DEPLOY_REF"
            echo "- release version: $RELEASE_VERSION"
            echo "- release channel: $RELEASE_CHANNEL"
            echo "- release build: $RELEASE_BUILD"
            echo "- ssh user: ${VPS_USER:-luis}"
          } >> "$GITHUB_STEP_SUMMARY"
