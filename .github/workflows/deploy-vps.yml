name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "FrontEnd/**"
      - "BackEnd/**"
      - "Network/**"
      - "deploy/**"
      - ".github/workflows/deploy-vps.yml"

concurrency:
  group: silicium-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error title=Missing secret::Configure VPS_SSH_KEY in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error title=Missing secret::Configure VPS_KNOWN_HOSTS in repository Actions secrets."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Pull and deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_ROOT: ${{ secrets.VPS_ROOT || '/opt/silicium' }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ]; then
            echo "::error title=Missing secret::Configure VPS_HOST in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "::error title=Missing secret::Configure VPS_USER in repository Actions secrets."
            exit 1
          fi
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_ROOT='$VPS_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo git config --system --add safe.directory "$VPS_ROOT"
          sudo git -C "$VPS_ROOT" remote set-url origin https://github.com/Silicium-Project/Fusion.git
          sudo git -C "$VPS_ROOT" fetch origin main
          sudo git -C "$VPS_ROOT" checkout main
          sudo git -C "$VPS_ROOT" pull --ff-only origin main
          sudo git -C "$VPS_ROOT" submodule sync --recursive
          sudo git -C "$VPS_ROOT" submodule update --init --recursive
          sudo bash deploy/linux/build-site.sh "$VPS_ROOT"
          sudo systemctl restart silicium-backend silicium-frontend silicium-dashboard silicium-orchestrator
          REMOTE
