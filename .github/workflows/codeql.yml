name: CodeQL - Code Quality

on:
  push:
    branches:
      - main
      - "issue/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: [self-hosted, fusion-linux]
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        if: matrix.language == 'javascript-typescript'
        shell: bash
        run: |
          set -euo pipefail
          pushd solana-layer/silicium-sdk >/dev/null
          npm ci
          npm run build
          popd >/dev/null
          pushd silicium-layer-dashboard >/dev/null
          corepack enable
          yarn install --frozen-lockfile
          npm run build
          popd >/dev/null

      - name: Python syntax check
        if: matrix.language == 'python'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall tools workloads demo tests
