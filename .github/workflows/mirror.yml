name: Mirror to Epitech
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tests:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' }}
    uses: ./.github/workflows/tests.yml
    with:
      publish_pages: true
      commit_coverage: false

  call:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' }}
    needs: [tests]
    uses: Silicium-Project/epitech-mirror/.github/workflows/subtree-reusable.yml@main
    with:
      epitech_repo: git@github.com:EpitechPromo2027/G-EIP-600-lil-6-1-eip-luis.fernandes.git
      branch: main
      prefix: network   # desktop / frontend / backend selon le repo
    secrets: inherit
