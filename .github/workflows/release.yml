name: Verify private delivery inputs
'on':
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Exact successful Integration workflow run ID
        required: true
        type: string
      qualification_attempt:
        description: Exact Integration workflow run attempt
        required: true
        type: string
      workbench_sha:
        description: Exact Workbench commit qualified by Integration
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: silicium-private-input-${{ inputs.qualification_run }}-${{ inputs.qualification_attempt }}
  cancel-in-progress: false
jobs:
  verify:
    name: delivery/private-inputs
    if: ${{ github.repository == 'Silicium-Project/Workbench' && github.ref == 'refs/heads/main' && vars.SILICIUM_DELIVERY_ENABLED == '1' && vars.SILICIUM_DELIVERY_CONTRACT == 'private-integration-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: project-automation
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      qualification_run: ${{ steps.verify.outputs.qualification_run }}
      qualification_attempt: ${{ steps.verify.outputs.qualification_attempt }}
    steps:
      - name: Check the exact dispatched identities
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
          WORKBENCH_SHA: ${{ inputs.workbench_sha }}
        run: |
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$QUALIFICATION_ATTEMPT" =~ ^[1-9][0-9]{0,6}$ ]]
          [[ "$WORKBENCH_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: integration-reader
        with:
          client-id: ${{ secrets.INTEGRATION_ARTIFACT_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_ARTIFACT_READER_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Integration
          permission-actions: read
      - name: Download exact private receipt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: private-integration-evidence-${{ inputs.qualification_attempt }}
          path: .artifacts/private-integration/receipt
          repository: Silicium-Project/Integration
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ steps.integration-reader.outputs.token }}
          digest-mismatch: error
      - name: Download exact private API output
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: delivery-api-${{ inputs.qualification_attempt }}
          path: .artifacts/private-integration/api
          repository: Silicium-Project/Integration
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ steps.integration-reader.outputs.token }}
          digest-mismatch: error
      - name: Download exact private web output
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: delivery-web-${{ inputs.qualification_attempt }}
          path: .artifacts/private-integration/web
          repository: Silicium-Project/Integration
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ steps.integration-reader.outputs.token }}
          digest-mismatch: error
      - name: Download exact private network output
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: delivery-network-${{ inputs.qualification_attempt }}
          path: .artifacts/private-integration/network
          repository: Silicium-Project/Integration
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ steps.integration-reader.outputs.token }}
          digest-mismatch: error
      - name: Download exact private desktop UI output
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: delivery-node-ui-${{ inputs.qualification_attempt }}
          path: .artifacts/private-integration/node-ui
          repository: Silicium-Project/Integration
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ steps.integration-reader.outputs.token }}
          digest-mismatch: error
      - name: Verify run, receipt, exact pins, artifact digests, and extracted bounds
        id: verify
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
          WORKBENCH_SHA: ${{ inputs.workbench_sha }}
          INTEGRATION_GH_TOKEN: ${{ steps.integration-reader.outputs.token }}
          WORKBENCH_GH_TOKEN: ${{ github.token }}
          PRIVATE_DELIVERY_ARTIFACT_ROOT: .artifacts/private-integration
        run: node tools/ci/private-delivery-input.mjs
