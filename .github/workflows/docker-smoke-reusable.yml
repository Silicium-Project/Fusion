name: Docker Smoke Reusable

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: ""

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
      - name: Build and smoke test Docker images
        run: bash ci/test_images.sh
