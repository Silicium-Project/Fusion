name: Development channel

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Development ref to validate and publish."
        required: false
        default: dev

permissions:
  contents: write

concurrency:
  group: silicium-dev-release
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_channel: dev
    secrets: inherit

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out development metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          sparse-checkout: apps/silicium-node/package.json
          sparse-checkout-cone-mode: false

      - name: Download validated development bundles
        uses: actions/download-artifact@v4
        with:
          name: silicium-node-linux-build
          path: release-assets

      - name: Prepare development release identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/silicium-node/package.json').version")"
          short_sha="${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${version}-${short_sha}" >> "$GITHUB_OUTPUT"
          printf '%s\n' '{"schema_version":1,"channel":"dev","environment":"development","commit":"'"$GITHUB_SHA"'","version":"'"$version"'"}' > release-assets/release-channel.json

      - name: Publish development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Silicium dev ${{ steps.meta.outputs.version }} (${{ github.sha }})"
          prerelease: true
          generate_release_notes: true
          files: release-assets/**
          fail_on_unmatched_files: true
          body: |
            Canal: `dev`
            Version: `${{ steps.meta.outputs.version }}`
            Commit: `${{ github.sha }}`

            Cette release est destinée aux validations avant promotion vers `main`/`prod`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
