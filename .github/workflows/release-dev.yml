name: Development channel

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Development ref to validate and publish."
        required: false
        default: dev

permissions:
  contents: write

concurrency:
  group: silicium-dev-release
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_channel: dev
      stage_release: true
    secrets: inherit

  build-windows:
    # Same toolchain and signing as the production desktop lane, dev channel only.
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: powershell
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $staleRules = & git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' 2>$null
          foreach ($rule in $staleRules) {
            $key = ($rule -split '\s+', 2)[0]
            if ($key) { & git config --global --unset-all $key 2>$null }
          }
          $gitAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GH_TOKEN)"))
          & git submodule sync -- BackEnd FrontEnd Network
          if ($LASTEXITCODE -ne 0) { throw "Failed to sync declared submodules" }
          & git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic $gitAuth" submodule update --init --force --recursive -- BackEnd FrontEnd Network
          if ($LASTEXITCODE -ne 0) { throw "Failed to update declared submodules" }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Rust
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $toolCache = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { Join-Path $env:RUNNER_TEMP "tool-cache" }
          $rustRoot = Join-Path $toolCache "rust"
          $cargoHome = Join-Path $rustRoot "cargo"
          $rustupHome = Join-Path $rustRoot "rustup"
          $cargoBin = Join-Path $cargoHome "bin"

          New-Item -ItemType Directory -Force -Path $cargoHome, $rustupHome, $cargoBin | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          $env:PATH = "$cargoBin;$env:PATH"

          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInit = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustupInit
            & $rustupInit -y --profile minimal --default-toolchain stable --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw "Failed to install rustup on Windows deploy runner" }
          }

          & rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Failed to install/update Rust stable toolchain" }
          & rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "Failed to select Rust stable toolchain" }
          & rustc --version
          & cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fusion-desktop
          workspaces: |
            apps/silicium-node/src-tauri
            Network

      - name: Cache Tauri Windows bundler tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-windows-bundler-${{ hashFiles('apps/silicium-node/package-lock.json', 'apps/silicium-node/src-tauri/Cargo.lock', 'deploy/ci/prepare-tauri-linux-tools.sh') }}
          restore-keys: |
            ${{ runner.os }}-tauri-windows-bundler-

      - name: Install desktop dependencies
        working-directory: apps/silicium-node
        run: npm ci

      - name: Prepare Windows code-signing certificate
        shell: powershell
        env:
          SILICIUM_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.SILICIUM_WINDOWS_CERTIFICATE_BASE64 }}
          SILICIUM_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SILICIUM_WINDOWS_CERTIFICATE_PASSWORD }}
          SILICIUM_WINDOWS_ALLOW_SELF_SIGNED: ${{ vars.SILICIUM_WINDOWS_ALLOW_SELF_SIGNED }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SILICIUM_WINDOWS_CERTIFICATE_BASE64)) {
            throw "Missing SILICIUM_WINDOWS_CERTIFICATE_BASE64 Actions secret"
          }
          if ([string]::IsNullOrEmpty($env:SILICIUM_WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing SILICIUM_WINDOWS_CERTIFICATE_PASSWORD Actions secret"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "silicium-node-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String(($env:SILICIUM_WINDOWS_CERTIFICATE_BASE64 -replace "\s", ""))
            )
          } catch {
            throw "SILICIUM_WINDOWS_CERTIFICATE_BASE64 is not valid base64: $($_.Exception.Message)"
          }
          $signingScriptPath = Join-Path $env:GITHUB_WORKSPACE "apps\silicium-node\src-tauri\windows\sign-with-pfx.ps1"
          if (-not (Test-Path -LiteralPath $signingScriptPath -PathType Leaf)) {
            throw "The Tauri Windows signing helper is missing: $signingScriptPath"
          }
          Write-Host "Windows code-signing certificate decoded; deferring private-key use to signtool.exe"
          $signingConfig = Join-Path $env:RUNNER_TEMP "silicium-node-windows-signing.conf.json"
          @{
            bundle = @{
              windows = @{
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
                signCommand = @{
                  cmd = "powershell.exe"
                  args = @(
                    "-NoLogo",
                    "-NoProfile",
                    "-NonInteractive",
                    "-ExecutionPolicy",
                    "Bypass",
                    "-File",
                    $signingScriptPath,
                    "%1"
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 8 | Out-File -FilePath $signingConfig -Encoding utf8

          "SILICIUM_TAURI_CONFIG=$signingConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SILICIUM_WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate Windows signing tool
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $signTool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -File -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "Windows SDK signtool.exe was not found on the GitHub-hosted runner"
          }
          "TAURI_WINDOWS_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build development installer
        shell: powershell
        working-directory: apps/silicium-node
        env:
          SILICIUM_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SILICIUM_WINDOWS_CERTIFICATE_PASSWORD }}
          SILICIUM_WINDOWS_ALLOW_SELF_SIGNED: ${{ vars.SILICIUM_WINDOWS_ALLOW_SELF_SIGNED }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SILICIUM_TAURI_CONFIG) { throw "Windows signing configuration was not initialized" }
          $artifacts = Join-Path $PWD "ci-artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $env:SILICIUM_RELEASE_CHANNEL = "dev"
          $env:SILICIUM_RELEASE_VERSION = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:SILICIUM_RELEASE_BUILD = "${{ github.sha }}"
          & .\build-installer.cmd
          if ($LASTEXITCODE -ne 0) { throw "Development installer build failed" }
          $devInstaller = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $devInstaller) { throw "Development installer was not produced" }
          $signature = Get-AuthenticodeSignature -LiteralPath $devInstaller.FullName
          if (-not $signature.SignerCertificate) { throw "Development installer is not signed" }
          if ($signature.Status -ne "Valid" -and $env:SILICIUM_WINDOWS_ALLOW_SELF_SIGNED -ne "true") {
            throw "Development installer signature is $($signature.Status)"
          }
          Copy-Item $devInstaller.FullName (Join-Path $artifacts "silicium-node-windows-dev.exe") -Force

      - name: Remove temporary Windows certificate
        if: always()
        shell: powershell
        run: |
          if ($env:SILICIUM_WINDOWS_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:SILICIUM_WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:SILICIUM_WINDOWS_CERTIFICATE_PATH -Force
          }

      - name: Stage Windows development installer on VPS
        working-directory: apps/silicium-node
        shell: powershell
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Handed off through the VPS like the Linux bundles (no Actions artifact storage).
          $ErrorActionPreference = "Stop"
          if (-not $env:VPS_HOST) { throw "Missing VPS_HOST secret" }
          if (-not $env:VPS_SSH_KEY) { throw "Missing VPS_SSH_KEY secret" }
          if (-not $env:VPS_KNOWN_HOSTS) { throw "Missing VPS_KNOWN_HOSTS secret" }
          $vpsUser = if ([string]::IsNullOrWhiteSpace($env:VPS_USER)) { "luis" } else { $env:VPS_USER }
          $vpsPort = if ([string]::IsNullOrWhiteSpace($env:VPS_PORT)) { "22" } else { $env:VPS_PORT }
          $vpsHost = $env:VPS_HOST
          $releaseStaging = "/tmp/silicium-release-${{ github.run_id }}"
          $sshDir = Join-Path $HOME ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $sshKey = Join-Path $sshDir "id_ed25519"
          $knownHosts = Join-Path $sshDir "known_hosts"
          [System.IO.File]::WriteAllText($sshKey, (($env:VPS_SSH_KEY -replace "`r", "") + "`n"), [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($knownHosts, (($env:VPS_KNOWN_HOSTS -replace "`r", "") + "`n"), [System.Text.UTF8Encoding]::new($false))
          & icacls $sshKey /inheritance:r /grant:r "$($env:USERNAME):F" | Out-Null
          & ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$knownHosts" -o IdentitiesOnly=yes -i $sshKey -p $vpsPort "$vpsUser@$vpsHost" "install -d -m 700 '$releaseStaging'"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the release staging directory on VPS" }
          & scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$knownHosts" -o IdentitiesOnly=yes -i $sshKey -P $vpsPort `
            "ci-artifacts/silicium-node-windows-dev.exe" `
            "$vpsUser@${vpsHost}:$releaseStaging/"
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage the Windows installer on VPS" }
          Remove-Item -LiteralPath $sshKey -Force

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out development metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          sparse-checkout: apps/silicium-node/package.json
          sparse-checkout-cone-mode: false

      - name: Configure SSH for release handoff
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${VPS_SSH_KEY:-}" ]] || { echo "Missing VPS_SSH_KEY" >&2; exit 1; }
          [[ -n "${VPS_KNOWN_HOSTS:-}" ]] || { echo "Missing VPS_KNOWN_HOSTS" >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Retrieve staged development bundles
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          vps_user="${VPS_USER:-luis}"
          vps_port="${VPS_PORT:-22}"
          [[ -n "${VPS_HOST:-}" ]] || { echo "Missing VPS_HOST" >&2; exit 1; }
          install -d -m 0755 release-assets
          release_staging="/tmp/silicium-release-${GITHUB_RUN_ID}"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519")
          for remote_file in silicium-node-linux-dev.AppImage silicium-node-linux-dev.deb silicium-node-linux-dev.rpm silicium-node-windows-dev.exe; do
            ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
              "test -s '$release_staging/$remote_file'"
            scp "${ssh_opts[@]}" -P "$vps_port" \
              "$vps_user@$VPS_HOST:$release_staging/$remote_file" release-assets/
          done

      - name: Prepare development release identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/silicium-node/package.json').version")"
          short_sha="${GITHUB_SHA:0:12}"
          backend_sha="$(git ls-tree HEAD BackEnd | awk '{print $3}')"
          frontend_sha="$(git ls-tree HEAD FrontEnd | awk '{print $3}')"
          network_sha="$(git ls-tree HEAD Network | awk '{print $3}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${version}-${short_sha}" >> "$GITHUB_OUTPUT"
          python3 - "$GITHUB_SHA" "$version" "$backend_sha" "$frontend_sha" "$network_sha" > release-assets/release-channel.json <<'PY'
          import json
          import sys

          commit, version, backend, frontend, network = sys.argv[1:]
          json.dump(
              {
                  "schema_version": 1,
                  "channel": "dev",
                  "environment": "development",
                  "commit": commit,
                  "version": version,
                  "components": {
                      "BackEnd": backend,
                      "FrontEnd": frontend,
                      "Network": network,
                  },
              },
              sys.stdout,
              indent=2,
          )
          print()
          PY

      - name: Publish development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Silicium dev ${{ steps.meta.outputs.version }} (${{ github.sha }})"
          prerelease: true
          generate_release_notes: true
          files: release-assets/**
          fail_on_unmatched_files: true
          body: |
            Canal: `dev`
            Version: `${{ steps.meta.outputs.version }}`
            Commit: `${{ github.sha }}`
            Composition: BackEnd/FrontEnd/Network SHA pinned in the artifact `release-channel.json`.

            Cette release est destinée aux validations avant promotion vers `main`/`prod`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
