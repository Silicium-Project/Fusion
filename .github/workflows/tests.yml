name: EntryPoint Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs: {}

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite via silicium CLI
        run: ./silicium test

  smoke:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test proxy + TLS
        run: ./silicium smoke

  worker-cpp:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executor (libs for worker)
        run: make -C executor

      - name: Run worker tests (coverage)
        run: make -C worker test

      - name: Generate coverage report (worker inside build image)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace/worker silicium/cpp-tests:latest \
            bash -lc 'apt-get update && apt-get install -y gcovr && gcovr -r . --filter src --filter include --xml coverage.xml --html-details coverage.html --json-summary coverage-summary.json --print-summary'

      - name: Publish coverage summary
        run: |
          python - <<'PY'
          import json, pathlib, os
          summary = json.loads(pathlib.Path("worker/coverage-summary.json").read_text())
          line_cov = summary["line_covered"], summary["line_total"]
          branch_cov = summary.get("branch_covered", 0), summary.get("branch_total", 0)
          func_cov = summary.get("function_covered", 0), summary.get("function_total", 0)
          def rate(cov):
              covered, total = cov
              return 0.0 if total == 0 else covered / total * 100.0
          lines = rate(line_cov)
          branches = rate(branch_cov)
          funcs = rate(func_cov)
          report = [
              "## Couverture worker",
              f"- Lignes   : {lines:.1f}% ({line_cov[0]}/{line_cov[1]})",
              f"- Fonctions: {funcs:.1f}% ({func_cov[0]}/{func_cov[1]})",
              f"- Branches : {branches:.1f}% ({branch_cov[0]}/{branch_cov[1]})",
          ]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(report))
          PY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: |
            worker/coverage.html
            worker/coverage.xml
            worker/coverage-summary.json

  coverage-pages:
    runs-on: ubuntu-latest
    needs: worker-cpp
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download worker coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-coverage
          path: /tmp/worker-coverage

      - name: Prepare Pages content
        run: |
          mkdir -p public/worker
          cp /tmp/worker-coverage/coverage.html public/worker/index.html
          cp /tmp/worker-coverage/coverage-summary.json public/worker/
          python - <<'PY'
import json, pathlib
summary_path = pathlib.Path("public/worker/coverage-summary.json")
summary = json.loads(summary_path.read_text())
covered = summary.get("line_covered", 0)
total = summary.get("line_total", 0)
ratio = 0 if total == 0 else covered / total * 100
color = "red"
if ratio >= 90:
    color = "brightgreen"
elif ratio >= 80:
    color = "green"
elif ratio >= 70:
    color = "yellowgreen"
elif ratio >= 60:
    color = "yellow"
elif ratio >= 50:
    color = "orange"
badge = {
    "schemaVersion": 1,
    "label": "worker coverage",
    "message": f"{ratio:.1f}%",
    "color": color,
}
(summary_path.parent / "badge.json").write_text(json.dumps(badge))
# Also emit a static SVG badge to avoid raw endpoint issues
color_hex = {
    "brightgreen": "#4c1",
    "green": "#97CA00",
    "yellowgreen": "#a4a61d",
    "yellow": "#dfb317",
    "orange": "#fe7d37",
    "red": "#e05d44",
}.get(color, "#e05d44")
svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="162" height="20" role="img" aria-label="worker coverage: {ratio:.1f}%">
  <title>worker coverage: {ratio:.1f}%</title>
  <linearGradient id="smooth" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <rect rx="3" width="162" height="20" fill="#555"/>
  <rect rx="3" x="100" width="62" height="20" fill="{color_hex}"/>
  <rect rx="3" width="162" height="20" fill="url(#smooth)"/>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="50" y="15">worker coverage</text>
    <text x="130" y="15">{ratio:.1f}%</text>
  </g>
</svg>'''
(summary_path.parent / "badge.svg").write_text(svg)
PY

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  commit-coverage:
    runs-on: ubuntu-latest
    needs: worker-cpp
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download worker coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-coverage
          path: /tmp/worker-coverage

      - name: Update coverage assets in repo
        run: |
          mkdir -p docs/coverage/worker
          cp /tmp/worker-coverage/coverage.html docs/coverage/worker/index.html
          cp /tmp/worker-coverage/coverage-summary.json docs/coverage/worker/coverage-summary.json
          python - <<'PY'
import json, pathlib
summary_path = pathlib.Path("docs/coverage/worker/coverage-summary.json")
summary = json.loads(summary_path.read_text())
covered = summary.get("line_covered", 0)
total = summary.get("line_total", 0)
ratio = 0 if total == 0 else covered / total * 100
color = "red"
if ratio >= 90:
    color = "brightgreen"
elif ratio >= 80:
    color = "green"
elif ratio >= 70:
    color = "yellowgreen"
elif ratio >= 60:
    color = "yellow"
elif ratio >= 50:
    color = "orange"
color_hex = {
    "brightgreen": "#4c1",
    "green": "#97CA00",
    "yellowgreen": "#a4a61d",
    "yellow": "#dfb317",
    "orange": "#fe7d37",
    "red": "#e05d44",
}.get(color, "#e05d44")
badge = {
    "schemaVersion": 1,
    "label": "worker coverage",
    "message": f"{ratio:.1f}%",
    "color": color,
}
(summary_path.parent / "badge.json").write_text(json.dumps(badge))
svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="162" height="20" role="img" aria-label="worker coverage: {ratio:.1f}%">
  <title>worker coverage: {ratio:.1f}%</title>
  <linearGradient id="smooth" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <rect rx="3" width="162" height="20" fill="#555"/>
  <rect rx="3" x="100" width="62" height="20" fill="{color_hex}"/>
  <rect rx="3" width="162" height="20" fill="url(#smooth)"/>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="50" y="15">worker coverage</text>
    <text x="130" y="15">{ratio:.1f}%</text>
  </g>
</svg>'''
(summary_path.parent / "badge.svg").write_text(svg)
# Update README snapshot section between markers
readme = pathlib.Path("README.md")
text = readme.read_text()
line_cov = summary.get("line_covered", 0), summary.get("line_total", 0)
branch_cov = summary.get("branch_covered", 0), summary.get("branch_total", 0)
func_cov = summary.get("function_covered", 0), summary.get("function_total", 0)
def pct(cov):
    c, t = cov
    return 0.0 if t == 0 else c / t * 100.0
snippet = f"- Snapshot (auto) : lignes {pct(line_cov):.1f} %, fonctions {pct(func_cov):.1f} %, branches {pct(branch_cov):.1f} %"
start = "<!-- worker-coverage:start -->"
end = "<!-- worker-coverage:end -->"
if start in text and end in text:
    before, rest = text.split(start, 1)
    mid, after = rest.split(end, 1)
    new_mid = f"\n{snippet}\n"
    readme.write_text(before + start + new_mid + end + after)
PY
PY

      - name: Commit coverage badge and report
        run: |
          if git diff --quiet -- docs/coverage/worker; then
            echo "No coverage changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage/worker/index.html docs/coverage/worker/coverage-summary.json docs/coverage/worker/badge.json docs/coverage/worker/badge.svg README.md
          git commit -m "chore: update worker coverage [skip ci]" || true
          git push origin HEAD:main || echo "Push skipped (branch protection or perms)"
