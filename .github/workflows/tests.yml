name: EntryPoint Tests

on:
  push:
    branches:
      - main
      - "issue/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Deploy coverage Pages"
        required: false
        default: true
        type: boolean
      commit_coverage:
        description: "Commit coverage artifacts to the repo"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      publish_pages:
        required: false
        type: boolean
        default: true
      commit_coverage:
        required: false
        type: boolean
        default: true

jobs:
  raytracer-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test native raytracer
        run: cargo test --manifest-path workloads/raytracer/native/Cargo.toml

  pytest:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate UTF-8 files
        run: python tools/check_utf8.py

      - name: Validate i18n locale packs
        run: python tools/check_i18n_locales.py --strict

      - name: Validate hard-coded i18n strings (changed lines)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          python tools/check_i18n_hardcoded_strings.py --base "$BASE_SHA" --head "$HEAD_SHA" --strict

      - name: Validate C++ interface contract naming
        run: python tools/style_check.py --rules cpp.interface_contract_naming

      - name: Validate C++ ownership safety (changed files)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          python tools/style_check.py \
            --rules cpp.no_unsafe_allocation \
            --changed-against "$BASE_SHA" \
            --changed-head "$HEAD_SHA"

      - name: Lint workload manifests
        run: ./silicium workload lint

      - name: Validate golden corpus
        run: ./silicium workload golden --strict

      - name: Run test suite via silicium CLI
        run: ./silicium test

  docker-e2e:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' }}
    runs-on: ubuntu-latest
    needs: pytest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install e2e dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Docker e2e stack
        run: bash ./ci/docker_e2e.sh

  pytest-windows:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite via silicium CLI (Windows)
        shell: pwsh
        run: |
          $hasDocker = Get-Command docker -ErrorAction SilentlyContinue
          if ($hasDocker) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) {
              python .\silicium test --entrypoint-docker
              exit $LASTEXITCODE
            }
          }
          Write-Host "Docker unavailable on this runner; falling back to host-only Python tests."
          python .\silicium test

  smoke:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test proxy + TLS
        run: ./silicium smoke

  coverage-assets-smoke:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate coverage asset generator
        run: |
          SAMPLE=tools/fixtures/coverage-summary-sample.json
          OUT=/tmp/coverage-assets
          mkdir -p "$OUT"
          python tools/worker_coverage_assets.py \
            --summary "$SAMPLE" \
            --output "$OUT" \
            --summary-html "$OUT/index.html" \
            --full-report coverage-full.html \
            --snapshot "$OUT/snapshot.svg"
          test -s "$OUT/badge.json"
          test -s "$OUT/badge.svg"
          test -s "$OUT/index.html"
          test -s "$OUT/snapshot.svg"

  perf-budget:
    runs-on: ubuntu-latest
    needs: pytest
    env:
      SILICIUM_MAX_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run budget checks
        run: |
          python tools/perf_budget.py \
            --all \
            --strict \
            --output /tmp/perf-budget-report.json

      - name: Publish budget summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/perf-budget-report.json").read_text())
          lines = ["## Performance budget report", ""]
          for item in report.get("results", []):
              profile = item.get("profile", "unknown")
              metrics = item.get("metrics", {})
              budgets = item.get("budgets", {})
              violations = item.get("violations", [])
              status = "FAIL" if violations else "PASS"
              lines.append(f"- `{profile}`: **{status}**")
              lines.append(
                  "  "
                  + f"wall={metrics.get('wall_sec')} / {budgets.get('wall_sec')}, "
                  + f"cpu={metrics.get('cpu_sec')} / {budgets.get('cpu_sec')}, "
                  + f"rss={metrics.get('max_rss_kib')} / {budgets.get('max_rss_kib')}"
              )
              if violations:
                  for violation in violations:
                      lines.append(f"  - violation: `{violation}`")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          PY

      - name: Upload budget artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report
          path: /tmp/perf-budget-report.json

  worker-cpp:
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executor (libs for worker)
        run: make -C executor

      - name: Run worker tests (coverage)
        run: make -C worker test

      - name: Generate coverage report (worker inside build image)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace/worker silicium/cpp-tests:latest \
            bash -lc 'apt-get update && apt-get install -y gcovr && gcovr -r . --filter src --filter include --xml coverage.xml --html-details coverage.html --json-summary coverage-summary.json --print-summary'

      - name: Publish coverage summary
        run: |
          python - <<'PY'
          import json, pathlib, os
          summary = json.loads(pathlib.Path("worker/coverage-summary.json").read_text())
          line_cov = summary["line_covered"], summary["line_total"]
          branch_cov = summary.get("branch_covered", 0), summary.get("branch_total", 0)
          func_cov = summary.get("function_covered", 0), summary.get("function_total", 0)
          def rate(cov):
              covered, total = cov
              return 0.0 if total == 0 else covered / total * 100.0
          lines = rate(line_cov)
          branches = rate(branch_cov)
          funcs = rate(func_cov)
          report = [
              "## Couverture worker",
              f"- Lignes   : {lines:.1f}% ({line_cov[0]}/{line_cov[1]})",
              f"- Fonctions: {funcs:.1f}% ({func_cov[0]}/{func_cov[1]})",
              f"- Branches : {branches:.1f}% ({branch_cov[0]}/{branch_cov[1]})",
          ]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(report))
          PY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: |
            worker/coverage.html
            worker/coverage.xml
            worker/coverage-summary.json

  coverage-pages:
    runs-on: ubuntu-latest
    needs: worker-cpp
    if: github.ref == 'refs/heads/main' && inputs.publish_pages != false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download worker coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-coverage
          path: /tmp/worker-coverage

      - name: Prepare Pages content
        run: |
          mkdir -p public/worker
          cp /tmp/worker-coverage/coverage.html public/worker/coverage-full.html
          cp /tmp/worker-coverage/coverage-summary.json public/worker/
          python tools/worker_coverage_assets.py \
            --summary public/worker/coverage-summary.json \
            --output public/worker \
            --summary-html public/worker/index.html \
            --full-report coverage-full.html \
            --snapshot public/worker/snapshot.svg

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

  commit-coverage:
    runs-on: ubuntu-latest
    needs: worker-cpp
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.commit_coverage != false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download worker coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-coverage
          path: /tmp/worker-coverage

      - name: Update coverage assets in repo
        run: |
          mkdir -p docs/coverage/worker
          cp /tmp/worker-coverage/coverage.html docs/coverage/worker/coverage-full.html
          cp /tmp/worker-coverage/coverage-summary.json docs/coverage/worker/coverage-summary.json
          python tools/worker_coverage_assets.py \
            --summary docs/coverage/worker/coverage-summary.json \
            --output docs/coverage/worker \
            --readme README.md \
            --readme-snapshot docs/coverage/worker/snapshot.svg \
            --readme-report docs/coverage/worker/index.html \
            --summary-html docs/coverage/worker/index.html \
            --full-report coverage-full.html \
            --snapshot docs/coverage/worker/snapshot.svg

      - name: Commit coverage badge and report
        run: |
          if git diff --quiet -- docs/coverage/worker; then
            echo "No coverage changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage/worker/index.html docs/coverage/worker/coverage-full.html docs/coverage/worker/coverage-summary.json docs/coverage/worker/badge.json docs/coverage/worker/badge.svg docs/coverage/worker/snapshot.svg README.md
          git commit -m "chore: update worker coverage [skip ci]" || true
          git push origin HEAD:main || echo "Push skipped (branch protection or perms)"
