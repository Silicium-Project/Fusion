name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: [self-hosted, fusion-linux]
    outputs:
      javascript: ${{ steps.detect.outputs.javascript }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed surfaces
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          force_all=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "${BASE_SHA:-}" || "${BASE_SHA:-}" =~ ^0+$ ]]; then
            force_all=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if [[ "$force_all" == true ]]; then
            changed_paths="__all__"
          else
            changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi
          javascript=false
          if [[ "$force_all" == true ]] || printf '%s\n' "$changed_paths" | grep -Eq '(^|/)(pages|components|composables|layouts|middleware|plugins|public|server|assets|tests)/|(^|/)(app|nuxt|tsconfig|vitest|playwright)\.(config\.)?[cm]?[jt]s$|(^|/)(package|package-lock)\.json$|^\.github/workflows/'; then
            javascript=true
          fi
          printf 'Changed paths:\n%s\n' "$changed_paths"
          printf 'javascript=%s\n' "$javascript" >> "$GITHUB_OUTPUT"

  unit:
    needs: [changes]
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: [changes, unit]
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload Nuxt output for functional tests
        uses: actions/upload-artifact@v4
        with:
          name: frontend-nuxt-output
          path: .output
          if-no-files-found: error
          retention-days: 1

  functional:
    needs: [changes, build]
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Download Nuxt output
        uses: actions/download-artifact@v4
        with:
          name: frontend-nuxt-output
          path: .output
      - run: npx playwright install chromium
      - run: npm run test:functional
