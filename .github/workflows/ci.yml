name: CI
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !github.event.repository.private && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name
      == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
      }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      node: ${{ steps.versions.outputs.node }}
      go: ${{ steps.versions.outputs.go }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - id: versions
      run: node --input-type=module -e 'import fs from "node:fs";let v=JSON.parse(fs.readFileSync("tools/config/toolchains.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`node=${v.node}\ngo=${v.go}\n`)'
    - id: plan
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        SILICIUM_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'node tools/dev.mjs ci plan --base "${BASE_SHA:-origin/main}" --head HEAD --output .artifacts/plan.json

        node --input-type=module <<''JS''

        import fs from ''node:fs'';

        let p=JSON.parse(fs.readFileSync(''.artifacts/plan.json''));

        fs.writeFileSync(''.artifacts/plan.json'',JSON.stringify(p,null,2));

        fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(p.matrix)}

        `);

        JS

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualification-plan
        path: .artifacts/plan.json
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
  validate:
    needs:
    - changes
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.suite == 'solana' && '1.89.0' || '1.98.0' }}
      CARGO_BUILD_JOBS: '4'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ needs.changes.outputs.node }}
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      if: ${{ matrix.suite == 'api' }}
      with:
        go-version: ${{ needs.changes.outputs.go }}
        cache-dependency-path: apps/api/go.sum
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      if: ${{ contains(fromJSON('["network-integration","infrastructure"]'), matrix.suite) }}
      with:
        python-version: '3.11'
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: ${{ contains(fromJSON('["web","node-ui","solana"]'), matrix.suite) }}
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ github.event_name == 'push' && 'trusted' || 'pr' }}-${{ hashFiles('**/package-lock.json') }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      if: ${{ contains(fromJSON('["network","network-wasm","network-integration","node-native","node-windows","solana"]'), matrix.suite)
        }}
      with:
        workspaces: 'network

          apps/node/src-tauri

          chain/solana'
        shared-key: ${{ matrix.suite }}-${{ github.event_name == 'push' && 'trusted' || 'pr' }}
        cache-on-failure: 'false'
        cache-targets: ${{ matrix.suite != 'solana' }}
    - name: Prepare runner
      shell: bash
      run: node tools/ci/bootstrap.mjs "${{ matrix.suite }}"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualification-plan
        path: .artifacts
    - name: Execute shared suite
      shell: bash
      run: node tools/dev.mjs test --suite "${{ matrix.suite }}" --plan .artifacts/plan.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: report-${{ matrix.suite }}
        path: .artifacts/reports/${{ matrix.suite }}.json
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'web' }}
      with:
        name: web-output
        path: apps/web/.output
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'node-ui' }}
      with:
        name: node-ui-output
        path: apps/node/dist
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'api' }}
      with:
        name: api-binary
        path: .artifacts/build/api
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'network-integration' }}
      with:
        name: network-binaries
        path: .artifacts/build/network
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
  required:
    name: ci/required
    if: ${{ always() && !github.event.repository.private }}
    needs:
    - changes
    - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualification-plan
        path: .artifacts
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: report-*
        path: .artifacts/reports
        merge-multiple: 'true'
    - name: Require every planned execution
      env:
        PLANNER_RESULT: ${{ needs.changes.result }}
        EXECUTION_RESULT: ${{ needs.validate.result }}
      run: 'test "$PLANNER_RESULT" = success

        test "$EXECUTION_RESULT" = success

        node tools/dev.mjs ci gate --plan .artifacts/plan.json --reports .artifacts/reports --sha "$GITHUB_SHA"'
