name: CI
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'silicium-main-delivery' || format('ci-{0}', github.event.pull_request.number
    || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && (!github.event.repository.private || (github.event_name == 'pull_request' && vars.SILICIUM_PRIVATE_CI_WINDOW != '')) &&
      (github.event_name != 'push' || needs.budget.result == 'success') }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      node: ${{ steps.versions.outputs.node }}
      go: ${{ steps.versions.outputs.go }}
      quick_matrix: ${{ steps.plan.outputs.quick_matrix }}
      integration_matrix: ${{ steps.plan.outputs.integration_matrix }}
      integration_count: ${{ steps.plan.outputs.integration_count }}
    steps:
    - name: Authorize internal writer pull request from authoritative metadata
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_NUMBER: ${{ github.event.number }}
      run: 'node --input-type=module <<''JS''

        const repo=process.env.GITHUB_REPOSITORY,number=process.env.PULL_NUMBER;

        if(!/^[1-9][0-9]*$/.test(number??''''))throw new Error(''Missing pull request number'');

        const get=async path=>{const r=await fetch(`https://api.github.com/${path}`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:''application/vnd.github+json''},signal:AbortSignal.timeout(15000)});if(!r.ok)throw
        new Error(`GitHub authorization metadata failed: HTTP ${r.status}`);return r.json()};

        const pr=await get(`repos/${repo}/pulls/${number}`);

        if(pr.head.repo?.id!==pr.base.repo?.id)throw new Error(''External contributions remain disabled during stabilization'');

        const permission=await get(`repos/${repo}/collaborators/${encodeURIComponent(pr.user.login)}/permission`);

        if(![''admin'',''maintain'',''write''].includes(permission.permission))throw new Error(''Team write permission is required for qualification'');

        console.log(JSON.stringify({pull_request:Number(number),same_repository:true,permission:permission.permission}));

        JS'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Verify bounded private qualification authorization
      if: ${{ github.event.repository.private }}
      env:
        QUALIFICATION_WINDOW: ${{ vars.SILICIUM_PRIVATE_CI_WINDOW }}
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: 'node --input-type=module <<''JS''

        import { validatePrivateWindow } from ''./tools/lib/billing.mjs'';

        validatePrivateWindow(JSON.parse(process.env.QUALIFICATION_WINDOW), process.env.EXPECTED_HEAD);

        JS

        '
    - id: versions
      run: node --input-type=module -e 'import fs from "node:fs";let v=JSON.parse(fs.readFileSync("tools/config/toolchains.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`node=${v.node}\ngo=${v.go}\n`)'
    - id: plan
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        SILICIUM_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        SILICIUM_POLICY_MIGRATION_SHA: ${{ vars.SILICIUM_POLICY_MIGRATION_SHA }}
      run: 'node tools/dev.mjs ci plan --base "${BASE_SHA:-origin/main}" --head HEAD --output .artifacts/plan.json

        node --input-type=module <<''JS''

        import fs from ''node:fs'';

        import { splitMatrix } from ''./tools/lib/planner.mjs'';

        let p=JSON.parse(fs.readFileSync(''.artifacts/plan.json''));

        const phases=splitMatrix(p);

        for(const [key,value] of Object.entries({quick_matrix:phases.quick,integration_matrix:phases.integration,integration_count:phases.integration_count}))
        fs.appendFileSync(process.env.GITHUB_OUTPUT,`${key}=${JSON.stringify(value)}\n`);

        fs.writeFileSync(''.artifacts/plan.json'',JSON.stringify(p,null,2));

        fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(p.matrix)}

        `);

        JS

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualification-plan
        path: .artifacts/plan.json
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    needs:
    - budget
    permissions:
      contents: read
      pull-requests: read
  validate:
    needs: &id001
    - changes
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.integration_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.suite == 'solana' && '1.89.0' || '1.98.0' }}
      CARGO_BUILD_JOBS: '4'
    steps: &id002
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ needs.changes.outputs.node }}
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      if: ${{ matrix.suite == 'api' }}
      with:
        go-version: ${{ needs.changes.outputs.go }}
        cache-dependency-path: apps/api/go.sum
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      if: ${{ contains(fromJSON('["network-integration","infrastructure"]'), matrix.suite) }}
      with:
        python-version: 3.11.17
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: ${{ !github.event.repository.private && contains(fromJSON('["web","node-ui","solana","tooling"]'), matrix.suite) }}
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ github.event_name == 'push' && 'trusted' || 'pr' }}-${{ hashFiles('**/package-lock.json') }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      if: ${{ !github.event.repository.private && contains(fromJSON('["network","network-wasm","network-integration","node-native","node-windows","solana"]'),
        matrix.suite) }}
      with:
        workspaces: 'network

          apps/node/src-tauri

          chain/solana'
        shared-key: ${{ matrix.suite }}-${{ github.event_name == 'push' && 'trusted' || 'pr' }}
        cache-on-failure: 'false'
        cache-targets: ${{ matrix.suite != 'solana' }}
    - name: Prepare runner
      shell: bash
      run: node tools/ci/bootstrap.mjs "${{ matrix.suite }}"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualification-plan
        path: .artifacts
    - name: Execute shared suite
      shell: bash
      run: node tools/dev.mjs test --suite "${{ matrix.suite }}" --plan .artifacts/plan.json
    - name: Check artifact size reservation
      if: ${{ always() }}
      shell: bash
      run: node tools/ci/artifact-size.mjs ".artifacts/reports/${{ matrix.suite }}.json" 1048576
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: report-${{ matrix.suite }}
        path: .artifacts/reports/${{ matrix.suite }}.json
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'web' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs "apps/web/.output" 41943040
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'web' }}
      with:
        name: web-output
        path: apps/web/.output
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'node-ui' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs "apps/node/dist" 2097152
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'node-ui' }}
      with:
        name: node-ui-output
        path: apps/node/dist
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'api' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs ".artifacts/build/api" 50331648
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'api' }}
      with:
        name: api-binary
        path: .artifacts/build/api
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'network-integration' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs ".artifacts/build/network" 117440512
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'network-integration' }}
      with:
        name: network-binaries
        path: .artifacts/build/network
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    if: ${{ needs.changes.outputs.integration_count != '0' }}
  required:
    name: ci/required
    if: ${{ always() && (!github.event.repository.private || (github.event_name == 'pull_request' && vars.SILICIUM_PRIVATE_CI_WINDOW != '')) }}
    needs:
    - changes
    - validate
    - quick
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Check planner and execution readiness
      env:
        PLANNER_RESULT: ${{ needs.changes.result }}
        QUICK_RESULT: ${{ needs.quick.result }}
        EXECUTION_RESULT: ${{ needs.validate.result }}
        INTEGRATION_COUNT: ${{ needs.changes.outputs.integration_count }}
      run: 'node --input-type=module <<''JS''

        const values=Object.fromEntries([''PLANNER_RESULT'',''QUICK_RESULT'',''EXECUTION_RESULT'',''INTEGRATION_COUNT''].map(key=>[key,process.env[key]]));

        console.log(JSON.stringify(values));

        if(values.PLANNER_RESULT!==''success''||values.QUICK_RESULT!==''success''||(values.INTEGRATION_COUNT===''0''?values.EXECUTION_RESULT!==''skipped'':values.EXECUTION_RESULT!==''success''))process.exit(1);

        JS'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualification-plan
        path: .artifacts
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: report-*
        path: .artifacts/reports
        merge-multiple: 'true'
    - name: Require every planned execution
      env:
        PLANNER_RESULT: ${{ needs.changes.result }}
        EXECUTION_RESULT: ${{ needs.validate.result }}
        QUICK_RESULT: ${{ needs.quick.result }}
        INTEGRATION_COUNT: ${{ needs.changes.outputs.integration_count }}
      run: 'test "$PLANNER_RESULT" = success

        test "$QUICK_RESULT" = success

        if [ "$INTEGRATION_COUNT" = 0 ]; then test "$EXECUTION_RESULT" = skipped; else test "$EXECUTION_RESULT" = success; fi

        node tools/dev.mjs ci gate --plan .artifacts/plan.json --reports .artifacts/reports --sha "$GITHUB_SHA"'
  budget:
    if: ${{ !github.event.repository.private || (github.event_name == 'pull_request' && vars.SILICIUM_PRIVATE_CI_WINDOW != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && 'project-automation' || 'qualification-readonly' }}
    steps:
    - name: PR qualification has no binary upload reservation
      if: ${{ github.event_name != 'push' }}
      run: echo 'Only qualification plan and bounded reports are transferred; no delivery or binary upload.'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        persist-credentials: false
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      id: budget-token
      with:
        client-id: ${{ secrets.PROJECT_APP_CLIENT_ID }}
        private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        owner: Silicium-Project
        permission-actions: read
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - name: Check organization artifact headroom
      env:
        GH_TOKEN: ${{ steps.budget-token.outputs.token }}
        SILICIUM_BUDGET_INSTALLATION_ID: ${{ steps.budget-token.outputs.installation-id }}
        SILICIUM_BUDGET_APP_CLIENT_ID: ${{ secrets.PROJECT_APP_CLIENT_ID }}
        SILICIUM_BUDGET_APP_PRIVATE_KEY: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        SILICIUM_INCOMING_BYTES: '220200960'
      run: node tools/ci/storage-budget.mjs
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  quick:
    needs: *id001
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps: *id002
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.quick_matrix) }}
