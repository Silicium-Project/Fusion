name: CI
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && 'silicium-main-delivery' || format('ci-{0}', github.event.pull_request.number
    || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && (github.event_name != 'push' || needs.budget.result == 'success') }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      node: ${{ steps.versions.outputs.node }}
      go: ${{ steps.versions.outputs.go }}
      quick_matrix: ${{ steps.plan.outputs.quick_matrix }}
      integration_matrix: ${{ steps.plan.outputs.integration_matrix }}
      integration_count: ${{ steps.plan.outputs.integration_count }}
      policy_audit: ${{ steps.plan.outputs.policy_audit }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - name: Authorize internal writer pull request from authoritative metadata
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_NUMBER: ${{ github.event.number }}
      run: node tools/ci/authorize-internal-pull-request.mjs
    - id: versions
      run: node --input-type=module -e 'import fs from "node:fs";let v=JSON.parse(fs.readFileSync("tools/config/toolchains.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`node=${v.node}\ngo=${v.go}\n`)'
    - id: plan
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        SILICIUM_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        SILICIUM_POLICY_MIGRATION_SHA: ${{ vars.SILICIUM_POLICY_MIGRATION_SHA }}
        SILICIUM_TRUSTED_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Silicium-Project/Workbench' }}
      run: 'node tools/dev.mjs ci plan --scope public --base "${BASE_SHA:-origin/main}" --head HEAD --output .artifacts/plan.json

        node --input-type=module <<''JS''

        import fs from ''node:fs'';

        import { splitMatrix } from ''./tools/lib/planner.mjs'';

        let p=JSON.parse(fs.readFileSync(''.artifacts/plan.json''));

        const phases=splitMatrix(p);

        const policyFiles=["tools/config/repository-policy.json","tools/lib/repository-policy.mjs","tests/dev/repository-policy.test.mjs","tools/dev.mjs",".github/workflows/ci.yml"];
        const policyAudit=p.paths.some(path=>policyFiles.includes(path));

        for(const [key,value] of Object.entries({quick_matrix:phases.quick,integration_matrix:phases.integration,integration_count:phases.integration_count,policy_audit:policyAudit}))
        fs.appendFileSync(process.env.GITHUB_OUTPUT,`${key}=${JSON.stringify(value)}\n`);

        fs.writeFileSync(''.artifacts/plan.json'',JSON.stringify(p,null,2));

        fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(p.matrix)}

        `);

        JS

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: qualification-plan-${{ github.run_attempt }}
        path: .artifacts/plan.json
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    needs:
    - budget
    permissions:
      contents: read
      pull-requests: read
  validate:
    needs: &id001
    - changes
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.integration_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.suite == 'solana' && '1.89.0' || '1.98.0' }}
      CARGO_BUILD_JOBS: '4'
    steps: &id002
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ needs.changes.outputs.node }}
        package-manager-cache: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      if: ${{ matrix.suite == 'api' }}
      with:
        go-version: ${{ needs.changes.outputs.go }}
        cache-dependency-path: apps/api/go.sum
        cache: true
      id: go-toolchain
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      if: ${{ contains(fromJSON('["network-integration","infrastructure"]'), matrix.suite) }}
      with:
        python-version: 3.11.17
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: ${{ contains(fromJSON('["web","node-ui","solana","tooling"]'), matrix.suite) }}
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name == 'push' && 'trusted' || 'pr' }}-${{ hashFiles('tools/config/toolchains.json', '**/package-lock.json') }}
      id: npm-cache
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      if: ${{ contains(fromJSON('["network","network-wasm","network-integration","node-native","node-windows","solana"]'),
        matrix.suite) }}
      with:
        workspaces: 'network

          apps/node/src-tauri

          chain/solana'
        shared-key: ${{ matrix.suite }}-${{ github.event_name == 'push' && 'trusted' || 'pr' }}
        cache-on-failure: 'false'
        cache-targets: ${{ matrix.suite != 'solana' }}
      id: rust-cache
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: qualification-plan-${{ github.run_attempt }}
        path: .artifacts
        digest-mismatch: error
    - name: Prepare runner
      shell: bash
      run: node tools/ci/bootstrap.mjs "${{ matrix.suite }}"
    - name: Execute shared suite
      shell: bash
      run: node tools/dev.mjs test --suite "${{ matrix.suite }}" --plan .artifacts/plan.json
      env:
        SILICIUM_CACHE_ENABLED: 'true'
        SILICIUM_CACHE_NPM: ${{ steps.npm-cache.outputs.cache-hit }}
        SILICIUM_CACHE_RUST: ${{ steps.rust-cache.outputs.cache-hit }}
        SILICIUM_CACHE_GO: ${{ steps.go-toolchain.outputs.cache-hit }}
    - name: Audit public repository ruleset after policy changes
      if: ${{ matrix.suite == 'tooling' && needs.changes.outputs.policy_audit == 'true' }}
      shell: bash
      run: node tools/dev.mjs ci policy --json
    - name: Check artifact size reservation
      if: ${{ always() }}
      shell: bash
      run: node tools/ci/artifact-size.mjs ".artifacts/reports/${{ matrix.suite }}.json" 1048576
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: report-${{ matrix.suite }}-${{ github.run_attempt }}
        path: .artifacts/reports/${{ matrix.suite }}.json
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'web' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs "apps/web/.output" 41943040
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'web' }}
      with:
        name: web-output-${{ github.run_attempt }}
        path: apps/web/.output
        include-hidden-files: 'true'
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'node-ui' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs "apps/node/dist" 2097152
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'node-ui' }}
      with:
        name: node-ui-output-${{ github.run_attempt }}
        path: apps/node/dist
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'api' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs ".artifacts/build/api" 50331648
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'api' }}
      with:
        name: api-binary-${{ github.run_attempt }}
        path: .artifacts/build/api
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    - name: Check artifact size reservation
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'network-integration' }}
      shell: bash
      run: node tools/ci/artifact-size.mjs ".artifacts/build/network" 117440512
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ success() && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && matrix.suite == 'network-integration' }}
      with:
        name: network-binaries-${{ github.run_attempt }}
        path: .artifacts/build/network
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
    if: ${{ needs.changes.outputs.integration_count != '0' }}
  required:
    name: ci/required
    if: ${{ always() }}
    needs:
    - changes
    - validate
    - quick
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Check planner and execution readiness
      env:
        PLANNER_RESULT: ${{ needs.changes.result }}
        QUICK_RESULT: ${{ needs.quick.result }}
        EXECUTION_RESULT: ${{ needs.validate.result }}
        INTEGRATION_COUNT: ${{ needs.changes.outputs.integration_count }}
      run: 'node --input-type=module <<''JS''

        const values=Object.fromEntries([''PLANNER_RESULT'',''QUICK_RESULT'',''EXECUTION_RESULT'',''INTEGRATION_COUNT''].map(key=>[key,process.env[key]]));

        console.log(JSON.stringify(values));

        if(values.PLANNER_RESULT!==''success''||values.QUICK_RESULT!==''success''||(values.INTEGRATION_COUNT===''0''?values.EXECUTION_RESULT!==''skipped'':values.EXECUTION_RESULT!==''success''))process.exit(1);

        JS'
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: qualification-plan-${{ github.run_attempt }}
        path: .artifacts
        digest-mismatch: error
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: report-*-${{ github.run_attempt }}
        path: .artifacts/reports
        merge-multiple: 'true'
        digest-mismatch: error
    - name: Require every planned execution
      env:
        PLANNER_RESULT: ${{ needs.changes.result }}
        EXECUTION_RESULT: ${{ needs.validate.result }}
        QUICK_RESULT: ${{ needs.quick.result }}
        INTEGRATION_COUNT: ${{ needs.changes.outputs.integration_count }}
      run: 'test "$PLANNER_RESULT" = success

        test "$QUICK_RESULT" = success

        if [ "$INTEGRATION_COUNT" = 0 ]; then test "$EXECUTION_RESULT" = skipped; else test "$EXECUTION_RESULT" = success; fi

        node tools/dev.mjs ci gate --plan .artifacts/plan.json --reports .artifacts/reports --sha "$GITHUB_SHA"'
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'project-automation' || 'qualification-readonly' }}
    steps:
    - name: PR qualification has no binary upload reservation
      if: ${{ github.event_name == 'pull_request' }}
      run: echo 'Only qualification plan and bounded reports are transferred; no delivery or binary upload.'
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: main
        persist-credentials: false
      if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.4
        package-manager-cache: false
      if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      id: budget-token
      with:
        client-id: ${{ secrets.PROJECT_APP_CLIENT_ID }}
        private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        owner: Silicium-Project
        permission-actions: read
      if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    - name: Check organization artifact headroom
      env:
        GH_TOKEN: ${{ steps.budget-token.outputs.token }}
        SILICIUM_BUDGET_INSTALLATION_ID: ${{ steps.budget-token.outputs.installation-id }}
        SILICIUM_BUDGET_APP_CLIENT_ID: ${{ secrets.PROJECT_APP_CLIENT_ID }}
        SILICIUM_BUDGET_APP_PRIVATE_KEY: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        SILICIUM_INCOMING_BYTES: '411041792'
      run: node tools/ci/storage-budget.mjs
      if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
  quick:
    needs: *id001
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps: *id002
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.quick_matrix) }}
