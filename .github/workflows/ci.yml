name: Network CI

on:
  push:
    branches:
      - main
      - "issue/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: [self-hosted, fusion-linux]
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        if: matrix.language == 'javascript-typescript'
        shell: bash
        run: |
          set -euo pipefail
          pushd solana-layer/silicium-sdk >/dev/null
          npm ci
          npm run build
          popd >/dev/null
          pushd silicium-layer-dashboard >/dev/null
          corepack enable
          yarn install --frozen-lockfile
          npm run build
          popd >/dev/null

      - name: Python syntax check
        if: matrix.language == 'python'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall tools workloads demo tests

  p2p-node:
    permissions:
      contents: read
      packages: write
    runs-on: [self-hosted, fusion-linux]
    strategy:
      fail-fast: false
      matrix:
        crate:
          - networked/silicium_node_core
          - networked/p2p_node

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test

      - name: P2P Kademlia smoke
        if: matrix.crate == 'networked/p2p_node'
        run: bash ./ci/p2p_kademlia_smoke.sh

  solana-layer:
    name: Build and test Anchor program
    runs-on: [self-hosted, fusion-linux]

    defaults:
      run:
        working-directory: solana-layer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: solana-layer/yarn.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: Expose rustup cargo
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup override set 1.89.0
          cargo --version
          rustc --version

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-solana-layer-${{ hashFiles('solana-layer/Cargo.lock', 'solana-layer/programs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-solana-layer-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup run stable cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Create temporary local wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json
          solana config set --url localhost
          solana address

      - name: Sync Anchor program IDs for localnet
        run: anchor keys sync --provider.cluster localnet

      - name: Check program ID alignment
        run: |
          anchor keys list
          grep -R "declare_id" programs/solana-layer/src/lib.rs
          grep -n "solana_layer" Anchor.toml

      - name: Build Anchor program
        env:
          RUSTUP_TOOLCHAIN: "1.89.0"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup run 1.89.0 cargo --version
          rustup run 1.89.0 rustc --version
          rustup run 1.89.0 anchor build --provider.cluster localnet

      - name: Run Anchor tests on localnet
        env:
          RUSTUP_TOOLCHAIN: "1.89.0"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup run 1.89.0 cargo --version
          rustup run 1.89.0 rustc --version
          rustup run 1.89.0 anchor test --provider.cluster localnet

      - name: Upload IDL artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solana-layer-idl
          path: |
            solana-layer/target/idl/*.json
            solana-layer/target/types/*.ts
          if-no-files-found: warn

      - name: Upload program binary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solana-layer-program-binary
          path: solana-layer/target/deploy/*.so
          if-no-files-found: warn

  tests:
    name: EntryPoint Tests / ${{ matrix.job }}
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: raytracer-rust
          - job: pytest
          - job: docker-e2e
          - job: p2p-kademlia-smoke
          - job: smoke
          - job: coverage-assets-smoke
          - job: perf-budget
          - job: worker-cpp

    env:
      E2E_TIMEOUT_S: 2400
      E2E_WAIT_S: 1200
      DOCKER_CLIENT_TIMEOUT: 1200
      COMPOSE_HTTP_TIMEOUT: 1200

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Set up Rust
        if: matrix.job == 'raytracer-rust' || matrix.job == 'p2p-kademlia-smoke'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        if: matrix.job == 'pytest' || matrix.job == 'docker-e2e' || matrix.job == 'pytest-hosted' || matrix.job == 'smoke' || matrix.job == 'coverage-assets-smoke' || matrix.job == 'perf-budget'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Docker access
        if: matrix.job == 'docker-e2e' || matrix.job == 'smoke' || matrix.job == 'perf-budget' || matrix.job == 'worker-cpp'
        shell: bash
        run: |
          set -euo pipefail
          docker_path="$(command -v docker)"
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n "$docker_path" info >/dev/null 2>&1; then
            echo "Docker is unavailable and passwordless sudo cannot access it." >&2
            echo "Add the runner user to the docker group and restart the runner service." >&2
            exit 1
          fi
          wrapper_dir="$RUNNER_TEMP/docker-bin"
          mkdir -p "$wrapper_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec sudo -n \"$docker_path\" \"\$@\"" > "$wrapper_dir/docker"
          chmod +x "$wrapper_dir/docker"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Normalize shared workspace ownership
        if: matrix.job == 'docker-e2e' || matrix.job == 'smoke' || matrix.job == 'perf-budget' || matrix.job == 'worker-cpp'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            busybox:1.36 \
            chown -R "$(id -u):$(id -g)" /workspace
          git clean -ffdx

      - name: Test native raytracer
        if: matrix.job == 'raytracer-rust'
        run: cargo test --manifest-path workloads/raytracer/native/Cargo.toml

      - name: Install dev dependencies
        if: matrix.job == 'pytest' || matrix.job == 'perf-budget'
        run: python -m pip install -r requirements-dev.txt

      - name: Validate UTF-8 files
        if: matrix.job == 'pytest'
        run: python tools/check_utf8.py

      - name: Validate i18n locale packs
        if: matrix.job == 'pytest'
        run: python tools/check_i18n_locales.py --strict

      - name: Validate hard-coded i18n strings (changed lines)
        if: matrix.job == 'pytest'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          python tools/check_i18n_hardcoded_strings.py --base "$BASE_SHA" --head "$HEAD_SHA" --strict

      - name: Validate C++ interface contract naming
        if: matrix.job == 'pytest'
        run: python tools/style_check.py --rules cpp.interface_contract_naming

      - name: Validate C++ ownership safety (changed files)
        if: matrix.job == 'pytest'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          python tools/style_check.py \
            --rules cpp.no_unsafe_allocation \
            --changed-against "$BASE_SHA" \
            --changed-head "$HEAD_SHA"

      - name: Lint workload manifests
        if: matrix.job == 'pytest'
        run: ./silicium workload lint

      - name: Validate golden corpus
        if: matrix.job == 'pytest'
        run: ./silicium workload golden --strict

      - name: Run test suite via silicium CLI
        if: matrix.job == 'pytest'
        run: ./silicium test

      - name: Install e2e dependencies
        if: matrix.job == 'docker-e2e'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Docker e2e stack
        if: matrix.job == 'docker-e2e'
        run: bash ./ci/docker_e2e.sh

      - name: Run Kademlia smoke test
        if: matrix.job == 'p2p-kademlia-smoke'
        run: bash ./ci/p2p_kademlia_smoke.sh

      - name: Smoke test proxy + TLS
        if: matrix.job == 'smoke'
        run: ./silicium smoke

      - name: Validate coverage asset generator
        if: matrix.job == 'coverage-assets-smoke'
        run: |
          SAMPLE=tools/fixtures/coverage-summary-sample.json
          OUT=/tmp/coverage-assets
          mkdir -p "$OUT"
          python tools/worker_coverage_assets.py \
            --summary "$SAMPLE" \
            --output "$OUT" \
            --summary-html "$OUT/index.html" \
            --full-report coverage-full.html \
            --snapshot "$OUT/snapshot.svg"
          test -s "$OUT/badge.json"
          test -s "$OUT/badge.svg"
          test -s "$OUT/index.html"
          test -s "$OUT/snapshot.svg"

      - name: Run budget checks
        if: matrix.job == 'perf-budget'
        env:
          SILICIUM_MAX_JOBS: "2"
        run: |
          python tools/perf_budget.py \
            --all \
            --strict \
            --output /tmp/perf-budget-report.json

      - name: Publish budget summary
        if: matrix.job == 'perf-budget'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/perf-budget-report.json").read_text())
          lines = ["## Performance budget report", ""]
          for item in report.get("results", []):
              profile = item.get("profile", "unknown")
              metrics = item.get("metrics", {})
              budgets = item.get("budgets", {})
              violations = item.get("violations", [])
              status = "FAIL" if violations else "PASS"
              lines.append(f"- `{profile}`: **{status}**")
              lines.append(
                  "  "
                  + f"wall={metrics.get('wall_sec')} / {budgets.get('wall_sec')}, "
                  + f"cpu={metrics.get('cpu_sec')} / {budgets.get('cpu_sec')}, "
                  + f"rss={metrics.get('max_rss_kib')} / {budgets.get('max_rss_kib')}"
              )
              if violations:
                  for violation in violations:
                      lines.append(f"  - violation: `{violation}`")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          PY

      - name: Upload budget artifact
        continue-on-error: true
        if: matrix.job == 'perf-budget'
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report
          path: /tmp/perf-budget-report.json

      - name: Build executor (libs for worker)
        if: matrix.job == 'worker-cpp'
        run: make -C executor

      - name: Run worker tests (coverage)
        if: matrix.job == 'worker-cpp'
        run: make -C worker test

  pytest-hosted:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' }}
    runs-on: [self-hosted, fusion-linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite via silicium CLI (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            python ./silicium test --entrypoint-docker
          else
            echo "Docker unavailable on this runner; falling back to host-only Python tests."
            python ./silicium test
          fi
