name: Auto-merge on green

on:
  workflow_run:
    workflows: ["EntryPoint Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ vars.SILICIUM_ENABLE_HOSTED_CI == '1' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge PRs labeled automerge
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (!prs.length) {
              core.info("No PR associated with this workflow_run.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const prRef of prs) {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prRef.number });

              if (pr.data.state !== "open") {
                core.info(`PR #${pr.data.number} not open; skipping.`);
                continue;
              }
              if (pr.data.draft) {
                core.info(`PR #${pr.data.number} is draft; skipping.`);
                continue;
              }

              const labels = (pr.data.labels || []).map((l) => l.name);
              if (!labels.includes("automerge")) {
                core.info(`PR #${pr.data.number} missing 'automerge' label; skipping.`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.data.number,
                  merge_method: "squash",
                });
                core.info(`Merged PR #${pr.data.number}.`);
              } catch (err) {
                core.warning(`Failed to merge PR #${pr.data.number}: ${err.message || err}`);
              }
            }

