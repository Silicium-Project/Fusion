name: Test

on:
  workflow_call:
    inputs:
      skip_submodule_ci_gate:
        description: "The caller already ran the shared submodule CI gate."
        required: false
        type: boolean
        default: false
      web_stack_already_validated:
        description: "The caller already ran the web stack validation."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_submodule_ci_gate:
        description: "The caller already ran the shared submodule CI gate."
        required: false
        type: boolean
        default: false
      web_stack_already_validated:
        description: "The caller already ran the web stack validation."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fusion-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  submodule-ci-gate:
    if: ${{ !inputs.skip_submodule_ci_gate }}
    uses: ./.github/workflows/submodule-ci-gate.yml
    secrets: inherit

  web-stack:
    needs: [submodule-ci-gate]
    if: ${{ always() && (inputs.skip_submodule_ci_gate || needs.submodule-ci-gate.result == 'success') && !inputs.web_stack_already_validated }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/silicium-node/package-lock.json
            FrontEnd/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'

      - name: Validate web stack
        shell: bash
        run: bash deploy/ci/validate-web-stack.sh "$GITHUB_WORKSPACE"

  network-core:
    needs: [submodule-ci-gate]
    if: ${{ always() && (inputs.skip_submodule_ci_gate || needs.submodule-ci-gate.result == 'success') }}
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 90
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Prepare Docker access
        shell: bash
        run: |
          set -euo pipefail
          docker_path="$(command -v docker)"
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n "$docker_path" info >/dev/null 2>&1; then
            echo "Docker is unavailable and passwordless sudo cannot access it." >&2
            exit 1
          fi
          wrapper_dir="$RUNNER_TEMP/docker-bin"
          mkdir -p "$wrapper_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec sudo -n \"$docker_path\" \"\$@\"" > "$wrapper_dir/docker"
          chmod +x "$wrapper_dir/docker"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Normalize Docker workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/Network:/workspace" \
            busybox:1.36 \
            chown -R "$(id -u):$(id -g)" /workspace
          git -C Network clean -ffdx

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Network test dependencies
        shell: bash
        run: python -m pip install -r Network/requirements-dev.txt

      - name: Isolate raytracer runtime cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/silicium-raytracer-cache"
          rm -rf "$cache_dir"
          mkdir -p "$cache_dir"
          echo "SILICIUM_RAYTRACER_RUNTIME_CACHE=$cache_dir" >> "$GITHUB_ENV"

      - name: Run core checks
        shell: bash
        run: |
          set -euo pipefail
          CORE_CHECK_MODE=full CORE_CHECK_SCOPE=all bash Network/ci/core_check.sh

  network-e2e:
    needs: [submodule-ci-gate]
    if: ${{ always() && (inputs.skip_submodule_ci_gate || needs.submodule-ci-gate.result == 'success') }}
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 120
    env:
      E2E_TIMEOUT_S: 2400
      E2E_WAIT_S: 1200
      DOCKER_CLIENT_TIMEOUT: 1200
      COMPOSE_HTTP_TIMEOUT: 1200
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Prepare Docker access
        shell: bash
        run: |
          set -euo pipefail
          docker_path="$(command -v docker)"
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n "$docker_path" info >/dev/null 2>&1; then
            echo "Docker is unavailable and passwordless sudo cannot access it." >&2
            exit 1
          fi
          wrapper_dir="$RUNNER_TEMP/docker-bin"
          mkdir -p "$wrapper_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec sudo -n \"$docker_path\" \"\$@\"" > "$wrapper_dir/docker"
          chmod +x "$wrapper_dir/docker"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Normalize Docker workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/Network:/workspace" \
            busybox:1.36 \
            chown -R "$(id -u):$(id -g)" /workspace
          git -C Network clean -ffdx

      - name: Run Docker e2e stack
        shell: bash
        run: bash Network/ci/docker_e2e.sh

  network-smoke:
    needs: [submodule-ci-gate]
    if: ${{ always() && (inputs.skip_submodule_ci_gate || needs.submodule-ci-gate.result == 'success') }}
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 45
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Prepare Docker access
        shell: bash
        run: |
          set -euo pipefail
          docker_path="$(command -v docker)"
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n "$docker_path" info >/dev/null 2>&1; then
            echo "Docker is unavailable and passwordless sudo cannot access it." >&2
            exit 1
          fi
          wrapper_dir="$RUNNER_TEMP/docker-bin"
          mkdir -p "$wrapper_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec sudo -n \"$docker_path\" \"\$@\"" > "$wrapper_dir/docker"
          chmod +x "$wrapper_dir/docker"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Normalize Docker workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/Network:/workspace" \
            busybox:1.36 \
            chown -R "$(id -u):$(id -g)" /workspace
          git -C Network clean -ffdx

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run P2P smoke
        shell: bash
        run: bash Network/ci/p2p_kademlia_smoke.sh
