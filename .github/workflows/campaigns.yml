name: Complementary qualification
'on':
  schedule:
  - cron: 23 3 * * 1
  workflow_dispatch:
    inputs:
      suite:
        required: true
        type: choice
        default: network-integration
        options:
        - network-integration
        - network-wasm
        - solana
permissions:
  contents: read
concurrency:
  group: campaigns-${{ inputs.suite || 'weekly' }}
  cancel-in-progress: true
jobs:
  qualify:
    if: ${{ github.event.repository.private && github.repository == 'Silicium-Project/Integration' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        suite: ${{ github.event_name == 'schedule' && fromJSON('["network-integration","network-wasm","solana"]') || fromJSON(format('["{0}"]',
          inputs.suite)) }}
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: ${{ matrix.suite == 'solana' && '1.89.0' || '1.98.1' }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11.17'
    - run: node tools/ci/bootstrap.mjs "${{ matrix.suite }}"
    - run: node tools/dev.mjs test --suite "${{ matrix.suite }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: campaign-${{ matrix.suite }}
        path: .artifacts/reports
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
