name: Complementary qualification
'on':
  schedule:
  - cron: 23 3 * * 1
  workflow_dispatch:
    inputs:
      suite:
        required: true
        type: choice
        default: network-integration
        options:
        - network-integration
        - network-wasm
        - solana
permissions:
  contents: read
concurrency:
  group: campaigns-${{ inputs.suite || 'weekly' }}
  cancel-in-progress: true
jobs:
  qualify:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        suite: ${{ github.event_name == 'schedule' && fromJSON('["network-integration","network-wasm","solana"]') || fromJSON(format('["{0}"]',
          inputs.suite)) }}
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: ${{ matrix.suite == 'solana' && '1.89.0' || '1.98.0' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: node tools/ci/bootstrap.mjs "${{ matrix.suite }}"
    - run: node tools/dev.mjs test --suite "${{ matrix.suite }}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: campaign-${{ matrix.suite }}
        path: .artifacts/reports
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
