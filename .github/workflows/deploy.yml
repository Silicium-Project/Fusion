name: Deploy
'on':
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      environment:
        required: true
        type: choice
        options:
        - dev
        - prod
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ !github.event.repository.private && vars.SILICIUM_DELIVERY_ENABLED == '1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Verify and apply the exact candidate
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ inputs.release_id }}
        RELEASE_CHANNEL: ${{ inputs.environment }}
        DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
        DEPLOY_SSH_USER: silicium-deploy
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      run: node tools/ci/deploy.mjs
