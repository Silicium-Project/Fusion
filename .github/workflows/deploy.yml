name: Deploy
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      environment:
        required: true
        type: choice
        options:
        - dev
        - prod
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ !github.event.repository.private && vars.SILICIUM_DELIVERY_ENABLED == '1' && vars.SILICIUM_DELIVERY_CONTRACT == 'private-integration-v1' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.draft)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'development' || 'production' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - name: Verify and apply the exact candidate
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_id }}
        RELEASE_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'dev' || 'prod') || inputs.environment }}
        DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
        DEPLOY_SSH_USER: silicium-deploy
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      run: node tools/ci/deploy.mjs
