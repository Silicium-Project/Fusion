name: Project sync
'on':
  issues:
    types:
    - opened
    - edited
    - reopened
    - closed
    - assigned
    - unassigned
  pull_request_target:
    types:
    - opened
    - edited
    - reopened
    - closed
    - ready_for_review
    - converted_to_draft
    - synchronize
  workflow_run:
    workflows:
    - CI
    - Release
    - Deploy
    types:
    - completed
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Reconcile the private Project without writing, or apply changes after the feature flag is enabled
        required: true
        type: choice
        options:
        - dry-run
        - apply
        default: dry-run
permissions:
  contents: read
concurrency:
  group: silicium-project-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: project-automation
    if: ${{ !github.event.repository.private && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      && (vars.SILICIUM_PROJECT_AUTOMATION_ENABLED == '1' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'))
      && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: main
        persist-credentials: 'false'
    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      with:
        node-version: 22.23.4
        package-manager-cache: false
    - name: Create scoped Project installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ secrets.PROJECT_APP_CLIENT_ID }}
        private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        owner: Silicium-Project
        repositories: Workbench,planning-private
        permission-actions: read
        permission-checks: read
        permission-contents: read
        permission-deployments: read
        permission-issues: read
        permission-organization-projects: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && 'read' || 'write' }}
        permission-pull-requests: read
    - name: Reconcile trusted metadata
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'apply' }}
      shell: bash
      run: |
        if [[ "$APPLY" == "true" ]]; then
          node tools/ci/project-sync.mjs --apply
        else
          node tools/ci/project-sync.mjs
        fi
