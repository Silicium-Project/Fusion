name: Project sync
'on':
  issues:
    types:
    - opened
    - edited
    - reopened
    - closed
    - assigned
    - unassigned
  pull_request_target:
    types:
    - opened
    - edited
    - reopened
    - closed
    - ready_for_review
    - converted_to_draft
    - synchronize
  workflow_run:
    workflows:
    - CI
    - Release
    - Deploy
    types:
    - completed
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: silicium-project-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: project-automation
    if: ${{ !github.event.repository.private && vars.SILICIUM_PROJECT_AUTOMATION_ENABLED == '1' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        persist-credentials: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Create scoped Project installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ secrets.PROJECT_APP_CLIENT_ID }}
        private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
        owner: Silicium-Project
        repositories: Workbench,planning-private
        permission-checks: read
        permission-issues: read
        permission-organization-projects: write
        permission-pull-requests: read
    - name: Reconcile trusted metadata
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: node tools/ci/project-sync.mjs --apply
