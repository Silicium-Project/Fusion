name: Build

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fusion-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-reclaim:
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 5
    steps:
      - name: Reclaim stale component workspaces
        shell: bash
        run: |
          set -euo pipefail
          work_root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          for workspace in Fusion BackEnd FrontEnd Network; do
            path="$work_root/$workspace"
            if [[ -d "$path" ]]; then
              if sudo -n true >/dev/null 2>&1; then
                sudo -n rm -rf -- "$path"
              else
                rm -rf -- "$path"
              fi
            fi
          done
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rm -rf -- \
            "$cargo_home/registry/cache"
            "$cargo_home/registry/src"
            "$cargo_home/git/checkouts"
            "$HOME/.npm/_cacache"
          df -h / "$work_root"

  submodule-ci-gate:
    needs: [runner-reclaim]
    uses: ./.github/workflows/submodule-ci-gate.yml
    secrets: inherit

  tests:
    needs: [submodule-ci-gate]
    uses: ./.github/workflows/test.yml
    with:
      skip_submodule_ci_gate: true
    secrets: inherit

  build-linux:
    needs: [tests]
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 60
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Reclaim Linux build workspace
        shell: bash
        run: |
          set -euo pipefail
          git clean -ffdx
          git submodule foreach --recursive 'git clean -ffdx'
          rm -rf -- apps/silicium-node/src-tauri/target
          df -h "$GITHUB_WORKSPACE"

      - name: Verify Linux prerequisites
        run: |
          set -euo pipefail
          missing=()
          for package in \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf python3-pip; do
            installed=false
            if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              installed=true
            elif [[ "$package" == "libfuse2" ]] && dpkg-query -W -f='${Status}' libfuse2t64 2>/dev/null | grep -q 'install ok installed'; then
              installed=true
            fi
            if [[ "$installed" != true ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Linux prerequisites: %s\n' "${missing[*]}" >&2
            printf 'Run deploy/linux/bootstrap-submodule-runners.sh as root on the VPS.\n' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux development bundles
        shell: bash
        env:
          SILICIUM_RELEASE_CHANNEL: dev
          SILICIUM_RELEASE_BUILD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash "$GITHUB_WORKSPACE/deploy/ci/build-linux-client.sh" "$GITHUB_WORKSPACE"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-linux-build
          path: |
            apps/silicium-node/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/silicium-node/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Reclaim Linux build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            apps/silicium-node/node_modules \
            apps/silicium-node/src-tauri/target \
            Network/networked/p2p_node/target \
            Network/networked/compute_daemon/target
          df -h "$GITHUB_WORKSPACE"
