name: Build

on:
  pull_request:
  workflow_call:
    inputs:
      release_channel:
        description: "Release channel to build."
        required: false
        type: string
        default: dev
      stage_release:
        description: "Stage the validated bundles on the VPS for a release handoff."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel to build."
        required: false
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: fusion-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  submodule-ci-gate:
    uses: ./.github/workflows/submodule-ci-gate.yml
    with:
      release_channel: ${{ inputs.release_channel || 'dev' }}
    secrets: inherit

  tests:
    needs: [submodule-ci-gate]
    uses: ./.github/workflows/test.yml
    with:
      release_channel: ${{ inputs.release_channel || 'dev' }}
      skip_submodule_ci_gate: true
    secrets: inherit

  build-linux:
    needs: [tests]
    runs-on: [self-hosted, fusion-linux]
    timeout-minutes: 60
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Reclaim Linux build workspace
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffd
          git submodule foreach --recursive 'git reset --hard HEAD && git clean -ffd'
          df -h "$GITHUB_WORKSPACE"

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force --recursive -- BackEnd FrontEnd Network

      - name: Reclaim Linux build workspace
        shell: bash
        run: |
          set -euo pipefail
          # Preserve ignored dependency and Cargo target directories so the
          # self-hosted runner can reuse them between builds.
          git clean -ffd
          git submodule foreach --recursive 'git clean -ffd'
          df -h "$GITHUB_WORKSPACE"

      - name: Verify Linux prerequisites
        run: |
          set -euo pipefail
          missing=()
          for package in \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf python3-pip rpm; do
            installed=false
            if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              installed=true
            elif [[ "$package" == "libfuse2" ]] && dpkg-query -W -f='${Status}' libfuse2t64 2>/dev/null | grep -q 'install ok installed'; then
              installed=true
            fi
            if [[ "$installed" != true ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Linux prerequisites: %s\n' "${missing[*]}" >&2
            printf 'Run deploy/linux/bootstrap-submodule-runners.sh as root on the VPS.\n' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fusion-linux
          workspaces: |
            apps/silicium-node/src-tauri
            Network

      - name: Cache Tauri Linux bundler tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: ${{ runner.os }}-tauri-linux-bundler-${{ hashFiles('apps/silicium-node/package-lock.json', 'apps/silicium-node/src-tauri/Cargo.lock', 'deploy/ci/prepare-tauri-linux-tools.sh') }}
          restore-keys: |
            ${{ runner.os }}-tauri-linux-bundler-

      - name: Build Linux bundles
        shell: bash
        env:
          SILICIUM_RELEASE_CHANNEL: ${{ inputs.release_channel || 'dev' }}
          SILICIUM_RELEASE_BUILD: ${{ github.event.pull_request.head.sha || github.sha }}
          SILICIUM_RECLAIM_RUNTIME_TARGETS: auto
          SILICIUM_RUN_RELEASE_TESTS: "0"
        run: |
          bash "$GITHUB_WORKSPACE/deploy/ci/build-linux-client.sh" "$GITHUB_WORKSPACE"

      - name: Upload Linux bundles
        if: ${{ !inputs.stage_release }}
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-linux-build
          path: |
            apps/silicium-node/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/silicium-node/src-tauri/target/release/bundle/deb/*.deb
            apps/silicium-node/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

      - name: Stage development bundles on VPS
        if: ${{ inputs.stage_release }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'luis' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          vps_user="${VPS_USER:-luis}"
          vps_port="${VPS_PORT:-22}"
          [[ -n "${VPS_HOST:-}" ]] || { echo "Missing VPS_HOST" >&2; exit 1; }
          [[ -n "${VPS_SSH_KEY:-}" ]] || { echo "Missing VPS_SSH_KEY" >&2; exit 1; }
          [[ -n "${VPS_KNOWN_HOSTS:-}" ]] || { echo "Missing VPS_KNOWN_HOSTS" >&2; exit 1; }
          appimage="$(find apps/silicium-node/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find apps/silicium-node/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm="$(find apps/silicium-node/src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          [[ -s "$appimage" && -s "$deb" && -s "$rpm" ]] || {
            echo "The three development bundles are required for release staging." >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          release_staging="/tmp/silicium-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519")
          ssh "${ssh_opts[@]}" -p "$vps_port" "$vps_user@$VPS_HOST" \
            "install -d -m 700 '$release_staging'"
          scp "${ssh_opts[@]}" -P "$vps_port" "$appimage" \
            "$vps_user@$VPS_HOST:$release_staging/silicium-node-linux-dev.AppImage"
          scp "${ssh_opts[@]}" -P "$vps_port" "$deb" \
            "$vps_user@$VPS_HOST:$release_staging/silicium-node-linux-dev.deb"
          scp "${ssh_opts[@]}" -P "$vps_port" "$rpm" \
            "$vps_user@$VPS_HOST:$release_staging/silicium-node-linux-dev.rpm"

      - name: Reclaim Linux build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            apps/silicium-node/node_modules
          df -h "$GITHUB_WORKSPACE"
