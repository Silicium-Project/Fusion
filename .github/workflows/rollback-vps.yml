name: Rollback VPS

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git ref to rollback to (tag, branch, or SHA)"
        required: true
      release_version:
        description: "Release version label (for tracking only)"
        required: false
        default: "rollback"
      release_channel:
        description: "Release channel label"
        required: false
        default: "prod"
      vps_user:
        description: "SSH user on VPS; blank uses the VPS_USER secret."
        required: false
        default: ""
      vps_port:
        description: "SSH port on VPS"
        required: false
        default: "22"
      vps_root:
        description: "Root path of Fusion checkout on VPS"
        required: false
        default: "/opt/silicium"

permissions:
  contents: read

concurrency:
  group: silicium-vps-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, fusion-linux]
    env:
      DEPLOY_REF: ${{ github.event.inputs.deploy_ref }}
      RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
      RELEASE_BUILD: ${{ github.sha }}
      VPS_USER: ${{ github.event.inputs.vps_user || secrets.VPS_USER || 'luis' }}
      VPS_PORT: ${{ github.event.inputs.vps_port }}
      VPS_ROOT: ${{ github.event.inputs.vps_root }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error title=Missing secret::Configure VPS_SSH_KEY in repository Actions secrets."
            exit 1
          fi
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error title=Missing secret::Configure VPS_KNOWN_HOSTS in repository Actions secrets."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Rollback on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VPS_USER="${VPS_USER:-luis}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_ROOT="${VPS_ROOT:-/opt/silicium}"
          RELEASE_VERSION="${RELEASE_VERSION:-rollback}"
          RELEASE_CHANNEL="${RELEASE_CHANNEL:-prod}"
          if [ -z "$DEPLOY_REF" ]; then
            echo "::error title=Missing input::deploy_ref is required."
            exit 1
          fi
          if [ -z "$VPS_GITHUB_TOKEN" ]; then
            echo "::error title=Missing secret::Configure SILICIUM_DEPLOY_APP_CLIENT_ID and SILICIUM_DEPLOY_APP_PRIVATE_KEY."
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "::error title=Missing secret::Configure VPS_HOST in repository Actions secrets."
            exit 1
          fi

          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "VPS_ROOT='$VPS_ROOT' VPS_GITHUB_TOKEN='$VPS_GITHUB_TOKEN' DEPLOY_REF='$DEPLOY_REF' RELEASE_VERSION='$RELEASE_VERSION' RELEASE_CHANNEL='$RELEASE_CHANNEL' RELEASE_BUILD='$RELEASE_BUILD' bash -s" <<'REMOTE'
          set -euo pipefail
          GIT_AUTH="$(printf 'x-access-token:%s' "$VPS_GITHUB_TOKEN" | base64 -w 0)"
          git_auth() {
            sudo env \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraHeader \
              "GIT_CONFIG_VALUE_0=Authorization: Basic $GIT_AUTH" \
              git "$@"
          }

          sudo git config --system --add safe.directory "$VPS_ROOT"
          sudo git -C "$VPS_ROOT" remote set-url origin https://github.com/Silicium-Project/Fusion.git
          git_auth -C "$VPS_ROOT" fetch --tags --prune origin

          if git -C "$VPS_ROOT" rev-parse --verify --quiet "refs/remotes/origin/$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
            sudo git -C "$VPS_ROOT" reset --hard "origin/$DEPLOY_REF"
          elif git -C "$VPS_ROOT" rev-parse --verify --quiet "refs/tags/$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
          elif git -C "$VPS_ROOT" rev-parse --verify --quiet "$DEPLOY_REF" >/dev/null; then
            sudo git -C "$VPS_ROOT" checkout "$DEPLOY_REF"
          else
            echo "Rollback ref not found: $DEPLOY_REF" >&2
            exit 1
          fi

          sudo git -C "$VPS_ROOT" submodule sync --recursive
          for submodule in BackEnd FrontEnd Network; do
            submodule_path="$VPS_ROOT/$submodule"
            if [ -d "$submodule_path" ] && [ ! -e "$submodule_path/.git" ]; then
              sudo rm -rf -- "$submodule_path"
            fi
          done
          git_auth -C "$VPS_ROOT" submodule update --init --force --recursive
          unset GIT_AUTH VPS_GITHUB_TOKEN

          DATA_ROOT="$(python3 "$VPS_ROOT/deploy/release/channel.py" "$RELEASE_CHANNEL" --field data_dir)"
          sudo install -d -m 0755 "$DATA_ROOT/releases"
          cat <<EOF | sudo tee "$DATA_ROOT/releases/current.env" >/dev/null
          SILICIUM_RELEASE_VERSION=$RELEASE_VERSION
          SILICIUM_RELEASE_CHANNEL=$RELEASE_CHANNEL
          SILICIUM_RELEASE_BUILD=$RELEASE_BUILD
          SILICIUM_DEPLOY_REF=$DEPLOY_REF
          SILICIUM_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL="$RELEASE_CHANNEL" SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/linux/install-services.sh" "$VPS_ROOT"
          sudo SILICIUM_RELEASE_VERSION="$RELEASE_VERSION" SILICIUM_RELEASE_CHANNEL="$RELEASE_CHANNEL" SILICIUM_RELEASE_BUILD="$RELEASE_BUILD" bash "$VPS_ROOT/deploy/compose/deploy.sh" "$VPS_ROOT"
          sudo bash "$VPS_ROOT/deploy/linux/post-deploy-check.sh" "$VPS_ROOT"
          REMOTE

      - name: Publish rollback summary
        run: |
          {
            echo "## VPS rollback"
            echo ""
            echo "- deploy ref: $DEPLOY_REF"
            echo "- release version label: $RELEASE_VERSION"
            echo "- release channel label: $RELEASE_CHANNEL"
            echo "- release build: $RELEASE_BUILD"
            echo "- ssh user: ${VPS_USER:-luis}"
          } >> "$GITHUB_STEP_SUMMARY"
