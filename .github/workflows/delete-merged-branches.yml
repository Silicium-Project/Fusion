name: Delete merged branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch (issue-*)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr?.head?.ref;
            if (!head) {
              core.info("No head ref; skipping.");
              return;
            }
            if (!head.startsWith("issue-")) {
              core.info(`Not an issue branch (${head}); skipping.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${head}` });
              core.info(`Deleted branch ${head}.`);
            } catch (err) {
              core.warning(`Failed to delete ${head}: ${err.message || err}`);
            }

