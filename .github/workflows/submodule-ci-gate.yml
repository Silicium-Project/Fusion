name: Submodule CI gate

on:
  workflow_call:
    inputs:
      release_channel:
        description: "Submodule branch/channel to validate."
        required: false
        type: string
        default: dev

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network
          permission-contents: read

      - name: Check out Fusion metadata
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore full metadata checkout after sparse builds
        shell: bash
        run: |
          set -euo pipefail
          if git config --bool core.sparseCheckout >/dev/null 2>&1; then
            git sparse-checkout disable
          fi
          test -s .gitmodules
          test -s .github/scripts/check-submodule-ci.mjs
          test -s deploy/linux/bootstrap-submodule-runners.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure submodule runners are provisioned on the VPS
        shell: bash
        env:
          GITHUB_RUNNER_BOOTSTRAP_TOKEN: ${{ secrets.SILICIUM_SYNC_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_RUNNER_BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error title=Missing secret::Configure SILICIUM_SYNC_PUSH_TOKEN to provision BackEnd and FrontEnd VPS runners."
            exit 1
          fi
          if sudo -n true 2>/dev/null; then
            sudo -E bash deploy/linux/bootstrap-submodule-runners.sh
            exit 0
          fi

          echo "::notice::Passwordless sudo is unavailable; validating already provisioned submodule runner services."
          required_services=(
            "actions.runner.Silicium-Project-BackEnd.fusion-vps-backend.service"
            "actions.runner.Silicium-Project-FrontEnd.fusion-vps-frontend.service"
          )
          missing_services=()
          for service in "${required_services[@]}"; do
            if ! systemctl is-active --quiet "$service"; then
              missing_services+=("$service")
            fi
          done
          if (( ${#missing_services[@]} > 0 )); then
            printf 'Missing active submodule runner services: %s\n' "${missing_services[*]}" >&2
            echo "Passwordless sudo is required to provision missing VPS runners." >&2
            exit 1
          fi
          echo "Required BackEnd and FrontEnd runner services are already active."

      - name: Require healthy submodule mains
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.SILICIUM_SYNC_PUSH_TOKEN || steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The Solana Anchor build and the FrontEnd browser suite can take
          # longer than 45 minutes on the shared VPS runners. Keep the exact
          # commit checks, but give those required validations room to finish.
          deadline=$(( $(date +%s) + 5400 ))
          report="$RUNNER_TEMP/submodule-ci-gate.log"
          submodule_paths="$RUNNER_TEMP/submodule-ci-paths.txt"
          if ! git config --file .gitmodules --get-regexp '^submodule\..*\.path$' |
            sed -E 's/^submodule\.([^ ]+)\.path[[:space:]]+([^ ]+)$/\1 \2/' >"$submodule_paths"; then
            echo "Could not read submodule paths from .gitmodules." >&2
            exit 1
          fi
          if [[ ! -s "$submodule_paths" ]]; then
            echo "No submodule paths were found; refusing to skip submodule CI validation." >&2
            exit 1
          fi
          while true; do
            : > "$report"
            gate_failed=0
            submodule_count=0
            while read -r name path; do
              submodule_count=$((submodule_count + 1))
              url="$(git config --file .gitmodules --get "submodule.${name}.url")"
              repo="${url#https://github.com/}"
              repo="${repo#git@github.com:}"
              repo="${repo%.git}"
              pinned_sha="$(git ls-tree HEAD -- "$path" | awk 'NR == 1 { print $3 }')"
              [[ "$pinned_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
                echo "Could not resolve the pinned commit for $path from this Fusion checkout." >&2
                exit 1
              }
              if ! node .github/scripts/check-submodule-ci.mjs \
                --repo "$repo" --sha "$pinned_sha" --label "$path" >>"$report" 2>&1; then
                gate_failed=1
              fi
            done < "$submodule_paths"
            if (( submodule_count == 0 )); then
              echo "No submodule CI checks were evaluated; refusing to pass the gate." >&2
              exit 1
            fi
            if [[ "$gate_failed" == "0" ]]; then
              cat "$report"
              exit 0
            fi
            cat "$report"
            if grep -Eqi 'has no green commit candidate|has no visible Actions workflow runs|Cannot resolve |GitHub API .* failed' "$report"; then
              echo "No green submodule commit candidate is currently available." >&2
              exit 1
            fi
            if grep -Eqi 'has non-green workflow runs' "$report" && ! grep -Eqi ':(queued|in_progress)/' "$report"; then
              echo "Pinned submodule CI has completed without a green result." >&2
              exit 1
            fi
            if [[ "$(date +%s)" -ge "$deadline" ]]; then
              echo "Timed out waiting 90 minutes for submodule CI to complete." >&2
              exit 1
            fi
            echo "Submodule CI is still queued or running; retrying in 30 seconds."
            sleep 30
          done
