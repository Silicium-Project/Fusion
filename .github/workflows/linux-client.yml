name: Linux Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/silicium-node/**"
      - "Network"
      - "Network/**"
      - ".github/workflows/linux-client.yml"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SILICIUM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SILICIUM_DEPLOY_APP_PRIVATE_KEY }}
          owner: Silicium-Project
          repositories: Fusion,BackEnd,FrontEnd,Network

      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync declared submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global --get-regexp '^url\..*x-access-token.*github\.com.*\.insteadof$' |
            while read -r key _; do git config --global --unset-all "$key" || true; done || true
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git submodule sync -- BackEnd FrontEnd Network
          git -c "http.https://github.com/.extraHeader=AUTHORIZATION: Basic ${git_auth}" submodule update --init --force -- BackEnd FrontEnd Network

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf python3-pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/silicium-node/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/silicium-node/src-tauri

      - name: Install app dependencies
        working-directory: apps/silicium-node
        run: npm ci

      - name: Test and build Linux bundles
        working-directory: apps/silicium-node
        env:
          SILICIUM_RELEASE_CHANNEL: dev
          SILICIUM_RELEASE_BUILD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export SILICIUM_RELEASE_VERSION="$(node -p "require('./package.json').version")"
          npm run build
          # npm run prepare:runtime:linux # OBSOLETE: Replaced by native Rust build below
          
          echo "Building p2p_node and compute_daemon..."
          cargo build --release --manifest-path ../../Network/networked/p2p_node/Cargo.toml
          cargo build --release --manifest-path ../../Network/networked/compute_daemon/Cargo.toml
          
          mkdir -p src-tauri/resources/runtime/bin
          cp ../../Network/networked/p2p_node/target/release/p2p_node src-tauri/resources/runtime/bin/
          cp ../../Network/networked/compute_daemon/target/release/compute_daemon src-tauri/resources/runtime/bin/
          
          cargo test --manifest-path src-tauri/Cargo.toml
          npx tauri build --bundles deb,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: silicium-node-linux-pr
          path: |
            apps/silicium-node/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/silicium-node/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
