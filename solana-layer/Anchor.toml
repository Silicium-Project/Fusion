[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_layer = "9wuEBw5quCa5nxwAuwbb344Hks4o5TnKC5EyKq7jtgDu"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = false
