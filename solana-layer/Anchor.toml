[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
solana_layer = "4FPGViycNEGCtwnNs3NN2pPQu9ziTch8o9zkVc2VnKVP"

[programs.localnet]
solana_layer = "4FPGViycNEGCtwnNs3NN2pPQu9ziTch8o9zkVc2VnKVP"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = false
