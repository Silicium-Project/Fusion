id: verification/statistical-consistency/subsample
schema_version: 1
version: 0.1.0
engine: python
command: python verify_stats.py --config {config} --chunk {chunk} --subset {subset} --out {report}
resources:
  cpu: 2
  gpu: optional
  memory: 2Gi
  budget:
    wall_sec: 120
    cpu_sec: 180
    memory: 2Gi
taxonomy:
  category: verification
  domain: statistics
  complexity: medium
  resource_profile: cpu_heavy
  determinism: bounded_stochastic
  tags:
    - verification
    - statistics
    - simulation
    - stochastic
artifacts:
  input:
    - name: config
      type: application/json
    - name: chunk
      type: application/json
    - name: subset
      type: text/plain
  output:
    - name: report
      type: application/json
validation:
  policy: requires_non_producer
  metrics:
    - name: z_score
      threshold: 3
payment:
  unit: audit
  estimated_cost: 0.0004
presets:
  - name: default
    description: Subsample verification.
    vars:
      config: config.json
      chunk: chunk.json
      subset: subset.txt
      report: report.json
