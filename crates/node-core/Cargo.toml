[package]
name = "silicium_node_core"
version = "0.1.0"
edition = "2024"

[features]
default = []
runtime-wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
rand = "0.8.5"
rand_distr = "0.4.3"
serde.workspace = true
serde_json.workspace = true
bincode = { version = "2.0.1", features = ["serde"] }
ed25519-dalek.workspace = true
sha2 = "0.10.9"
thiserror = "2.0.17"
wasmtime = { version = "47.0.3", optional = true }
wasmtime-wasi = { version = "47.0.3", features = ["p1"], optional = true }

[dev-dependencies]
wat = "1.0.87"
