[package]
name = "silicium-embedding"
version = "0.1.0"
edition = "2024"
description = "Document search for Silicium: documents to passages, pinned embedding model, vectors and index search."

[lib]
name = "silicium_embedding"

[[bin]]
name = "silicium-embed"
path = "src/bin/silicium-embed/main.rs"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4.6", features = ["derive"] }
pdf-extract = "0.12"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
unicode-normalization = "0.1"

[features]
# A tiny in-memory model for tests and the local end-to-end check
# (`silicium_embedding::testing`). Never enabled in release builds.
test-model = []
