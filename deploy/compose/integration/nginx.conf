events {}

http {
  server {
    listen 80;
    server_name _;

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
