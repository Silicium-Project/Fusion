name: silicium-dev-miniworkers

x-miniworker-environment: &miniworker-environment
  SILICIUM_RELEASE_CHANNEL: dev
  SILICIUM_RELEASE_BUILD: vps-miniworker
  SILICIUM_NODE_ROLES: compute,verify
  SILICIUM_ALLOWED_WORKLOADS: raytracer
  SILICIUM_PARALLEL_TASKS: "1"
  SILICIUM_BOOTSTRAP_PEERS: ${SILICIUM_DEV_BOOTSTRAP_PEER:?Set SILICIUM_DEV_BOOTSTRAP_PEER}
  SILICIUM_P2P_BIND: 0.0.0.0
  SILICIUM_P2P_PORT: "0"
  SILICIUM_API_BIND: 127.0.0.1
  API_PORT: "9092"
  SILICIUM_DATA_DIR: /data
  SILICIUM_COMPUTE_ROOT: /data/work
  SILICIUM_DEVICE_PAIRING_API_URL: ${SILICIUM_DEVICE_PAIRING_API_URL:-http://pairing-relay:8080/devices/pair}
  SILICIUM_DEVICE_PAIRING_CODE_FILE: /run/secrets/device-pairing-code
  SILICIUM_SOLANA_CLUSTER: devnet
  SILICIUM_SOLANA_WALLET_PATH: /data/solana-wallet.json
  SILICIUM_RAYTRACER_BIN: /usr/local/bin/silicium-raytracer
  SILICIUM_COMPUTE_BIND: 127.0.0.1:9090

x-miniworker-defaults: &miniworker-defaults
  image: silicium-dev-miniworker:local
  build:
    context: ../../Network
    dockerfile: infra/miniworker.Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  depends_on:
    pairing-relay:
      condition: service_started
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  deploy:
    resources:
      limits:
        cpus: "0.10"
        memory: 160M
        pids: 64
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  healthcheck:
    test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9092/health && curl -fsS http://127.0.0.1:9090/health"]
    interval: 30s
    timeout: 5s
    start_period: 30s
    retries: 3
  networks:
    - dev-workers

services:
  pairing-relay:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=8m,mode=0750,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,mode=0750,uid=101,gid=101
    volumes:
      - ./dev-miniworker-pairing-relay.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      - dev-workers
      - backend-api
  miniworker-01:
    <<: *miniworker-defaults
    container_name: silicium-dev-miniworker-01
    environment: {<<: *miniworker-environment, SILICIUM_NODE_ID: miniworker-01}
    volumes:
      - miniworker-01-data:/data
      - ${SILICIUM_DEV_MINIWORKERS_PAIRING_DIR:-/etc/silicium-dev/miniworker-pairing}/miniworker-01.code:/run/secrets/device-pairing-code:ro
  miniworker-02:
    <<: *miniworker-defaults
