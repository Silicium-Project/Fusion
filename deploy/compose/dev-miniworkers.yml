name: silicium-dev-miniworkers

x-miniworker-defaults: &miniworker-defaults
  image: silicium-dev-miniworker:local
  build:
    context: ../../Network
    dockerfile: infra/miniworker.Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  deploy:
    resources:
      limits:
        cpus: "0.10"
        memory: 160M
        pids: 64
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  environment:
    SILICIUM_RELEASE_CHANNEL: dev
    SILICIUM_RELEASE_BUILD: vps-miniworker
    SILICIUM_NODE_ROLES: compute,verify
    SILICIUM_ALLOWED_WORKLOADS: raytracer
    SILICIUM_PARALLEL_TASKS: "1"
    SILICIUM_BOOTSTRAP_PEERS: ${SILICIUM_DEV_BOOTSTRAP_PEER:?Set SILICIUM_DEV_BOOTSTRAP_PEER}
    SILICIUM_P2P_BIND: 0.0.0.0
    SILICIUM_P2P_PORT: "0"
    SILICIUM_API_BIND: 127.0.0.1
    API_PORT: "9092"
    SILICIUM_DATA_DIR: /data
    SILICIUM_COMPUTE_ROOT: /data/work
    SILICIUM_SOLANA_CLUSTER: devnet
    SILICIUM_SOLANA_WALLET_PATH: /data/solana-wallet.json
    SILICIUM_RAYTRACER_BIN: /usr/local/bin/silicium-raytracer
    SILICIUM_COMPUTE_BIND: 127.0.0.1:9090
  healthcheck:
    test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9092/health && curl -fsS http://127.0.0.1:9090/health"]
    interval: 30s
    timeout: 5s
    start_period: 30s
    retries: 3
  networks:
    - dev-workers

services:
  miniworker-01:
    <<: *miniworker-defaults
    container_name: silicium-dev-miniworker-01
    volumes:
      - miniworker-01-data:/data
  miniworker-02:
