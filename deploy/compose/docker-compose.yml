name: silicium

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /var/lib/silicium/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../../BackEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/silicium/backend.env
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ALLOWED_ORIGINS: https://vps-910c1dbc.vps.ovh.net,https://213.32.68.67
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/silicium/Network:/opt/silicium/Network
      - /var/lib/silicium:/var/lib/silicium
    networks:
      - backend

  frontend:
    build:
      context: ../../FrontEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/silicium/frontend.env
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_DEVNET_DASHBOARD_URL: /dashboard/
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/compose/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    networks:
      - frontend

  orchestrator:
    build:
      context: ../..
      dockerfile: deploy/compose/orchestrator.Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/silicium/orchestrator.env
    command: ["python", "/opt/silicium/Network/silicium", "node", "start"]
    ports:
      - "46100:46100/tcp"
      - "46100:46100/udp"
    volumes:
      - /var/lib/silicium/network:/var/lib/silicium/network
    networks:
      - backend

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/silicium:/var/lib/silicium:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - backend
      - frontend

networks:
  backend:
    name: silicium-backend
  frontend:
    name: silicium-frontend
