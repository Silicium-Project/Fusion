name: silicium
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - /var/lib/silicium/postgres:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 12
  turn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
    - -n
    - --log-file=stdout
    - --no-cli
    - --lt-cred-mech
    - --realm=vps-910c1dbc.vps.ovh.net
    - --user=${SILICIUM_TURN_USER:-silicium}:${SILICIUM_TURN_PASSWORD:-demo-mesh}
    - --external-ip=${SILICIUM_TURN_EXTERNAL_IP:-213.32.68.67}/172.18.0.5
    - --relay-ip=172.18.0.5
    - --listening-port=3478
    - --tls-listening-port=5349
    - --cert=/etc/coturn/fullchain.pem
    - --pkey=/etc/coturn/privkey.pem
    - --min-port=49160
    - --max-port=49200
    ports:
    - 3478:3478/tcp
    - 3478:3478/udp
    - 5349:5349/tcp
    - 49160-49200:49160-49200/udp
    volumes:
    - /var/lib/silicium/coturn/fullchain.pem:/etc/coturn/fullchain.pem:ro
    - /var/lib/silicium/coturn/privkey.pem:/etc/coturn/privkey.pem:ro
    networks:
    - backend
  backend:
    build:
      context: ../../BackEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - /etc/silicium/backend.env
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}
        dbname=${POSTGRES_DB} port=5432 sslmode=disable
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ALLOWED_ORIGINS: https://vps-910c1dbc.vps.ovh.net,https://213.32.68.67
      SILICIUM_SEED_PEERS: http://213.32.68.67:46100
      SILICIUM_CONTROL_URL: http://orchestrator:46100/gossip/publish
      SILICIUM_ORCHESTRATOR_IDENTITY_KEY: /var/lib/silicium/network/orchestrator/state/peer_identity_ed25519.pem
      # Control-plane only: results/artifacts remain on authenticated P2P/HTTP.
      SILICIUM_RPC_EVENTS_CONNECT: tcp://experiment-api:9771
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 127.0.0.1:8080:8080
    - 46102:46102/tcp
    - 46102:46102/udp
    volumes:
    - /opt/silicium/Network:/opt/silicium/Network
    - /var/lib/silicium:/var/lib/silicium
    networks:
    - backend
  frontend:
    build:
      context: ../../FrontEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - /etc/silicium/frontend.env
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_DEVNET_DASHBOARD_URL: /dashboard/
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - frontend
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/compose/dashboard.Dockerfile
    restart: unless-stopped
    ports:
    - 127.0.0.1:5174:5174
    networks:
    - frontend
  orchestrator:
    build:
      context: ../..
      dockerfile: deploy/compose/orchestrator.Dockerfile
    restart: unless-stopped
    env_file:
    - /etc/silicium/orchestrator.env
    environment:
      SILICIUM_MESH_KEY: ${SILICIUM_MESH_KEY:-demo-mesh}
      SILICIUM_IDENTITY_DEV_MESH_AUTH: '0'
      SILICIUM_APP_VERSION: ${SILICIUM_APP_VERSION:?SILICIUM_APP_VERSION is required}
      SILICIUM_RELEASE_CHANNEL: ${SILICIUM_RELEASE_CHANNEL:-dev}
      SILICIUM_RELEASE_BUILD: ${SILICIUM_RELEASE_BUILD:?SILICIUM_RELEASE_BUILD is required}
      SILICIUM_PEER_ADVERTISE_URL: https://vps-910c1dbc.vps.ovh.net/orchestrator
      SILICIUM_PEER_HTTP_BIND: 0.0.0.0
      SILICIUM_PEER_HTTP_PORT: 46100
      SILICIUM_P2P_STUN_SERVER: ${SILICIUM_P2P_STUN_SERVER:-stun.l.google.com:19302}
      SILICIUM_P2P_TURN_SERVER: ${SILICIUM_P2P_TURN_SERVER:-turn:vps-910c1dbc.vps.ovh.net:3478}
      SILICIUM_P2P_TURN_USERNAME: ${SILICIUM_TURN_USER:-silicium}
      SILICIUM_P2P_TURN_PASSWORD: ${SILICIUM_TURN_PASSWORD:-demo-mesh}
      SILICIUM_P2P_TURN_TRANSPORT: ${SILICIUM_P2P_TURN_TRANSPORT:-udp}
      SILICIUM_PULL_TASKS_INTERVAL_S: ${SILICIUM_PULL_TASKS_INTERVAL_S:-0.5}
    command:
    - python
    - /opt/silicium/Network/silicium
    - node
    - start
    - --world
    - --node-id
    - orchestrator-1
    - --roles
    - resource,storage
    - --export-dir
    - /var/lib/silicium/network/orchestrator/export
    - --state-dir
    - /var/lib/silicium/network/orchestrator/state
    - --peer-http-bind
    - 0.0.0.0
    - --peer-http-port
    - '46100'
    - --peer-advertise-host
    - 213.32.68.67
    - --peer-advertise-port
    - '46100'
    - --gossip-advertise-host
    - 213.32.68.67
    - --gossip-advertise-port
    - '46100'
    - --reputation-score
    - '100.0'
    ports:
    - 46100:46100/tcp
    - 46100:46100/udp
    volumes:
    - /var/lib/silicium/network:/var/lib/silicium/network
    networks:
    - backend
  experiment-api:
    build:
      context: ../..
      dockerfile: deploy/compose/orchestrator.Dockerfile
    restart: unless-stopped
    env_file:
    - /etc/silicium/experiment-api.env
    command:
    - python
    - /opt/silicium/Network/tools/mcp_server.py
    - --bind
    - 0.0.0.0
    - --port
    - '46110'
    - --export-dir
    - /var/lib/silicium/network/orchestrator/export
    - --snapshot-dir
    - /var/lib/silicium/network/experiment-api/snapshots
    - --enable-tools
    - --rpc-bind
    - tcp://0.0.0.0:9770
    - --rpc-events-bind
    - tcp://0.0.0.0:9771
    - --log-format
    - json
    - --rpc-bind
    - tcp://0.0.0.0:9770
    volumes:
    - /var/lib/silicium/network:/var/lib/silicium/network
    networks:
    - backend
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
    - backend
    - experiment-api
    - frontend
    - dashboard
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - /var/lib/silicium:/var/lib/silicium:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
    - backend
    - frontend
networks:
  backend:
    name: silicium-backend
  frontend:
    name: silicium-frontend
