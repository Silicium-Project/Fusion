name: silicium
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - /var/lib/silicium/postgres:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 12
  turn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
    - -n
    - --log-file=stdout
    - --no-cli
    - --lt-cred-mech
    - --realm=vps-910c1dbc.vps.ovh.net
    - --user=${SILICIUM_TURN_USER:-silicium}:${SILICIUM_TURN_PASSWORD:-demo-mesh}
    - --external-ip=${SILICIUM_TURN_EXTERNAL_IP:-213.32.68.67}/172.18.0.5
    - --relay-ip=172.18.0.5
    - --listening-port=3478
    - --tls-listening-port=5349
    - --cert=/etc/coturn/fullchain.pem
    - --pkey=/etc/coturn/privkey.pem
    - --min-port=49160
    - --max-port=49200
    ports:
    - 3478:3478/tcp
    - 3478:3478/udp
    - 5349:5349/tcp
    - 49160-49200:49160-49200/udp
    volumes:
    - /var/lib/silicium/coturn/fullchain.pem:/etc/coturn/fullchain.pem:ro
    - /var/lib/silicium/coturn/privkey.pem:/etc/coturn/privkey.pem:ro
    networks:
    - backend
  backend:
    image: silicium-backend:latest
    build:
      context: ../../BackEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - /etc/silicium/backend.env
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}
        dbname=${POSTGRES_DB} port=5432 sslmode=disable
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ALLOWED_ORIGINS: https://vps-910c1dbc.vps.ovh.net,https://213.32.68.67
      SILICIUM_SEED_PEERS: http://host.docker.internal:46100
      SILICIUM_CONTROL_URL: http://host.docker.internal:46100/gossip/publish
      SILICIUM_ORCHESTRATOR_IDENTITY_KEY: /var/lib/silicium/network/orchestrator/backend-identity/peer_identity_ed25519.pem
      SILICIUM_SITE_STORAGE_DIR: /var/lib/silicium/site/jobs
      SILICIUM_WORKLOAD_STORAGE_DIR: /var/lib/silicium/site/runtime
      # Control-plane only: results/artifacts remain on authenticated P2P/HTTP.
      SILICIUM_RPC_EVENTS_CONNECT: tcp://host.docker.internal:9771
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 127.0.0.1:8080:8080
    - 46102:46102/tcp
    - 46102:46102/udp
    extra_hosts:
    # The named backend network uses the 172.18.0.0/16 bridge (the TURN
    # service and its relay address use the same fixed network).  Docker's
    # generic host-gateway resolves to the default bridge instead, which is
    # not reachable from this network on the VPS.
    - host.docker.internal:172.18.0.1
    volumes:
    - /opt/silicium/Network:/opt/silicium/Network
    - /var/lib/silicium:/var/lib/silicium
    networks:
    - backend
  frontend:
    build:
      context: ../../FrontEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
    - /etc/silicium/frontend.env
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_DEVNET_DASHBOARD_URL: /dashboard/
      NUXT_PUBLIC_UPDATE_MANIFEST_URL: /downloads/update-manifest.json
      NUXT_PUBLIC_STATUS_REFRESH_SECONDS: "30"
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - frontend
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/compose/dashboard.Dockerfile
    restart: unless-stopped
    ports:
    - 127.0.0.1:5174:5174
    networks:
    - frontend
  reputation_bridge:
    build:
      context: ../../Network/networked/reputation_bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=0.0.0.0:9091
    ports:
    - 127.0.0.1:9091:9091
    networks:
    - backend
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
    - backend
    - reputation_bridge
    - frontend
    - dashboard
    # The ingress must reach the host-side orchestrator on 46100. Sharing the
    # host network also lets it use the loopback-published web services without
    # relying on Docker bridge hairpin routing.
    network_mode: host
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - /var/lib/silicium:/var/lib/silicium:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
networks:
  backend:
    name: silicium-backend
  frontend:
    name: silicium-frontend
