events {}

http {
  client_max_body_size 100M;

  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name vps-910c1dbc.vps.ovh.net _;

    ssl_certificate /etc/letsencrypt/live/vps-910c1dbc.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-910c1dbc.vps.ovh.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads/ {
      alias /var/lib/silicium/downloads/;
      add_header Content-Disposition "attachment";
    }

    location /network-state/ {
      alias /var/lib/silicium/network/orchestrator/export/;
      add_header Cache-Control "no-store";
      add_header Access-Control-Allow-Origin "*";
    }

    location /network/ {
      proxy_pass http://dashboard:5174;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
