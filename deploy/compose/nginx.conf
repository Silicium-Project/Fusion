events {}

http {
  client_max_body_size 100M;
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name vps-910c1dbc.vps.ovh.net _;

    ssl_certificate /etc/letsencrypt/live/vps-910c1dbc.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-910c1dbc.vps.ovh.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      set $backend_upstream "http://backend:8080";
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /experiment-api/ {
      proxy_pass http://experiment-api:46110/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_request_buffering on;
    }

    location = /downloads/update-manifest.json {
      alias /var/lib/silicium/downloads/update-manifest.json;
      default_type application/json;
      add_header Cache-Control "no-store";
      add_header Access-Control-Allow-Origin "*";
    }

    location /downloads/ {
      alias /var/lib/silicium/downloads/;
      add_header Content-Disposition "attachment";
    }

    location /network-state/ {
      alias /var/lib/silicium/network/orchestrator/export/;
      add_header Cache-Control "no-store";
      add_header Access-Control-Allow-Origin "*";
    }

    location /orchestrator/ {
      proxy_pass http://213.32.68.67:46100/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location /network/ {
      set $dashboard_upstream "http://dashboard:5174";
      proxy_pass $dashboard_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $frontend_upstream "http://frontend:3000";
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
