events {}

http {
  client_max_body_size 100M;

  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name vps-910c1dbc.vps.ovh.net _;

    ssl_certificate /etc/letsencrypt/live/vps-910c1dbc.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-910c1dbc.vps.ovh.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /experiment-api/ {
      # The legacy experiment API is no longer exposed as a Compose upstream.
      # Keep the route explicit so Nginx can start even when the old host is absent.
      return 404;
    }

    location = /downloads/update-manifest.json {
      alias /var/lib/silicium/downloads/update-manifest.json;
      default_type application/json;
      add_header Cache-Control "no-store";
      add_header Access-Control-Allow-Origin "*";
    }

    location /downloads/ {
      alias /var/lib/silicium/downloads/;
      default_type application/octet-stream;
      add_header Content-Disposition "attachment";
    }

    location /network-state/ {
      alias /var/lib/silicium/network/orchestrator/export/;
      add_header Cache-Control "no-store";
      add_header Access-Control-Allow-Origin "*";
    }

    location /orchestrator/ {
      # The orchestrator is a host-side service. Route through the Docker host
      # instead of the VPS public IP so the public firewall never becomes a
      # dependency for the site's own node registration path.
      proxy_pass http://host.docker.internal:__SILICIUM_ORCHESTRATOR_PORT__/;
      proxy_set_header Host $host;
      proxy_set_header X-Silicium-Original-URI $request_uri;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location /network/ {
      proxy_pass http://dashboard:5174;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
