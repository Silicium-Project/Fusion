name: ${SILICIUM_E2E_COMPOSE_PROJECT_NAME:-silicium-e2e-vps}

x-worker-base: &worker-base
  image: python:3.12-slim-bookworm
  working_dir: /workspace
  entrypoint:
    - python3
  volumes:
    - ${SILICIUM_E2E_ROOT:-/opt/silicium}:/workspace:ro
    - ${SILICIUM_E2E_DATA_ROOT:-/var/lib/silicium}:/var/lib/silicium

services:
  e2e-worker-compute-a:
    <<: *worker-base
    command:
      - /workspace/Network/tools/e2e_worker.py
      - --export-dir
      - /var/lib/silicium/network/orchestrator/export
      - --worker-id
      - worker-compute-a
      - --roles
      - compute
      - --expected-tasks
      - "2"
      - --transport
      - vps-compose
      - --task-prefix
      - ${E2E_TASK_PREFIX:-}

  e2e-worker-compute-b:
    <<: *worker-base
    command:
      - /workspace/Network/tools/e2e_worker.py
      - --export-dir
      - /var/lib/silicium/network/orchestrator/export
      - --worker-id
      - worker-compute-b
      - --roles
      - compute
      - --expected-tasks
      - "2"
      - --transport
      - vps-compose
      - --task-prefix
      - ${E2E_TASK_PREFIX:-}

  e2e-worker-verify-a:
    <<: *worker-base
    command:
      - /workspace/Network/tools/e2e_worker.py
      - --export-dir
      - /var/lib/silicium/network/orchestrator/export
      - --worker-id
      - worker-verify-a
      - --roles
      - verify
      - --expected-tasks
      - "2"
      - --transport
      - vps-compose
      - --task-prefix
      - ${E2E_TASK_PREFIX:-}

  e2e-worker-verify-b:
    <<: *worker-base
    command:
      - /workspace/Network/tools/e2e_worker.py
      - --export-dir
      - /var/lib/silicium/network/orchestrator/export
      - --worker-id
      - worker-verify-b
      - --roles
      - verify
      - --expected-tasks
      - "2"
      - --transport
      - vps-compose
      - --task-prefix
      - ${E2E_TASK_PREFIX:-}
