<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Worker coverage snapshot">
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #111827; stroke: #1f2937; stroke-width: 1; }
    .track { fill: none; stroke: #1f2937; stroke-width: 12; }
    .arc { fill: none; stroke-width: 12; stroke-linecap: round; }
    .label { fill: #cbd5e1; font-family: "Inter", "Segoe UI", sans-serif; font-size: 13px; text-anchor: middle; }
    .value { fill: #e2e8f0; font-family: "Inter", "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect class="bg" x="0" y="0" width="320" height="150" rx="14" />
  <rect class="card" x="6" y="6" width="308" height="138" rx="12" />
  <circle class="track" cx="60" cy="70" r="32" /><circle class="arc" cx="60" cy="70" r="32" stroke="#97CA00" stroke-dasharray="201.06" stroke-dashoffset="26.84" transform="rotate(-90 60 70)" />
  <text class="value" x="60" y="74">86.7%</text>
  <text class="label" x="60" y="118">Lignes</text>

  <circle class="track" cx="160" cy="70" r="32" /><circle class="arc" cx="160" cy="70" r="32" stroke="#4c1" stroke-dasharray="201.06" stroke-dashoffset="14.19" transform="rotate(-90 160 70)" />
  <text class="value" x="160" y="74">92.9%</text>
  <text class="label" x="160" y="118">Fonctions</text>

  <circle class="track" cx="260" cy="70" r="32" /><circle class="arc" cx="260" cy="70" r="32" stroke="#fe7d37" stroke-dasharray="201.06" stroke-dashoffset="100.11" transform="rotate(-90 260 70)" />
  <text class="value" x="260" y="74">50.2%</text>
  <text class="label" x="260" y="118">Branches</text>
</svg>