name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel to validate."
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

env:
  SILICIUM_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || (github.ref_name == 'main' && 'prod' || 'dev') }}

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: [self-hosted, fusion-linux]
    outputs:
      go: ${{ steps.detect.outputs.go }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed surfaces
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          force_all=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "${BASE_SHA:-}" || "${BASE_SHA:-}" =~ ^0+$ ]]; then
            force_all=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if [[ "$force_all" == true ]]; then
            changed_paths="__all__"
          else
            changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi
          go=false
          if [[ "$force_all" == true ]] || printf '%s\n' "$changed_paths" | grep -Eq '(^|/)(cmd|internal|Database)/|\.go$|^go\.(mod|sum)$|^Dockerfile$|^\.github/workflows/'; then
            go=true
          fi
          printf 'Changed paths:\n%s\n' "$changed_paths"
          printf 'go=%s\n' "$go" >> "$GITHUB_OUTPUT"

  test:
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go tests
        run: go test ./...

  build:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: [self-hosted, fusion-linux]
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Build Go binaries
        run: go build ./...
