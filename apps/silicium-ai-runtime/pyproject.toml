[project]
name = "silicium-ai-runtime"
version = "0.1.0"
description = "Runs the models of the Silicium AI catalogue for the node: offline, safetensors only, no code from models."
requires-python = ">=3.11"
license = { text = "MIT" }
# Versions are pinned by the lock file the desktop app installs from
# (`uv.lock`, one per platform variant: cpu, cuda, rocm, metal).
dependencies = [
    "torch>=2.6",
    "transformers>=4.57,<5",
    "sentence-transformers>=5.1,<6",
    "timm>=1.0.15,<2",
    "safetensors>=0.4",
    "pillow>=10",
    "soundfile>=0.12",
    "scipy>=1.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
silicium-ai-runtime = "silicium_ai_runtime.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["silicium_ai_runtime"]
