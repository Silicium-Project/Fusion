services:
  silicium-node:
    build: .
    image: network/silicium-node
    command: ["silicium-node", "start", "--network", "testnet"]
    tty: true
    ports:
      - "8899:8899"
      - "8000-8020:8000-8020"
    volumes:
      - .:/workspace
      - ./data/ledger:/home/solana/.silicium/ledger
    working_dir: /workspace
    environment:
      - SILICIUM_NETWORK=testnet
