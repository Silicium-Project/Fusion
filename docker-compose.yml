services:
  frontend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: silicium_frontend
      environment:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
        NUXT_PUBLIC_SOLANA_RPC: ${NUXT_PUBLIC_SOLANA_RPC:-https://solana-devnet.api.onfinality.io/public}
        NUXT_PUBLIC_UPDATE_MANIFEST_URL: ${NUXT_PUBLIC_UPDATE_MANIFEST_URL:-/downloads/update-manifest.json}
        NUXT_PUBLIC_STATUS_REFRESH_SECONDS: ${NUXT_PUBLIC_STATUS_REFRESH_SECONDS:-30}
      ports:
        - "3000:3000"
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 15s
      networks:
        - app-network

networks:
  app-network:
    driver: bridge
