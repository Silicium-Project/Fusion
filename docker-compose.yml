services:
  silicium-node:
    build: .
    image: network/silicium-node
    command: ["silicium-node", "start", "--network", "testnet"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tty: true
    ports:
      - "8899:8899"
      - "8000-8020:8000-8020"
    volumes:
      - .:/workspace:Z
      - ./data/ledger:/home/solana/.silicium/ledger:Z
    working_dir: /workspace
    environment:
      - SILICIUM_NETWORK=testnet
      - SILICIUM_RPC_BIND_ADDRESS=0.0.0.0
    security_opt:
      - label=disable
  silicium-localnet:
    build: .
    image: network/silicium-node
    command: ["silicium-node", "start", "--network", "silicium"]
    tty: true
    ports:
      - "8900:8899"
      - "8100-8120:8000-8020"
    volumes:
      - .:/workspace:Z
      - ./data/local-ledger:/home/solana/.silicium/ledger:Z
    working_dir: /workspace
    environment:
      - SILICIUM_NETWORK=silicium
      - SILICIUM_RPC_PORT=8899
      - SILICIUM_RPC_BIND_ADDRESS=0.0.0.0
      - SILICIUM_DYNAMIC_PORT_RANGE=8000-8020
      - SILICIUM_LOCAL_RESET=false
      - SILICIUM_CLI_URL=http://127.0.0.1:8899
      - SILICIUM_PUBLIC_RPC_ADDRESS=
    security_opt:
      - label=disable
  silicium-devnet:
    build: .
    image: network/silicium-node
    command: ["silicium-node", "start", "--network", "devnet"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tty: true
    ports:
      - "8910:8899"
      - "8200-8220:8000-8020"
    volumes:
      - .:/workspace:Z
      - ./data/devnet-ledger:/home/solana/.silicium/ledger:Z
    working_dir: /workspace
    environment:
      - SILICIUM_NETWORK=devnet
      - SILICIUM_RPC_PORT=8899
      - SILICIUM_RPC_BIND_ADDRESS=0.0.0.0
      - SILICIUM_DYNAMIC_PORT_RANGE=8000-8020
      - SILICIUM_CLI_URL=https://api.devnet.solana.com
      - SILICIUM_PUBLIC_RPC_ADDRESS=
    security_opt:
      - label=disable
    profiles:
      - devnet
  silicium-mainnet:
    build: .
    image: network/silicium-node
    command: ["silicium-node", "start", "--network", "mainnet"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tty: true
    ports:
      - "8920:8899"
      - "8300-8320:8000-8020"
    volumes:
      - .:/workspace:Z
      - ./data/mainnet-ledger:/home/solana/.silicium/ledger:Z
    working_dir: /workspace
    environment:
      - SILICIUM_NETWORK=mainnet
      - SILICIUM_RPC_PORT=8899
      - SILICIUM_RPC_BIND_ADDRESS=0.0.0.0
      - SILICIUM_DYNAMIC_PORT_RANGE=8000-8020
      - SILICIUM_CLI_URL=https://api.mainnet-beta.solana.com
      - SILICIUM_PUBLIC_RPC_ADDRESS=
    security_opt:
      - label=disable
    profiles:
      - mainnet
