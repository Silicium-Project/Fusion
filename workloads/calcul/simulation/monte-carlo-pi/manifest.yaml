id: calcul/simulation/monte-carlo-pi
schema_version: 2
version: 1.0.0
runtime:
  kind: python
  handler: workloads.standard.handlers:monte_carlo_pi
engine: python
command: python -m workloads.standard.run --workload calcul/simulation/monte-carlo-pi --input {config} --output {output}
resources:
  cpu: 2
  gpu: optional
  memory: 256Mi
  budget:
    wall_sec: 240
    cpu_sec: 240
    memory: 256Mi
taxonomy:
  category: calcul
  domain: simulation
  complexity: medium
  resource_profile: cpu_heavy
  determinism: deterministic
  tags:
    - simulation
    - monte_carlo
    - statistics
    - cpu
    - deterministic
artifacts:
  input:
    - name: config
      type: application/json
  output:
    - name: output
      type: application/json
    - name: hash
      type: text/plain
validation:
  default_verifier: verification/statistical-consistency/subsample
  hash: sha256
payment:
  unit: sample
  estimated_cost: 0.000001
presets:
  - name: default
    description: Seeded Monte Carlo estimate of pi.
    vars:
      config: monte-carlo.json
      output: monte-carlo-result.json
