id: calcul/rendering/blender
schema_version: 2
version: 0.2.0
runtime:
  kind: planned
engine: container
command: blender -b {scene} -o {output_pattern} -f {frame}
resources:
  cpu: 8
  gpu: optional
  memory: 8Gi
  budget:
    wall_sec: 600
    cpu_sec: 900
    memory: 8Gi
taxonomy:
  category: calcul
  domain: rendering
  complexity: high
  resource_profile: gpu_optional
  determinism: deterministic
  tags:
    - rendering
    - gpu
    - deterministic
artifacts:
  input:
    - name: scene
      type: application/octet-stream
    - name: frame
      type: text/plain
  output:
    - name: image
      type: image/png
    - name: hash
      type: text/plain
validation:
  default_verifier:
    - verification/rendering-spotcheck
    - verification/hash-audit
payment:
  unit: frame
  estimated_cost: 0.003
presets:
  - name: default
    description: Single frame render.
    vars:
      scene: scene.blend
      output_pattern: frame_
      frame: 1
