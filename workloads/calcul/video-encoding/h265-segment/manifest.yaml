id: calcul/video-encoding/h265-segment
schema_version: 2
version: 0.2.0
runtime:
  kind: planned
engine: container
command: >
  ffmpeg -y -i {input} -c:v {codec} -preset {preset} -crf {crf} -c:a copy {output}
resources:
  cpu: 4
  gpu: optional
  memory: 4Gi
  budget:
    wall_sec: 300
    cpu_sec: 450
    memory: 4Gi
taxonomy:
  category: calcul
  domain: video
  complexity: high
  resource_profile: gpu_optional
  determinism: deterministic
  tags:
    - transcoding
    - cpu
    - deterministic
artifacts:
  input:
    - name: input
      type: video/mp4
    - name: encoding
      type: application/json
  output:
    - name: segment
      type: video/mp4
    - name: hash
      type: text/plain
validation:
  default_verifier: verification/hash-audit
  redundancy: 0.1
payment:
  unit: fragment
  estimated_cost: 0.001
presets:
  - name: default
    description: Baseline H.265 encode.
    vars:
      input: input.mp4
      codec: libx265
      preset: medium
      crf: 28
      output: segment.mp4
