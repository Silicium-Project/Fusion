id: verification/rendering/raytracer-fragment
schema_version: 2
version: 2.0.0
runtime:
  kind: python
  handler: workloads.raytracer.node_tasks:verify_fragment_milestone
engine: native
command: >
  python workloads/raytracer/verify.py --scene {scene} --result {result}
  --expected-hash {expected_hash} --x-start {x_start} --x-end {x_end}
  --y-start {y_start} --y-end {y_end}
resources:
  cpu: 1
  gpu: none
  memory: 512Mi
  budget:
    wall_sec: 300
    cpu_sec: 300
    memory: 512Mi
taxonomy:
  category: verification
  domain: rendering
  complexity: low
  resource_profile: cpu_light
  determinism: deterministic
  tags:
    - verification
    - rendering
    - spotcheck
    - deterministic
artifacts:
  input:
    - name: scene
      type: text/plain
    - name: challenge
      type: application/json
  output:
    - name: verdict
      type: application/json
validation:
  strategies:
    - random-row-milestone-v1
    - random-tile-row-milestone-v2
payment:
  unit: pixel
  estimated_cost: 0.0000002
parameters:
  strategy: random-tile-row-milestone-v2
  default_batch_rows: 20
  samples_per_fragment: 1
  exclude_compute_worker: true
  max_sample_rows: 256
presets:
  - name: default
    description: Re-render one milestone of the demo scene.
    vars:
      scene: workloads/raytracer/examples/demo-scene.cfg
      result: fragment.ppm
      expected_hash: sha256-of-the-milestone-pixels
      x_start: 0
      x_end: 160
      y_start: 0
      y_end: 20
