[package]
name = "silicium-llm"
version = "0.1.0"
edition = "2024"
description = "Batch AI processing for Silicium: one instruction applied to every item of a list by a pinned language model run with Ollama."

[lib]
name = "silicium_llm"

[[bin]]
name = "silicium-llm"
path = "src/bin/silicium-llm/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
unicode-normalization = "0.1"
axum = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true

[features]
# A fake Ollama server (`silicium_llm::testing`, `silicium-llm fake-ollama`)
# for tests and the local end-to-end check. Never enabled in release builds.
test-ollama = ["dep:axum"]
