id: calcul/integrity/sha256
schema_version: 1
version: 1.0.0
engine: python
command: python -m workloads.standard.run --workload calcul/integrity/sha256 --input {artifact} --output {output}
resources:
  cpu: 1
  gpu: none
  memory: 256Mi
  budget:
    wall_sec: 30
    cpu_sec: 30
    memory: 256Mi
taxonomy:
  category: calcul
  domain: integrity
  complexity: low
  resource_profile: cpu_light
  determinism: deterministic
  tags:
    - hash
    - cpu
    - deterministic
artifacts:
  input:
    - name: artifact
      type: application/octet-stream
  output:
    - name: output
      type: application/json
    - name: hash
      type: text/plain
validation:
  default_verifier: verification/hash-audit/sha256
  hash: sha256
payment:
  unit: byte
  estimated_cost: 0.000001
presets:
  - name: default
    description: Hash a small binary payload.
    vars:
      artifact: payload.bin
      output: hash-result.json
