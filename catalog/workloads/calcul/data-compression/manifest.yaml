id: calcul/data-compression/zstd
schema_version: 1
version: 0.1.0
engine: container
command: >
  tar -cf {output_tar} {input_dir} &&
  zstd -{level} {output_tar} -o {output} &&
  sha256sum {output} > {hash_file}
resources:
  cpu: 2
  gpu: none
  memory: 2Gi
  budget:
    wall_sec: 180
    cpu_sec: 240
    memory: 2Gi
taxonomy:
  category: calcul
  domain: compression
  complexity: medium
  resource_profile: cpu_heavy
  determinism: deterministic
  tags:
    - compression
    - cpu
    - deterministic
artifacts:
  input:
    - name: input_dir
      type: application/octet-stream
  output:
    - name: archive
      type: application/zstd
    - name: hash
      type: text/plain
validation:
  default_verifier: verification/hash-audit
payment:
  unit: batch
  estimated_cost: 0.0008
