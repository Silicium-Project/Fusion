[package]
name = "p2p_node"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.33"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "quic", "dns", "websocket", "noise", "yamux", "gossipsub", "kad", "mdns", "macros", "identify", "autonat", "relay"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
silicium_node_core = { path = "../silicium_node_core" }
